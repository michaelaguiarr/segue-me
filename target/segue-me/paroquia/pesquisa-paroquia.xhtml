<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	template="/WEB-INF/template.xhtml">

	<ui:define name="title">Pesquisa Paróquia</ui:define>

	<f:metadata>
		<f:viewAction action="#{pesquisaParoquiaBean.inicializar()}" />
	</f:metadata>

	<ui:define name="search">
		<div class="ui-inputgroup">
			<p:inputText id="value" autocomplete="off"
				value="#{pesquisaParoquiaBean.searchValue}" placeholder="Pesquisar">
				<p:ajax listener="#{pesquisaParoquiaBean.pesquisar()}"
					update="datatable-paroquia messages" event="keyup" />
			</p:inputText>
		</div>
	</ui:define>

	<ui:define name="content">

		<h:form id="form">
			<ui:include src="/WEB-INF/facelets/paroquia/paroquia-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>Pesquisa Paróquia</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />

						<div class="ui-g">

							<p:dataTable var="paroquia" id="datatable-paroquia"
								value="#{pesquisaParoquiaBean.listaParoquia}" reflow="true"
								selectionMode="single"
								selection="#{pesquisaParoquiaBean.paroquiaSelecionado}"
								rowKey="#{paroquia}" emptyMessage="Paróquia não encontrada!">

								<p:ajax event="rowSelect"
									listener="#{pesquisaParoquiaBean.selecionar()}" />

								<p:column headerText="Paróquia">
									<h:outputText value="#{paroquia.descricao}" />
								</p:column>

								<p:column headerText="Cidade">
									<h:outputText value="#{paroquia.cidade}/#{paroquia.estado}" />
								</p:column>
							</p:dataTable>

						</div>
					</div>
				</div>
			</div>
		</h:form>

	</ui:define>

</ui:composition>
