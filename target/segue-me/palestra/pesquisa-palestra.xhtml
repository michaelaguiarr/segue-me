<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	template="/WEB-INF/template.xhtml">

	<ui:define name="title">Pesquisa Palestra</ui:define>

	<f:metadata>
		<f:viewAction action="#{pesquisaPalestraBean.inicializar()}" />
	</f:metadata>

	<ui:define name="search">
		<div class="ui-inputgroup">
			<p:inputText id="value" autocomplete="off"
				value="#{pesquisaPalestraBean.searchValue}" placeholder="Pesquisar">
				<p:ajax listener="#{pesquisaPalestraBean.pesquisar()}"
					update="datatable-ecc messages" event="keyup" />
			</p:inputText>
		</div>
	</ui:define>

	<ui:define name="content">

		<h:form id="form">
			<ui:include src="/WEB-INF/facelets/palestra/palestra-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>Pesquisa Palestra</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />

						<div class="ui-g">

							<p:dataTable var="palestra" id="datatable-ecc"
								value="#{pesquisaPalestraBean.listaPalestra}" reflow="true"
								selectionMode="single"
								selection="#{pesquisaPalestraBean.palestraSelecionado}"
								rowKey="#{palestra}" emptyMessage="Palestra não encontrada!">

								<p:ajax event="rowSelect"
									listener="#{pesquisaPalestraBean.selecionar()}" />

								<p:column headerText="Título" width="350">
									<h:outputText value="#{palestra.nome}" />
								</p:column>

								<p:column headerText="Ordem" sortBy="#{palestra.ordem}">
									<h:outputText value="#{palestra.ordem}" />
								</p:column>

								<p:column headerText="Status">
									<span class="situacao #{palestra.coresStatus} MarLeft10">#{palestra.ativo
										? 'Ativo' : 'Inativo'}</span>
								</p:column>
							</p:dataTable>

						</div>
					</div>
				</div>
			</div>
		</h:form>

	</ui:define>

</ui:composition>
