<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="title">Cadastro Palestra</ui:define>

	<ui:define name="search">
		<p:button outcome="/palestra/pesquisa-palestra" value="Pesquisar"
			icon="fa fa-search" />
	</ui:define>

	<f:metadata>
		<o:viewParam name="palestra" value="#{cadastroPalestraBean.palestra}" />
		<f:viewAction action="#{cadastroPalestraBean.inicializar()}" />
	</f:metadata>

	<ui:define name="content">
		<h:form id="form-cadastro">
			<ui:include src="/WEB-INF/facelets/palestra/palestra-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>#{cadastroPalestraBean.editando ? 'Edição Palestra' :
							'Novo Palestra'}</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
						<p:focus for="titulo" />

						<div class="ui-g">
							<div class="ui-g-12">
								<p:outputLabel value="Título" for="titulo" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:inputText id="titulo"
									value="#{cadastroPalestraBean.palestra.nome}" required="true"
									placeholder="Titulo da Palestra" />
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Duracao" for="duracao" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:inputText id="duracao"
									value="#{cadastroPalestraBean.palestra.duracao}"
									placeholder="Em Minutos" />
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Ordem" for="ordem" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:spinner id="ordem" value="#{cadastroPalestraBean.palestra.ordem}"
									min="1" max="20" rendered="true" />
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Ativo" for="ativo" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:selectBooleanButton id="ativo"
									value="#{cadastroPalestraBean.palestra.ativo}" onLabel="Sim"
									offLabel="Não" onIcon="ui-icon-check" offIcon="ui-icon-close"
									style="width:60px" />
							</div>

							<div class="save ui-g-12">
								<p:commandButton value="Salvar" style="width: auto;"
									action="#{cadastroPalestraBean.salvar()}" update="@form"
									process="@form" icon="fa fa-save" styleClass="green-btn" />


								<p:commandButton icon="fa fa-trash" value="Excluir"
									style="width: auto; margin-left: 15px;"
									oncomplete="PF('confirmacaoExclusao').show();" process="@this"
									styleClass="red-btn"
									update=":form-cadastro:confirmacaoExclusaoDialog"
									rendered="#{cadastroPalestraBean.editando}" />

								<p:button value="Cancelar"
									style="width: auto; margin-left: 15px;"
									outcome="pesquisa-palestra" icon="fa fa-remove" />
							</div>

						</div>
					</div>
				</div>
			</div>
			<p:confirmDialog header="Exclusão da Palestra"
				message="Tem certeza que deseja excluir a Palestra #{cadastroPalestraBean.palestra.nome}"
				widgetVar="confirmacaoExclusao" id="confirmacaoExclusaoDialog">
				<p:button value="Não"
					onclick="PF('confirmacaoExclusao').hide(); return false;" />
				<p:commandButton value="Sim"
					action="#{cadastroPalestraBean.excluir()}"
					oncomplete="PF('confirmacaoExclusao').hide();" process="@this"
					update="@form" />
			</p:confirmDialog>
		</h:form>
	</ui:define>

</ui:composition>
