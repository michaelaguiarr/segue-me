<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" lang="en">

<h:head>
	<f:facet name="first">
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
	</f:facet>
	<title><ui:insert name="title">Interlab</ui:insert></title>
	<h:outputScript name="locale.js" library="js" />
	<link rel="shortcut icon" type="image/png" href="#{facesContext.externalContext.request.contextPath}/resources/images/favicon.png"/>
	<ui:insert name="head" />
</h:head>

<h:body styleClass="login-body">
	<div class="login-panel ui-fluid">
		<div class="ui-g rounded-btn">

			<div class="ui-g-12 logo-container">
				<p:graphicImage name="interlis-login.jpg" library="images"
					styleClass="logo" />
				<!-- <p:graphicImage name="interlab-login.png" library="images"
					styleClass="logo" /> -->
				<p:graphicImage name="images/login/icon-login.png"
					library="paradise-layout" styleClass="login-icon" />
				<h2>
					<ui:insert name="sub-title">Bem-Vindo</ui:insert>
				</h2>
			</div>

			<ui:insert name="content"></ui:insert>

		</div>
	</div>
	<div id="version">#{applicationInfoController.versionApplication}</div>
	
	
	<p:ajaxStatus
		style="width:32px;height:32px;position:fixed;right:7px;bottom:7px">
		<f:facet name="start">
			<i class="fa fa-circle-o-notch fa-spin ajax-loader"
				aria-hidden="true"></i>
		</f:facet>

		<f:facet name="complete">
			<h:outputText value="" />
		</f:facet>
	</p:ajaxStatus>


	<h:outputStylesheet name="css/layout-#{guestPreferences.layout}.css"
		library="paradise-layout" />
	<h:outputStylesheet name="login.css" library="css" />	
</h:body>
</html>
