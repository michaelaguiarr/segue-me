<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui">
	<h:panelGroup id="eventoPanelGroup">
		<div class=	"ui-g-12">
			<!-- Seguidor -->
			<p:fieldset legend="Historico">
				<p:dataTable var="evento" id="datatable-evento"
					value="#{detalhesCasalBean.listaEvento}" reflow="true"
					emptyMessage="Nenhuma partipação  encontrada!">

					<p:column headerText="Equipe" sortBy="#{evento.equipe.titulo}"
						width="100">
						<h:outputText value="#{evento.equipe.titulo}" />
					</p:column>
					<p:column headerText="Função" sortBy="#{evento.funcao.descricao}"
						width="100">
						<h:outputText value="#{evento.funcao.descricao}" />
					</p:column>
					<p:column headerText="Paroquia"
						sortBy="#{evento.segueMe.paroquia.descricao}" width="200">
						<h:outputText value="#{evento.segueMe.paroquia.descricao}" />
					</p:column>

					<p:column headerText="Segue-me"
						sortBy="#{evento.segueMe.numeroRomano.numeroRomano}" width="200">
						<h:outputText
							value="#{evento.segueMe.titulo} - #{evento.segueMe.numeroRomano.numeroRomano}" />
					</p:column>

					<p:column headerText="Situação" width="50"
						sortBy="#{evento.statusConvite.nome}">
						<span class="situacao #{evento.statusConvite.coresParaStyle}">#{evento.statusConvite.nome}</span>
					</p:column>

					<p:column headerText="Obs" sortBy="#{evento.motivoRecusa}"
						width="200">
						<h:outputText value="#{evento.motivoRecusa}" />
					</p:column>
				</p:dataTable>
			</p:fieldset>
			<div class="save ui-g-12">
				<ui:insert name="cancelar" />
			</div>
		</div>
	</h:panelGroup>
</ui:composition>
