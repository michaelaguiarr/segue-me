<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">


	<h:form id="form-senha">
		<div class="ui-g ui-fluid">
			<div class="ui-g-12">
				<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
				<div class="card card-w-title">

					<div class="ui-g-12">
						<p:outputLabel value="Informe a senha atual" />
					</div>

					<div class="ui-g-12 ui-md-12 ui-lg-4">
						<p:password id="atual" required="true"
							requiredMessage="Senha atual é campo obrigatório"
							value="#{meuPerfilBean.senhaAtual}" />
					</div>

					<div class="ui-g-12">
						<p:outputLabel value="Nova Senha" for="senha" />
					</div>

					<div class="ui-g-12 ui-md-6 ui-lg-2">
						<p:password id="senha" required="true"
							requiredMessage="Nova Senha é campo obrigatório"
							value="#{meuPerfilBean.novaSenha}" match="senha2"
							validatorMessage="Senhas precisam ser iguais" feedback="true"
							inline="true" promptLabel="Senha"
							weakLabel="Força da senha : Fraca"
							goodLabel="Força da senha : Média"
							strongLabel="Força da senha : Forte" />
					</div>

					<div class="ui-g-12 ui-md-6 ui-lg-2">
						<p:password id="senha2" match="senha2"
							placeholder="Senha Novamente" required="true"
							requiredMessage="Senha é campo obrigatório" />
					</div>

					<div class="save ui-g-12">
						<p:commandButton value="Salvar" style="width: auto;"
							styleClass="green-btn"
							action="#{meuPerfilBean.mudarSenha()}"
							update="tabview:form-senha messages" process="tabview:form-senha"
							icon="fa fa-save" />
					</div>
				</div>
			</div>
		</div>
	</h:form>
</ui:composition>
