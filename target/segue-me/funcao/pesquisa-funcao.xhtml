<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	template="/WEB-INF/template.xhtml">

	<ui:define name="title">Pesquisa Função</ui:define>

	<f:metadata>
		<f:viewAction action="#{pesquisaFuncaoBean.inicializar()}" />
	</f:metadata>

	<ui:define name="search">
		<div class="ui-inputgroup">
			<p:inputText id="value" autocomplete="off"
				value="#{pesquisaFuncaoBean.searchValue}" placeholder="Pesquisar">
				<p:ajax listener="#{pesquisaFuncaoBean.pesquisar()}"
					update="datatable-funcao messages" event="keyup" />
			</p:inputText>
		</div>
	</ui:define>

	<ui:define name="content">

		<h:form id="form">
			<ui:include src="/WEB-INF/facelets/funcao/funcao-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>Pesquisa Função</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />

						<div class="ui-g">

							<p:dataTable var="funcao" id="datatable-funcao"
								value="#{pesquisaFuncaoBean.listaFuncao}" reflow="true"
								selectionMode="single"
								selection="#{pesquisaFuncaoBean.funcaoSelecionado}"
								rowKey="#{funcao}" emptyMessage="Função não encontrada!">

								<p:ajax event="rowSelect"
									listener="#{pesquisaFuncaoBean.selecionar()}" />

								<p:column headerText="Equipe" sortBy="#{funcao.equipe.ordem}">
									<h:outputText value="#{funcao.equipe.ordem} - #{funcao.equipe.titulo}" />
								</p:column>
								<p:column headerText="Descrição" sortBy="#{funcao.descricao}">
									<h:outputText value="#{funcao.descricao}" />
								</p:column>
								
								<p:column headerText="Ordem" sortBy="#{funcao.ordem}">
									<h:outputText value="#{funcao.ordem}" />
								</p:column>

							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
		</h:form>

	</ui:define>

</ui:composition>
