<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="title">Cadastro Palestra Casal no Segue-me</ui:define>

	<ui:define name="toolbar">
		<p:button outcome="/evento-casal/pesquisa-palestra" value="Pesquisar"
			icon="fa fa-search" />
	</ui:define>

	<f:metadata>
		<o:viewParam name="casal" value="#{cadastroPalestraCasalBean.evento}" />
		<f:viewAction action="#{cadastroPalestraCasalBean.inicializar()}" />
	</f:metadata>

	<ui:define name="content">
		<h:form id="form-cadastro" enctype="multipart/form-data">
			<ui:include src="/WEB-INF/facelets/evento-casal/palestra-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>#{cadastroPalestraCasalBean.editando ? 'Edição Palestra Casal no
							Segue-me' : 'Nova Palestra Casal no Segue-me'}</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
						<p:growl />
						<p:focus for="palestra" />
						<div class="ui-g">
							<div class="ui-g-12">
								<!-- Seguidor -->
								<p:fieldset legend="Segue-Me">
									<div class="ui-g-6">
										<p:outputLabel value="Paroquia" for="paroquia" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Segue-Me" for="segueMe" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="paroquia"
											value="#{cadastroPalestraCasalBean.paroquia}" required="true"
											disabled="#{not seguranca.administradorGeral}">
											<f:selectItem itemLabel="Selecione a Paroquia" />
											<f:selectItems
												value="#{cadastroPalestraCasalBean.listaParoquia}"
												var="paroquia" itemValue="#{paroquia}"
												itemLabel="#{paroquia.descricao}" />
											<p:ajax
												listener="#{cadastroPalestraCasalBean.onSegueMeChange()}"
												update="segueMe" />
										</p:selectOneMenu>
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="segueMe" label="Segue-me" required="true"
											value="#{cadastroPalestraCasalBean.evento.segueMe}"
											disabled="#{not seguranca.administrador}">
											<f:selectItem itemLabel="Selecione o Segue-Me" />
											<f:selectItems
												value="#{cadastroPalestraCasalBean.listaSegueMe}"
												var="segueMe" itemValue="#{segueMe}"
												itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
										</p:selectOneMenu>
									</div>
									<div class="ui-g-12">
										<p:outputLabel value="Palestra" for="palestra" />
									</div>

									<div class="ui-g-12">
										<p:selectOneMenu id="palestra"
											value="#{cadastroPalestraCasalBean.evento.palestra}"
											required="true"
											disabled="#{not seguranca.graficaAndComandante}">
											<f:selectItem itemLabel="Selecione a Palestra" />
											<f:selectItems
												value="#{cadastroPalestraCasalBean.listaPalestra}" var="palestra"
												itemValue="#{palestra}" itemLabel="#{palestra.nome}" />
										</p:selectOneMenu>
									</div>
									
									<div class="ui-g-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:outputLabel value="Situação" for="situacao" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:outputLabel value="Observação" for="obs" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:selectOneMenu id="situacao"
											value="#{cadastroPalestraCasalBean.evento.statusConvite}"
											required="true">
											<f:selectItem itemLabel="Selecione a Situação" />
											<f:selectItems
												value="#{cadastroPalestraCasalBean.statusConvites}"
												var="status" itemValue="#{status}"
												itemLabel="#{status.nome}" />
										</p:selectOneMenu>
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:inputTextarea rows="6" cols="33" id="obs"
											value="#{cadastroFichaBean.evento.motivoRecusa}" />
									</div>
									<div class="ui-g-12"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:outputLabel value="Imprimir Crachá?" for="cracha" />
									</div>

									<div class="ui-g-12 ui-lg-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:selectBooleanButton id="cracha"
											value="#{cadastroPalestraCasalBean.evento.cracha}"
											onLabel="Sim" offLabel="Não" onIcon="ui-icon-check"
											offIcon="ui-icon-close" style="width:60px" />
									</div>
								</p:fieldset>
							</div>
							<div class="ui-g-12">
								<!-- Seguidor -->
								<p:fieldset legend="Casal">
									<div class="ui-g-6">
										<p:graphicImage
											value="#{cadastroPalestraCasalBean.evento.casal.carregarImagemEle()}"
											rendered="#{cadastroPalestraCasalBean.evento.casal.exibirImagemEle}"
											width="150px" height="150px" id="fotoEle"
											onclick="PF('fotoDialogWidgetVarEle').show()" cache="FALSE" />
									</div>

									<div class="ui-g-12">
										<p:outputLabel value="Nome Casal" for="casal" />
									</div>

									<div class="ui-g-12 ui-md-12 ui-lg-12">
										<div class="ui-inputgroup">
											<p:autoComplete id="casal" required="true"
												style="width: 90%;" styleClass="Fleft" autocomplete="off"
												value="#{cadastroPalestraCasalBean.evento.casal}"
												completeMethod="#{cadastroPalestraCasalBean.buscaPessoas}"
												var="casal"
												itemLabel="#{casal.apelidoEle} e #{casal.apelidoEla}"
												itemValue="#{casal}" minQueryLength="3" maxResults="10"
												forceSelection="true" emptyMessage="Casal não encontrado!">
												<p:ajax event="itemSelect" update="@form" />
												<p:column>
													<p:outputLabel value="#{casal.apelidoEle}" />
												</p:column>

												<p:column>
													<p:outputLabel value="#{casal.apelidoEla}" />
												</p:column>

											</p:autoComplete>
											<p:button icon="fa fa-plus"
												outcome="/evento-casal/cadastro-casal"
												style="width: 10%; margin: 0;" id="novo-casal"
												styleClass="white-button"
												rendered="#{not cadastroPalestraCasalBean.seguidorValido}" />
											<p:button icon="fa fa-pencil"
												outcome="/evento-casal/cadastro-casal"
												style="width: 10%; margin: 0;" id="editar-seguidor"
												styleClass="white-button"
												rendered="#{cadastroPalestraCasalBean.seguidorValido}">
												<f:param name="casal"
													value="#{cadastroPalestraCasalBean.evento.casal.id}" />
											</p:button>
										</div>
									</div>
									<div class="ui-g-12"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:outputLabel value="Email Ele" for="emailEle" />
									</div>

									<div class="ui-g-6 ui-lg-12"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:inputText placeholder="Email" id="emailEle"
											value="#{cadastroPalestraCasalBean.evento.casal.emailEle}" />
									</div>
									<div class="ui-g-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:outputLabel value="Telefone 1 Ele" for="telefoneUmEle" />
									</div>
									<div class="ui-g-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:outputLabel value="Telefone 2 Ele" for="telefoneDoisEle" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:inputMask id="telefoneUmEle" placeholder="Telefone 1"
											value="#{cadastroPalestraCasalBean.evento.casal.telefoneEleUm}"
											mask="(99)999999999">
										</p:inputMask>
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:inputMask id="telefoneDoisEle" placeholder="Telefone 2"
											value="#{cadastroPalestraCasalBean.evento.casal.telefoneEleDois}"
											mask="(99)999999999">
										</p:inputMask>
									</div>

									<div class="ui-g-12"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:outputLabel value="Email Ela" for="emailEla" />
									</div>

									<div class="ui-g-6 ui-lg-12"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:inputText placeholder="Email" id="emailEla"
											value="#{cadastroPalestraCasalBean.evento.casal.emailEla}" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:outputLabel value="Telefone 1 Ela" for="telefoneUmEla" />
									</div>
									<div class="ui-g-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:outputLabel value="Telefone 2 Ela" for="telefoneDoisEla" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:inputMask id="telefoneUmEla" placeholder="Telefone 1"
											required="true"
											value="#{cadastroPalestraCasalBean.evento.casal.telefoneElaUm}"
											mask="(99)999999999">
										</p:inputMask>
									</div>
									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:inputMask id="telefoneDoisEla" placeholder="Telefone 2"
											value="#{cadastroPalestraCasalBean.evento.casal.telefoneElaDois}"
											mask="(99)999999999">
										</p:inputMask>
									</div>
								</p:fieldset>
							</div>
							<div class="ui-g-12"
								jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
								<!-- Endereco -->
								<p:fieldset legend="Endereço">
									<div class="ui-g-12"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:outputLabel value="Endereço" for="endereco" />
									</div>
									<div class="ui-g-12 ui-lg-12"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:inputText id="endereco" required="true"
											value="#{cadastroPalestraCasalBean.evento.casal.endereco.logradouro}" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:outputLabel value="Número" for="numero" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:outputLabel value="Bairro" for="bairro" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:inputText id="numero" required="true"
											value="#{cadastroPalestraCasalBean.evento.casal.endereco.numero}" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:inputText id="bairro" required="true"
											value="#{cadastroPalestraCasalBean.evento.casal.endereco.bairro}" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:outputLabel value="Cidade" for="cidade" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:outputLabel value="UF" for="uf" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:inputText id="cidade" required="true"
											value="#{cadastroPalestraCasalBean.evento.casal.endereco.cidade}" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroPalestraCasalBean.seguidorValido}">
										<p:selectOneMenu id="uf" label="UF" required="true"
											value="#{cadastroPalestraCasalBean.evento.casal.endereco.estado}">
											<f:selectItem itemLabel="Selecione" />
											<f:selectItems value="#{cadastroFichaBean.estados}"
												var="estado" itemValue="#{estado.sigla}"
												itemLabel="#{estado.sigla}" />
										</p:selectOneMenu>
									</div>
								</p:fieldset>
							</div>
							<div class="save ui-g-12">
								<p:commandButton id="salvar" value="Salvar" style="width: auto;"
									action="#{cadastroPalestraCasalBean.salvar()}" update="@form"
									process="@form" icon="fa fa-save" styleClass="green-btn"
									title="Somente a Gráfica tem acesso." />

								<p:commandButton icon="fa fa-trash" value="Excluir"
									style="width: auto; margin-left: 15px;"
									oncomplete="PF('confirmacaoExclusao').show();" process="@this"
									styleClass="red-btn"
									update=":form-cadastro:confirmacaoExclusaoDialog"
									rendered="#{cadastroPalestraCasalBean.editando}" />

								<p:button value="Cancelar"
									style="width: auto; margin-left: 15px;"
									outcome="pesquisa-casal" icon="fa fa-remove" />
								<p:defaultCommand target="salvar" />
							</div>
						</div>
					</div>
				</div>
			</div>
			<p:dialog header="#{cadastroPalestraCasalBean.evento.casal.nomeEle}"
				id="fotoDialogEle" widgetVar="fotoDialogWidgetVarEle">
				<p:graphicImage
					value="#{cadastroPalestraCasalBean.evento.casal.carregarImagemEle()}"
					style="max-width: 300px"
					rendered="#{cadastroPalestraCasalBean.evento.casal.exibirImagemEle}"
					id="imagemEle" />
			</p:dialog>

			<p:dialog header="#{cadastroPalestraCasalBean.evento.casal.nomeEla}"
				id="fotoDialogEla" widgetVar="fotoDialogWidgetVarEla">
				<p:graphicImage
					value="#{cadastroPalestraCasalBean.evento.casal.carregarImagemEla()}"
					style="max-width: 300px"
					rendered="#{cadastroPalestraCasalBean.evento.casal.exibirImagemEla}"
					id="imagemEla" />
			</p:dialog>

			<p:confirmDialog header="Exclusão do Casal do Evento"
				message="Tem certeza que deseja excluir o Casal #{cadastroPalestraCasalBean.evento.casal.apelidoEle} e #{cadastroPalestraCasalBean.evento.casal.apelidoEla}"
				widgetVar="confirmacaoExclusao" id="confirmacaoExclusaoDialog">
				<p:button value="Não"
					onclick="PF('confirmacaoExclusao').hide(); return false;" />
				<p:commandButton value="Sim"
					action="#{cadastroPalestraCasalBean.excluir()}"
					oncomplete="PF('confirmacaoExclusao').hide();" process="@this"
					update="@form" />
			</p:confirmDialog>
		</h:form>
	</ui:define>

</ui:composition>
