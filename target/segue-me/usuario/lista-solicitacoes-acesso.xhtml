<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="title">Solicitações de Acesso</ui:define>

	<f:metadata>
		<f:viewAction
			action="#{listaSolicitacoesAcessoController.inicializar()}" />
	</f:metadata>
	<ui:define name="content">
		<div class="ui-g">
			<h:form id="form">
				<ui:include src="/WEB-INF/facelets/usuario/usuario-toolbar.xhtml" />
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>Solicitações de Acesso</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
						<p:dataTable var="usuario" id="datatable-solicitacoes"
							value="#{listaSolicitacoesAcessoController.solicitacoesDeAcesso}"
							reflow="true" emptyMessage="Nenhuma solicitação"
							selectionMode="single"
							selection="#{listaSolicitacoesAcessoController.usuario}"
							rowKey="#{usuario.id}">

							<p:ajax event="rowSelect" process="datatable-solicitacoes"
								update="form:modal" oncomplete="PF('modal-acesso').show()" />

							<p:column headerText="Nome" sortBy="#{usuario.nome}">
								<h:outputText value="#{usuario.nome}" />
							</p:column>

							<p:column headerText="E-mail" sortBy="#{usuario.email}">
								<h:outputText value="#{usuario.email}" />
							</p:column>

							<p:column headerText="Segue-me"
								sortBy="#{usuario.segueMe.numeroRomano}">
								<h:outputText
									value="#{usuario.segueMe.titulo} - #{usuario.segueMe.numeroRomano.numeroRomano}" />
							</p:column>

							<p:column headerText="Equipe" sortBy="#{usuario.equipe.titulo}">
								<h:outputText value="#{usuario.equipe.titulo}" />
							</p:column>

							<p:column headerText="Função"
								sortBy="#{usuario.funcao.descricao}">
								<h:outputText value="#{usuario.funcao.descricao}" />
							</p:column>

							<p:column headerText="Paróquia"
								sortBy="#{usuario.segueMe.paroquia.descricao}"
								rendered="#{seguranca.administradorGeral}">
								<h:outputText value="#{usuario.segueMe.paroquia.descricao}" />
							</p:column>

							<p:column headerText="Data Solicitação">
								<h:outputText value="#{usuario.timestamp.time}">
									<f:convertDateTime pattern="dd/MM/yyyy HH:mm" />
								</h:outputText>
							</p:column>

						</p:dataTable>
					</div>
				</div>

				<p:dialog id="modal" widgetVar="modal-acesso" modal="true"
					header="Definição de Perfil" resizable="false" draggable="false"
					width="300" responsive="true" showEffect="drop" hideEffect="drop"
					focus="perfil">
					<div class="card">

						<h1>#{listaSolicitacoesAcessoController.usuario.nome}</h1>

						<p:panelGrid columns="1" layout="grid" id="grid"
							styleClass="ui-panelgrid-blank form-group">

							<p:outputLabel value="Perfil: " />
							<p:selectOneMenu id="perfil" required="true"
								style="width: 180px;"
								requiredMessage="Perfil é campo obrigatório"
								value="#{listaSolicitacoesAcessoController.perfil}"
								converter="omnifaces.SelectItemsConverter" disabled="#{not seguranca.administrador}">
								<f:selectItem itemLabel="" noSelectionOption="true" />
								<f:selectItems
									value="#{listaSolicitacoesAcessoController.perfis}"
									var="perfil" itemValue="#{perfil}" itemLabel="#{perfil.nome}" />
							</p:selectOneMenu>
						</p:panelGrid>

						<p:panelGrid columns="2" layout="grid" id="grid-btn"
							style="margin-top: 10px"
							styleClass="ui-panelgrid-blank form-group"
							columnClasses="ui-grid-col-6, ui-grid-col-6">

							<p:commandButton icon="fa fa-check"
								styleClass="green-btn raised-btn" value="Autorizar"
								process="grid grid-btn"
								update="form:datatable-solicitacoes messages"
								action="#{listaSolicitacoesAcessoController.autorizarAcesso}"
								oncomplete="PF('modal-acesso').hide()" />

							<p:commandButton icon="fa fa-remove" styleClass="raised-btn"
								value="Remover" process="@this"
								update="form:datatable-solicitacoes messages"
								action="#{listaSolicitacoesAcessoController.removerSolicitacao}"
								oncomplete="PF('modal-acesso').hide()" />
						</p:panelGrid>

					</div>
				</p:dialog>
			</h:form>
		</div>

	</ui:define>

</ui:composition>
