<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	template="/WEB-INF/template.xhtml">

	<ui:define name="title">Pesquisa Usuários</ui:define>

	<f:metadata>
		<f:viewAction action="#{pesquisaUsuarioBean.inicializar()}" />
	</f:metadata>

	<ui:define name="search">
		<div class="ui-fluid">
			<div class="ui-g-12">
				<div class="card card-w-title">
					<h1>Pesquisa Usuário</h1>
					<div class="ui-g">
						<div class="ui-g-12 ui-lg-6">
							<p:selectOneMenu id="Paroquia"
								value="#{pesquisaUsuarioBean.filter.paroquia}"
								disabled="#{not seguranca.administradorGeral}">
								<f:selectItem itemLabel="Todos as Paroquias" />
								<f:selectItems value="#{pesquisaUsuarioBean.listaParaquia}"
									var="paroquia" itemValue="#{paroquia}"
									itemLabel="#{paroquia.descricao}" />
								<p:ajax listener="#{pesquisaUsuarioBean.onSegueMeChange()}"
									update="segueMe" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:selectOneMenu id="segueMe" label="Segue-Me"
								value="#{pesquisaUsuarioBean.filter.segueMe}"
								disabled="#{not seguranca.administrador}">
								<f:selectItem itemLabel="Todos os Segue-Me"
									noSelectionOption="true" />
								<f:selectItems value="#{pesquisaUsuarioBean.listaSegueMe}"
									var="segueMe" itemValue="#{segueMe}"
									itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:selectOneMenu id="equipe" label="Equipe"
								value="#{pesquisaUsuarioBean.filter.equipe}"
								disabled="#{not seguranca.administrador}">
								<f:selectItem itemLabel="Todas as Equipes"
									noSelectionOption="true" />
								<f:selectItems value="#{pesquisaUsuarioBean.listaEquipe}"
									var="equipe" itemValue="#{equipe}" itemLabel="#{equipe.titulo}" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:inputText id="nome" placeholder="Nome do Usuário"
								autocomplete="off" value="#{pesquisaUsuarioBean.filter.nome}" />
						</div>
						<div class="ui-g-12">
							<p:commandButton id="pesquisar" value="Pesquisar"
								style="width: auto;" action="#{pesquisaUsuarioBean.pesquisar()}"
								update="@form" process="@form" icon="fa fa-search"
								styleClass="green-btn" />
							<p:defaultCommand target="pesquisar" />
						</div>
					</div>
				</div>
			</div>
		</div>
	</ui:define>

	<ui:define name="content">

		<h:form id="form">
			<ui:include src="/WEB-INF/facelets/usuario/usuario-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>Lista de Usuários</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />

						<div class="ui-g">

							<p:dataTable var="usuario" id="datatable-usuarios"
								value="#{pesquisaUsuarioBean.listaUsuario}" reflow="true"
								selectionMode="single"
								selection="#{pesquisaUsuarioBean.usuario}" rowKey="#{usuario}"
								emptyMessage="Usuário não encontrada!">

								<p:ajax event="rowSelect"
									listener="#{pesquisaUsuarioBean.selecionar()}" />

								<p:column headerText="Nome" sortBy="#{usuario.nome}">
									<h:outputText value="#{usuario.nome}" />
									<i class="#{usuario.iconeParaSexo}" style="float: right;" />
								</p:column>

								<p:column headerText="E-mail" sortBy="#{usuario.email}">
									<h:outputText value="#{usuario.email}" />
								</p:column>

								<p:column headerText="Perfil" sortBy="#{usuario.perfil.nome}">
									<h:outputText value="#{usuario.perfil.nome}" />
								</p:column>

								<p:column headerText="Situação" sortBy="#{usuario.status.nome}">
									<h:outputText value="#{usuario.status.nome}" />
								</p:column>

								<p:column headerText="Paroquia"
									sortBy="#{usuario.segueMe.paroquia.descricao}">
									<h:outputText value="#{usuario.segueMe.paroquia.descricao}" />
								</p:column>

								<p:column headerText="Segue-me"
									sortBy="#{usuario.segueMe.titulo}">
									<h:outputText
										value="#{usuario.segueMe.titulo} - #{usuario.segueMe.numeroRomano.numeroRomano}" />
								</p:column>

								<p:column headerText="Equipe" sortBy="#{usuario.equipe.titulo}">
									<h:outputText value="#{usuario.equipe.titulo}" />
								</p:column>
							</p:dataTable>

						</div>
					</div>
				</div>
			</div>
		</h:form>

	</ui:define>

</ui:composition>
