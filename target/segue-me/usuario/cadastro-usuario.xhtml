<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="title">Cadastro Usuário</ui:define>

	<ui:define name="toolbar">
		<p:button outcome="/usuario/pesquisa-usuario" value="Pesquisar"
			icon="fa fa-search" />
	</ui:define>

	<f:metadata>
		<o:viewParam name="usuario" value="#{cadastroUsuarioBean.usuario}" />
		<f:viewAction action="#{cadastroUsuarioBean.inicializar()}" />
	</f:metadata>

	<ui:define name="content">
		<h:form id="form-cadastro" enctype="multipart/form-data">
			<ui:include src="/WEB-INF/facelets/usuario/usuario-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>#{cadastroUsuarioBean.editando ? 'Edição Usuário' : 'Novo
							Usuário'}</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
						<p:focus for="nome" />
						<div class="ui-g">
							<div class="ui-g-12">
								<p:outputLabel value="Foto" />
							</div>
							<div class="ui-g-12 ui-lg-6">
								<h:panelGrid id="fotoPanelGroupUpload">
									<p:fileUpload
										fileUploadListener="#{cadastroUsuarioBean.upload}"
										allowTypes="/(\.|\/)(jpg)$/"
										invalidFileMessage="São permitidas somente imagens (jpg)"
										auto="true" label="Foto"
										update="fotoPanelGroup fotoPanelGroupUpload"
										rendered="#{cadastroUsuarioBean.imagemDoUsuario == null}" />
								</h:panelGrid>
							</div>

							<div class="ui-g-12">
								<h:panelGrid id="fotoPanelGroup">
									<p:graphicImage value="#{cadastroUsuarioBean.imagemDoUsuario}"
										rendered="#{cadastroUsuarioBean.imagemDoUsuario ne null}"
										width="200px" id="foto" />

									<p:commandButton value="Remover Foto"
										style="width: auto; margin-left: 15px;"
										actionListener="#{cadastroUsuarioBean.removerFoto}"
										rendered="#{cadastroUsuarioBean.imagemDoUsuario ne null}"
										process="@this" update="fotoPanelGroup, fotoPanelGroupUpload" />
								</h:panelGrid>
							</div>
							<div class="ui-g-12">
								<p:outputLabel value="Nome" for="nome" />
							</div>
							<div class="ui-g-12 ui-lg-6">
								<p:inputText id="nome" required="true"
									value="#{cadastroUsuarioBean.usuario.nome}" />
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Email" for="email" />
							</div>

							<div class="ui-g-12 ui-md-12 ui-lg-6">
								<p:inputText placeholder="Email" id="email"
									value="#{cadastroUsuarioBean.usuario.email}" />
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Data de Nascimento" for="nascimento" />
							</div>

							<div class="ui-g-12 ui-md-12 ui-lg-6">
								<p:calendar id="nascimento" navigator="true"
									value="#{cadastroUsuarioBean.usuario.dataNascimento}"
									mask="true" pattern="dd/MM/yyyy" mode="popup" />
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Sexo" for="sexo" />
							</div>

							<div class="ui-g-12 ui-md-12 ui-lg-6">
								<p:selectOneMenu id="sexo" label="Sexo"
									converter="omnifaces.SelectItemsConverter"
									value="#{cadastroUsuarioBean.usuario.sexo}">
									<f:selectItem itemLabel="Sexo" noSelectionOption="true" />
									<f:selectItems value="#{cadastroUsuarioBean.listaSexo}"
										var="sexo" itemValue="#{sexo}" itemLabel="#{sexo.nome}" />
								</p:selectOneMenu>
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Telefone" />
							</div>

							<div class="ui-g-12 ui-md-12 ui-lg-6">
								<p:inputMask id="celular" placeholder="Telefone" required="true"
									requiredMessage="Telefone é campo obrigatório"
									value="#{cadastroUsuarioBean.usuario.numeroCompleto}"
									mask="(99)999999999" />
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Perfil" />
							</div>

							<div class="ui-g-12 ui-md-12 ui-lg-6">
								<p:selectOneMenu id="perfil" required="true"
									requiredMessage="Perfil é campo obrigatório"
									value="#{cadastroUsuarioBean.usuario.perfil}">
									<f:selectItem itemLabel="Perfil de Acesso"
										noSelectionOption="true" />
									<f:selectItems value="#{cadastroUsuarioBean.listaPerfil}"
										var="perfil" itemValue="#{perfil}" itemLabel="#{perfil.nome}" />
								</p:selectOneMenu>
							</div>



							<div class="ui-g-12">
								<p:outputLabel value="Paroquia" for="paroquia" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:selectOneMenu id="paroquia"
									value="#{cadastroUsuarioBean.paroquia}" required="true"
									disabled="#{not seguranca.administradorGeral}">
									<f:selectItem itemLabel="Selecione a Paroquia" />
									<f:selectItems value="#{cadastroUsuarioBean.listaParoquia}"
										var="paroquia" itemValue="#{paroquia}"
										itemLabel="#{paroquia.descricao}" />
									<p:ajax listener="#{cadastroUsuarioBean.onSegueMeChange()}"
										update="segueMe" />
								</p:selectOneMenu>
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Segue-Me (Que vai Servi)" for="segueMe" />
							</div>
							<div class="ui-g-12 ui-lg-6">
								<p:selectOneMenu id="segueMe" label="Segue-me" required="true"
									value="#{cadastroUsuarioBean.usuario.segueMe}"
									disabled="#{not seguranca.administrador}">
									<f:selectItem itemLabel="Selecione o Segue-Me" />
									<f:selectItems value="#{cadastroUsuarioBean.listaSegueMe}"
										var="segueMe" itemValue="#{segueMe}"
										itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
								</p:selectOneMenu>
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Equipe" for="equipe" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:selectOneMenu id="equipe"
									disabled="#{not seguranca.graficaAndComandante}"
									value="#{cadastroUsuarioBean.usuario.equipe}" required="true">
									<f:selectItem itemLabel="Selecione a Equipe" />
									<f:selectItems value="#{cadastroUsuarioBean.listaEquipe}"
										var="equipe" itemValue="#{equipe}"
										itemLabel="#{equipe.titulo}" />
									<p:ajax listener="#{cadastroUsuarioBean.onFuncaoChange()}"
										update="funcao" />
								</p:selectOneMenu>
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Função" for="funcao" />
							</div>
							<div class="ui-g-12 ui-lg-6">
								<p:selectOneMenu id="funcao" label="Função" required="true"
									value="#{cadastroUsuarioBean.usuario.funcao}">
									<f:selectItem itemLabel="Selecione a função" />
									<f:selectItems value="#{cadastroUsuarioBean.listaFuncao}"
										var="funcao" itemValue="#{funcao}"
										itemLabel="#{funcao.descricao}" />
								</p:selectOneMenu>
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Situação" for="status" />
							</div>
							<div class="ui-g-12 ui-lg-6">
								<p:selectOneMenu id="status" label="Status" required="true"
									value="#{cadastroUsuarioBean.usuario.status}">
									<f:selectItem itemLabel="Selecione o Status" />
									<f:selectItems value="#{cadastroUsuarioBean.statuss}"
										var="status" itemValue="#{status}" itemLabel="#{status.nome}" />
								</p:selectOneMenu>
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Senha" for="senha" />
							</div>

							<div class="ui-g-12 ui-md-6 ui-lg-3">
								<p:password placeholder="Senha" id="senha"
									value="#{cadastroUsuarioBean.usuario.senha}" match="senha2"
									validatorMessage="Senhas precisam ser iguais" feedback="true"
									inline="true" promptLabel="Digite a senha"
									weakLabel="Força da senha : Fraca"
									goodLabel="Força da senha : Média"
									strongLabel="Força da senha : Forte" />
							</div>

							<div class="ui-g-12 ui-md-6 ui-lg-3">
								<p:password placeholder="Novamente a senha" id="senha2"
									match="senha2" />
							</div>

							<div class="save ui-g-12">
								<p:commandButton id="salvar" value="Salvar" style="width: auto;"
									action="#{cadastroUsuarioBean.salvar()}" update="@form"
									process="@form" icon="fa fa-save" styleClass="green-btn" />


								<p:commandButton icon="fa fa-trash" value="Excluir"
									style="width: auto; margin-left: 15px;"
									oncomplete="PF('confirmacaoExclusao').show();" process="@this"
									styleClass="red-btn" ajax="false"
									update=":form-cadastro:confirmacaoExclusaoDialog"
									rendered="#{cadastroUsuarioBean.editando}" />

								<p:button value="Cancelar"
									style="width: auto; margin-left: 15px;"
									outcome="pesquisa-usuario" icon="fa fa-remove" />
								<p:defaultCommand target="salvar" />
							</div>
						</div>
					</div>
				</div>
			</div>
			<p:confirmDialog header="Exclusão do Usuário"
				message="Tem certeza que deseja excluir o bairro #{cadastroUsuarioBean.usuario.nome}"
				widgetVar="confirmacaoExclusao" id="confirmacaoExclusaoDialog">
				<p:button value="Não"
					onclick="PF('confirmacaoExclusao').hide(); return false;" />
				<p:commandButton value="Sim"
					action="#{cadastroUsuarioBean.excluir()}"
					oncomplete="PF('confirmacaoExclusao').hide();" process="@this"
					update="@form" />
			</p:confirmDialog>
		</h:form>
	</ui:define>

</ui:composition>
