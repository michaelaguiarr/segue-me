<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	template="/WEB-INF/template.xhtml">

	<ui:define name="title">Pesquisa ECC</ui:define>

	<f:metadata>
		<f:viewAction action="#{pesquisaEccBean.inicializar()}" />
	</f:metadata>

	<ui:define name="search">
		<div class="ui-inputgroup">
			<p:inputText id="value" autocomplete="off"
				value="#{pesquisaEccBean.searchValue}" placeholder="Pesquisar">
				<p:ajax listener="#{pesquisaEccBean.pesquisar()}"
					update="datatable-ecc messages" event="keyup" />
			</p:inputText>
		</div>
	</ui:define>

	<ui:define name="content">

		<h:form id="form">
			<ui:include src="/WEB-INF/facelets/ecc/ecc-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>Pesquisa ECC</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />

						<div class="ui-g">

							<p:dataTable var="ecc" id="datatable-ecc"
								value="#{pesquisaEccBean.listaEcc}" reflow="true"
								selectionMode="single"
								selection="#{pesquisaEccBean.eccSelecionado}" rowKey="#{ecc}"
								emptyMessage="ECC não encontrada!">

								<p:ajax event="rowSelect"
									listener="#{pesquisaEccBean.selecionar()}" />

								<p:column headerText="Título" width="350">
									<h:outputText
										value="#{ecc.titulo} - #{ecc.numeroRomano.numeroRomano}" />
								</p:column>

								<p:column headerText="Paróquia">
									<h:outputText value="#{ecc.paroquia.descricao}" />
								</p:column>
							</p:dataTable>

						</div>
					</div>
				</div>
			</div>
		</h:form>

	</ui:define>

</ui:composition>
