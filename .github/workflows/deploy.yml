name: Deploy Segue-Me

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Extrair SHA curto
        run: echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            cd /opt/docker/segue-me
            git pull
            ./scripts/deploy.sh

      - name: Notificar sucesso no Telegram
        if: success()
        uses: appleboy/telegram-action@v0.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ Segue-Me — deploy concluído
            Branch: main
            Commit: ${{ env.SHORT_SHA }}
            Por: ${{ github.event.head_commit.author.name }}

      - name: Notificar falha no Telegram
        if: failure()
        uses: appleboy/telegram-action@v0.1.1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ Segue-Me — deploy falhou
            Branch: main
            Commit: ${{ env.SHORT_SHA }}
            Por: ${{ github.event.head_commit.author.name }}
