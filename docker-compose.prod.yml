services:

  tomcat:
    build:
      context: .
      dockerfile: Dockerfile.tomee
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./deployments:/usr/local/tomcat/webapps
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    environment:
      JAVA_OPTS: >-
        -Xms512m -Xmx1536m
        -Dfile.encoding=UTF-8
        -Duser.language=pt
        -Duser.country=BR4
        -Duser.timezone=America/Sao_Paulo
        -Djavax.faces.PROJECT_STAGE=Production
    networks:
      - segue-me-net

  postgres:
    image: postgres:15
    # Porta NÃO exposta externamente — acessível apenas pela rede interna Docker
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - segue-me-net

volumes:
  postgres_data:

networks:
  segue-me-net:
    driver: bridge
