<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="title">Cadastro Palestra Convidado no Segue-me</ui:define>

	<ui:define name="toolbar">
		<p:button outcome="/evento-convidado/pesquisa-palestra"
			value="Pesquisar" icon="fa fa-search" />
	</ui:define>

	<f:metadata>
		<o:viewParam name="convidado"
			value="#{cadastroPalestraConvidadoBean.evento}" />
		<f:viewAction action="#{cadastroPalestraConvidadoBean.inicializar()}" />
	</f:metadata>

	<ui:define name="content">
		<h:form id="form-cadastro" enctype="multipart/form-data">
			<ui:include
				src="/WEB-INF/facelets/evento-convidado/palestra-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>#{cadastroPalestraConvidadoBean.editando ? 'Edição
							Convidado' : 'Novo Convidado'}</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
						<p:growl />
						<p:focus for="palestra" />
						<div class="ui-g">
							<div class="ui-g-12">
								<!-- Convidado -->
								<p:fieldset legend="Segue-Me">
									<div class="ui-g-6">
										<p:outputLabel value="Paroquia" for="paroquia" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Segue-Me" for="segueMe" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="paroquia"
											value="#{cadastroPalestraConvidadoBean.paroquia}"
											required="true"
											disabled="#{not seguranca.administradorGeral}">
											<f:selectItem itemLabel="Selecione a Paroquia" />
											<f:selectItems
												value="#{cadastroPalestraConvidadoBean.listaParoquia}"
												var="paroquia" itemValue="#{paroquia}"
												itemLabel="#{paroquia.descricao}" />
											<p:ajax
												listener="#{cadastroPalestraConvidadoBean.onSegueMeChange()}"
												update="segueMe" />
										</p:selectOneMenu>
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="segueMe" label="Segue-me" required="true"
											value="#{cadastroPalestraConvidadoBean.evento.segueMe}"
											disabled="#{not seguranca.administrador}">
											<f:selectItem itemLabel="Selecione o Segue-Me" />
											<f:selectItems
												value="#{cadastroPalestraConvidadoBean.listaSegueMe}"
												var="segueMe" itemValue="#{segueMe}"
												itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
										</p:selectOneMenu>
									</div>
									<div class="ui-g-12">
										<p:outputLabel value="Palestra" for="palestra" />
									</div>

									<div class="ui-g-12">
										<p:selectOneMenu id="palestra"
											value="#{cadastroPalestraConvidadoBean.evento.palestra}"
											required="true"
											disabled="#{not seguranca.graficaAndComandante}">
											<f:selectItem itemLabel="Selecione a Palestra" />
											<f:selectItems
												value="#{cadastroPalestraConvidadoBean.listaPalestras}"
												var="pa" itemValue="#{pa}" itemLabel="#{pa.nome}" />
										</p:selectOneMenu>
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:outputLabel value="Situação" for="situacao" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:outputLabel value="Observação" for="obs" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:selectOneMenu id="situacao"
											value="#{cadastroPalestraConvidadoBean.evento.statusConvite}"
											required="false">
											<f:selectItem itemLabel="Selecione a Situação" />
											<f:selectItems
												value="#{cadastroPalestraConvidadoBean.statusConvites}"
												var="status" itemValue="#{status}"
												itemLabel="#{status.nome}" />
										</p:selectOneMenu>
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:inputTextarea rows="6" cols="33" id="obs"
											value="#{cadastroFichaBean.evento.motivoRecusa}" />
									</div>
									<div class="ui-g-12"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:outputLabel value="Imprimir Crachá?" for="cracha" />
									</div>

									<div class="ui-g-12 ui-lg-6"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:selectBooleanButton id="cracha"
											value="#{cadastroPalestraConvidadoBean.evento.cracha}"
											onLabel="Sim" offLabel="Não" onIcon="ui-icon-check"
											offIcon="ui-icon-close" style="width:60px" />
									</div>

								</p:fieldset>
							</div>
							<div class="ui-g-12">
								<!-- Convidado -->
								<p:fieldset legend="Convidado">
									<div class="ui-g-12">
										<p:graphicImage
											value="#{cadastroPalestraConvidadoBean.evento.palestranteConvidado.carregarImagem()}"
											rendered="#{cadastroPalestraConvidadoBean.evento.palestranteConvidado.exibirImagem}"
											width="150px" height="150px" id="fotoEvento"
											onclick="PF('fotoDialogWidgetVar').show()" cache="FALSE" />
									</div>

									<div class="ui-g-12">
										<p:outputLabel value="Nome Convidado" for="convidado" />
									</div>

									<div class="ui-g-12 ui-md-12 ui-lg-12">
										<div class="ui-inputgroup">
											<p:autoComplete id="convidado" required="true"
												style="width: 90%;" styleClass="Fleft" autocomplete="off"
												value="#{cadastroPalestraConvidadoBean.evento.palestranteConvidado}"
												completeMethod="#{cadastroPalestraConvidadoBean.buscaPessoas}"
												var="convidado" itemLabel="#{convidado.nome}"
												itemValue="#{convidado}" minQueryLength="3" maxResults="10"
												forceSelection="true" emptyMessage="Nome não encontrado!">
												<p:ajax event="itemSelect" update="@form" />
												<p:column>
													<p:outputLabel value="#{convidado.nome}" />
												</p:column>

												<p:column>
													<p:outputLabel value="#{convidado.apelido}" />
												</p:column>

											</p:autoComplete>
											<p:button icon="fa fa-plus"
												outcome="/evento-convidado/cadastro-convidado"
												style="width: 10%; margin: 0;" id="novo-convidado"
												styleClass="white-button"
												rendered="#{not cadastroPalestraConvidadoBean.convidadoValido}" />
											<p:button icon="fa fa-pencil"
												outcome="/evento-convidado/cadastro-convidado"
												style="width: 10%; margin: 0;" id="editar-convidado"
												styleClass="white-button"
												rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
												<f:param name="convidado"
													value="#{cadastroPalestraConvidadoBean.evento.palestranteConvidado.id}" />
											</p:button>
										</div>
									</div>

									<div class="ui-g-12"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:outputLabel value="Telefone 1" for="telefoneUm" />
									</div>

									<div class="ui-g-6 ui-lg-12"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:inputMask id="telefoneUm" placeholder="Telefone 1"
											value="#{cadastroPalestraConvidadoBean.evento.palestranteConvidado.telefoneUm}"
											mask="(99)999999999">
										</p:inputMask>
									</div>
								</p:fieldset>
							</div>
							<div class="ui-g-12"
								jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
								<!-- Endereco -->
								<p:fieldset legend="Endereço">
									<div class="ui-g-12"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:outputLabel value="Endereço" for="endereco" />
									</div>
									<div class="ui-g-12 ui-lg-12"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:inputText id="endereco" required="true"
											value="#{cadastroPalestraConvidadoBean.evento.palestranteConvidado.endereco.logradouro}" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:outputLabel value="Número" for="numero" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:outputLabel value="Bairro" for="bairro" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:inputText id="numero" required="true"
											value="#{cadastroPalestraConvidadoBean.evento.palestranteConvidado.endereco.numero}" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:inputText id="bairro" required="true"
											value="#{cadastroPalestraConvidadoBean.evento.palestranteConvidado.endereco.bairro}" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:outputLabel value="Cidade" for="cidade" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:outputLabel value="UF" for="uf" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:inputText id="cidade" required="true"
											value="#{cadastroPalestraConvidadoBean.evento.palestranteConvidado.endereco.cidade}" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroPalestraConvidadoBean.convidadoValido}">
										<p:selectOneMenu id="uf" label="UF" required="true"
											value="#{cadastroPalestraConvidadoBean.evento.palestranteConvidado.endereco.estado}">
											<f:selectItem itemLabel="Selecione" />
											<f:selectItems value="#{cadastroFichaBean.estados}"
												var="estado" itemValue="#{estado.sigla}"
												itemLabel="#{estado.sigla}" />
										</p:selectOneMenu>
									</div>
								</p:fieldset>
							</div>
							<div class="save ui-g-12">
								<p:commandButton id="salvar" value="Salvar" style="width: auto;"
									action="#{cadastroPalestraConvidadoBean.salvar()}"
									update="@form" process="@form" icon="fa fa-save"
									styleClass="green-btn" title="Somente a Gráfica tem acesso." />

								<p:commandButton icon="fa fa-trash" value="Excluir"
									style="width: auto; margin-left: 15px;"
									oncomplete="PF('confirmacaoExclusao').show();" process="@this"
									styleClass="red-btn"
									update=":form-cadastro:confirmacaoExclusaoDialog"
									rendered="#{cadastroPalestraConvidadoBean.editando}" />

								<p:button value="Cancelar"
									style="width: auto; margin-left: 15px;"
									outcome="/evento-convidado/pesquisa-palestra" icon="fa fa-remove" />
								<p:defaultCommand target="salvar" />
							</div>
						</div>
					</div>
				</div>
			</div>

			<p:dialog
				header="#{cadastroPalestraConvidadoBean.evento.palestranteConvidado.nome}"
				id="fotoDialog" widgetVar="fotoDialogWidgetVar">
				<p:graphicImage
					value="#{cadastroPalestraConvidadoBean.evento.palestranteConvidado.carregarImagem()}"
					style="max-width: 300px"
					rendered="#{cadastroPalestraConvidadoBean.evento.palestranteConvidado.exibirImagem}"
					id="produtoFoto" />
			</p:dialog>

			<p:confirmDialog header="Exclusão do Convidado do Evento"
				message="Tem certeza que deseja excluir o Convidado #{cadastroPalestraConvidadoBean.evento.palestranteConvidado.nome}"
				widgetVar="confirmacaoExclusao" id="confirmacaoExclusaoDialog">
				<p:button value="Não"
					onclick="PF('confirmacaoExclusao').hide(); return false;" />
				<p:commandButton value="Sim"
					action="#{cadastroPalestraConvidadoBean.excluir()}"
					oncomplete="PF('confirmacaoExclusao').hide();" process="@this"
					update="@form" />
			</p:confirmDialog>
		</h:form>
	</ui:define>

</ui:composition>
