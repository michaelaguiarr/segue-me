<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	template="/WEB-INF/template.xhtml">

	<ui:define name="title">Pesquisa Palestra Casal no Segue-me</ui:define>

	<f:metadata>
		<f:viewAction action="#{pesquisaPalestraCasalBean.inicializar()}" />
	</f:metadata>

	<ui:define name="search">
		<div class="ui-fluid">
			<div class="ui-g-12">
				<div class="card card-w-title">
					<h1>Pesquisa Palestra Casal no Segue-me</h1>
					<div class="ui-g">
						<div class="ui-g-12 ui-lg-6">
							<p:selectOneMenu id="Paroquia"
								value="#{pesquisaPalestraCasalBean.filter.paroquia}"
								disabled="#{not seguranca.administradorGeral}">
								<f:selectItem itemLabel="Todos as Paroquias" />
								<f:selectItems value="#{pesquisaPalestraCasalBean.listaParoquia}"
									var="paroquia" itemValue="#{paroquia}"
									itemLabel="#{paroquia.descricao}" />
								<p:ajax listener="#{pesquisaPalestraCasalBean.onSegueMeChange()}"
									update="segueMe" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:selectOneMenu id="segueMe" label="Segue-Me"
								value="#{pesquisaPalestraCasalBean.filter.segueMe}"
								disabled="#{not seguranca.administrador}">
								<f:selectItem itemLabel="Todos os Segue-Me"
									noSelectionOption="true" />
								<f:selectItems value="#{pesquisaPalestraCasalBean.listaSegueMe}"
									var="segueMe" itemValue="#{segueMe}"
									itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12">
							<p:selectOneMenu id="palestra"
								value="#{pesquisaPalestraCasalBean.filter.palestra}"
								disabled="#{not seguranca.graficaAndComandante}">
								<f:selectItem itemLabel="Todos as Palestras" />
								<f:selectItems value="#{pesquisaPalestraCasalBean.listaPaletras}"
									var="palestras" itemValue="#{palestras}" itemLabel="#{palestras.nome}" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:inputText id="nome" placeholder="Nome Ele" autocomplete="off"
								value="#{pesquisaPalestraCasalBean.filter.nomeEle}" />
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:inputText id="apelidoEle" placeholder="Apelido Ele"
								autocomplete="off"
								value="#{pesquisaPalestraCasalBean.filter.apelidoEle}" />
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:inputText id="nomeEla" placeholder="Nome Ela"
								autocomplete="off"
								value="#{pesquisaPalestraCasalBean.filter.nomeEla}" />
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:inputText id="apelidoEla" placeholder="Apelido Ela"
								autocomplete="off"
								value="#{pesquisaPalestraCasalBean.filter.apelidoEla}" />
						</div>
						<div class="ui-g-12">
							<p:commandButton id="pesquisar" value="Pesquisar"
								style="width: auto;"
								action="#{pesquisaPalestraCasalBean.pesquisar()}" update="@form"
								process="@form" icon="fa fa-search" styleClass="green-btn" />
							<p:defaultCommand target="pesquisar" />
						</div>
					</div>
				</div>
			</div>
		</div>
	</ui:define>

	<ui:define name="content">

		<h:form id="form">
			<ui:include src="/WEB-INF/facelets/evento-casal/palestra-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>Lista de Casal no Segue-me</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />

						<div class="ui-g">


							<div class="ui-g-12">
								<h:outputText style="color:#777;"
									value="Marque os participantes na lista e escolha: imprimir os crachás (gera o PDF), ou atualizar a situação (impresso / não impresso)." />
							</div>

							<div class="ui-g-12">
								<p:commandButton value="Imprimir selecionados"
									style="width: auto; margin-right: 25px;" icon="fa fa-print"
									styleClass="green-btn"
									title="Gera o PDF dos crachás dos participantes marcados, para imprimir."
									action="#{pesquisaPalestraCasalBean.imprimirSelecionados()}"
									process="@form" ajax="false" />
								<h:outputText style="color:#777; margin-right: 6px;"
									value="Situação:" />
								<p:commandButton value="Marcar como impresso" type="button"
									style="width: auto;" icon="fa fa-check"
									title="Muda a situação para impresso nos participantes marcados."
									onclick="PF('confMarcarImpressos').show();" />
								<p:commandButton value="Marcar como não impresso" type="button"
									style="width: auto;" icon="fa fa-undo"
									title="Muda a situação para não impresso (para reimprimir depois)."
									onclick="PF('confMarcarImprimir').show();" />
							</div>


							<p:dataTable var="casal" id="datatable-casal"
								value="#{pesquisaPalestraCasalBean.listaEventoCasal}"
								reflow="true" selectionMode="single"
								selection="#{pesquisaPalestraCasalBean.evento}" rowKey="#{casal}"
								emptyMessage="Casal não encontrado!" paginator="true"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
								currentPageReportTemplate=" Exibindo de {startRecord} a {endRecord} no total de {totalRecords} - Página: {currentPage}/{totalPages} "
								rows="25">

								<p:ajax event="rowSelect"
									listener="#{pesquisaPalestraCasalBean.selecionar()}" />

								<p:headerRow>
									<p:column colspan="2">
										<h:outputText value="#{casal.equipe.titulo}" />
									</p:column>
								</p:headerRow>

								<p:column headerText="Sel." width="30">
									<h:selectBooleanCheckbox value="#{casal.selecionado}"
										onclick="event.stopPropagation();" />
								</p:column>

								<p:column headerText="Casal" sortBy="#{casal.casal.apelidoEle}"
									width="200">
									<h:outputText
										value="#{casal.casal.apelidoEle} e #{casal.casal.apelidoEla}" />
								</p:column>

								<p:column headerText="Telefone Ele / Ela"
									sortBy="#{casal.casal.telefoneEleUm}" width="200">
									<h:outputText
										value="#{casal.casal.telefoneEleUm} / #{casal.casal.telefoneElaUm}" />
								</p:column>

								<p:column headerText="Palestra" sortBy="#{casal.palestra.ordem}">
									<h:outputText value="#{casal.palestra.nome}" />
								</p:column>

								<p:column headerText="Situação" width="80"
									sortBy="#{casal.statusConvite.nome}">
									<span class="situacao #{casal.statusConvite.coresParaStyle}">#{casal.statusConvite.nome}</span>
								</p:column>

								<p:column headerText="Paroquia"
									sortBy="#{casal.segueMe.paroquia.descricao}"
									rendered="#{seguranca.administradorGeral}" width="200">
									<h:outputText value="#{casal.segueMe.paroquia.descricao}" />
								</p:column>

								<p:column headerText="Segue-me"
									sortBy="#{casal.segueMe.numeroRomano.numeroRomano}"
									rendered="#{seguranca.administrador}" width="50">
									<h:outputText
										value="#{casal.segueMe.numeroRomano.numeroRomano}" />
								</p:column>
								<p:column headerText="Crachá Impresso?" sortBy="#{casal.cracha}"
									width="50">
									<h:outputText value="#{casal.cracha ? 'Não impresso' : 'Impresso'}" style="padding:2px 8px; border-radius:10px; color:#fff; font-size:0.85em; white-space:nowrap; background-color:#{casal.cracha ? '#9e9e9e' : '#66bb6a'};" />
								</p:column>
							</p:dataTable>

							<p:confirmDialog widgetVar="confMarcarImprimir"
								header="Marcar como não impresso"
								message="Marcar os participantes selecionados como NÃO impressos? Eles voltam para a fila de impressão.">
								<p:commandButton value="Sim" icon="fa fa-check"
									action="#{pesquisaPalestraCasalBean.marcarSelecionadosParaImprimir()}"
									process="@form" update="@form"
									oncomplete="PF('confMarcarImprimir').hide();" />
								<p:commandButton value="Não" type="button" icon="fa fa-close"
									onclick="PF('confMarcarImprimir').hide();" />
							</p:confirmDialog>

							<p:confirmDialog widgetVar="confMarcarImpressos"
								header="Marcar como impresso"
								message="Marcar os participantes selecionados como impressos?">
								<p:commandButton value="Sim" icon="fa fa-check"
									action="#{pesquisaPalestraCasalBean.marcarSelecionadosComoImpressos()}"
									process="@form" update="@form"
									oncomplete="PF('confMarcarImpressos').hide();" />
								<p:commandButton value="Não" type="button" icon="fa fa-close"
									onclick="PF('confMarcarImpressos').hide();" />
							</p:confirmDialog>

							<p:dialog
								header="#{pesquisaPalestraCasalBean.evento.casal.apelidoEle}"
								id="fotoDialogEle" widgetVar="fotoDialogWidgetVarEle">
								<p:graphicImage
									value="#{pesquisaPalestraCasalBean.evento.casal.carregarImagemEle()}"
									style="max-width: 300px" id="fotoEle" />
							</p:dialog>

							<p:dialog
								header="#{pesquisaPalestraCasalBean.evento.casal.apelidoEla}"
								id="fotoDialogEla" widgetVar="fotoDialogWidgetVarEla">
								<p:graphicImage
									value="#{pesquisaPalestraCasalBean.evento.casal.carregarImagemEla()}"
									style="max-width: 300px" id="fotoEla" />
							</p:dialog>
						</div>
					</div>
				</div>
			</div>
		</h:form>

	</ui:define>

</ui:composition>
