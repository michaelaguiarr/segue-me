<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="title">Cadastro Casal no Segue-me</ui:define>

	<ui:define name="toolbar">
		<p:button outcome="/evento-casal/pesquisa-casal" value="Pesquisar"
			icon="fa fa-search" />
	</ui:define>

	<f:metadata>
		<o:viewParam name="casal" value="#{cadastroEventoCasalBean.evento}" />
		<f:viewAction action="#{cadastroEventoCasalBean.inicializar()}" />
	</f:metadata>

	<ui:define name="content">
		<h:form id="form-cadastro" enctype="multipart/form-data">
			<ui:include src="/WEB-INF/facelets/evento-casal/casal-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>#{cadastroEventoCasalBean.editando ? 'Edição Casal no
							Segue-me' : 'Novo Casal no Segue-me'}</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
						<p:growl />
						<p:focus for="equipe" />
						<div class="ui-g">
							<div class="ui-g-12">
								<!-- Seguidor -->
								<p:fieldset legend="Segue-Me">
									<div class="ui-g-6">
										<p:outputLabel value="Paroquia" for="paroquia" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Segue-Me" for="segueMe" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="paroquia"
											value="#{cadastroEventoCasalBean.paroquia}" required="true"
											disabled="#{not seguranca.administradorGeral}">
											<f:selectItem itemLabel="Selecione a Paroquia" />
											<f:selectItems
												value="#{cadastroEventoCasalBean.listaParoquia}"
												var="paroquia" itemValue="#{paroquia}"
												itemLabel="#{paroquia.descricao}" />
											<p:ajax
												listener="#{cadastroEventoCasalBean.onSegueMeChange()}"
												update="segueMe" />
										</p:selectOneMenu>
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="segueMe" label="Segue-me" required="true"
											value="#{cadastroEventoCasalBean.evento.segueMe}"
											disabled="#{not seguranca.administrador}">
											<f:selectItem itemLabel="Selecione o Segue-Me" />
											<f:selectItems
												value="#{cadastroEventoCasalBean.listaSegueMe}"
												var="segueMe" itemValue="#{segueMe}"
												itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
										</p:selectOneMenu>
									</div>
									<div class="ui-g-6">
										<p:outputLabel value="Equipe" for="equipe" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Função" for="funcao" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="equipe"
											value="#{cadastroEventoCasalBean.evento.equipe}"
											required="true"
											disabled="#{not seguranca.graficaAndComandante}">
											<f:selectItem itemLabel="Selecione a Equipe" />
											<f:selectItems
												value="#{cadastroEventoCasalBean.listaEquipes}" var="equipe"
												itemValue="#{equipe}" itemLabel="#{equipe.titulo}" />
											<p:ajax
												listener="#{cadastroEventoCasalBean.onEquipeChange()}"
												update="funcao circulo" />
										</p:selectOneMenu>
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="funcao" label="Função" required="true"
											value="#{cadastroEventoCasalBean.evento.funcao}">
											<f:selectItem itemLabel="Selecione a Função" />
											<f:selectItems
												value="#{cadastroEventoCasalBean.listaFuncaos}" var="funcao"
												itemValue="#{funcao}" itemLabel="#{funcao.descricao}" />
											<p:ajax
												listener="#{cadastroEventoSeguidorBean.onCirculoChange()}"
												update="circulo" />
										</p:selectOneMenu>
									</div>
									
									<div class="ui-g-12">
										<p:outputLabel value="Circulo" for="circulo" />
									</div>
									<div class="ui-g-12 ui-lg-12">
										<p:selectOneMenu id="circulo"
											value="#{cadastroEventoCasalBean.evento.circulo}"
											disabled="#{not cadastroEventoCasalBean.exibirCirculo}">
											<f:selectItem itemLabel="Circulo" />
											<f:selectItems value="#{cadastroEventoCasalBean.listaCirculo}"
												var="circulo" itemValue="#{circulo}"
												itemLabel="#{circulo.corCirculo}" />
										</p:selectOneMenu>
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:outputLabel value="Situação" for="situacao" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:outputLabel value="Observação" for="obs" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:selectOneMenu id="situacao"
											value="#{cadastroEventoCasalBean.evento.statusConvite}"
											required="true">
											<f:selectItem itemLabel="Selecione a Situação" />
											<f:selectItems
												value="#{cadastroEventoCasalBean.statusConvites}"
												var="status" itemValue="#{status}"
												itemLabel="#{status.nome}" />
										</p:selectOneMenu>
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:inputTextarea rows="6" cols="33" id="obs"
											value="#{cadastroFichaBean.evento.motivoRecusa}" />
									</div>
									<div class="ui-g-12"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:outputLabel value="Imprimir Crachá?" for="cracha" />
									</div>

									<div class="ui-g-12 ui-lg-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:selectBooleanButton id="cracha"
											value="#{cadastroEventoCasalBean.evento.cracha}"
											onLabel="Sim" offLabel="Não" onIcon="ui-icon-check"
											offIcon="ui-icon-close" style="width:60px" />
									</div>
								</p:fieldset>
							</div>
							<div class="ui-g-12">
								<!-- Seguidor -->
								<p:fieldset legend="Casal">
									<div class="ui-g-6">
										<p:graphicImage
											value="#{cadastroEventoCasalBean.evento.casal.carregarImagemEle()}"
											rendered="#{cadastroEventoCasalBean.evento.casal.exibirImagemEle}"
											width="150px" height="150px" id="fotoEle"
											onclick="PF('fotoDialogWidgetVarEle').show()" cache="FALSE" />
									</div>

									<div class="ui-g-12">
										<p:outputLabel value="Casal (busque por nome, apelido ou telefone)"
											for="casal" />
									</div>

									<div class="ui-g-12 ui-md-12 ui-lg-12">
										<div class="ui-inputgroup">
											<p:autoComplete id="casal" required="true"
												style="width: 90%;" styleClass="Fleft" autocomplete="off"
												value="#{cadastroEventoCasalBean.evento.casal}"
												completeMethod="#{cadastroEventoCasalBean.buscaPessoas}"
												var="casal"
												itemLabel="#{empty casal.apelidoEle and empty casal.apelidoEla ? '' : casal.apelidoEle}#{empty casal.apelidoEle and empty casal.apelidoEla ? '' : ' e '}#{empty casal.apelidoEle and empty casal.apelidoEla ? '' : casal.apelidoEla}"
												itemValue="#{casal}" minQueryLength="3" maxResults="10"
												forceSelection="true" emptyMessage="Casal não encontrado!">
												<p:ajax event="itemSelect" update="@form" />
												<p:column>
													<p:outputLabel value="#{casal.apelidoEle}" />
												</p:column>

												<p:column>
													<p:outputLabel value="#{casal.apelidoEla}" />
												</p:column>

												<p:column>
													<p:outputLabel value="#{casal.telefoneEleUm}" />
												</p:column>

												<p:column>
													<p:outputLabel value="#{casal.telefoneElaUm}" />
												</p:column>

											</p:autoComplete>
											<p:button icon="fa fa-plus"
												outcome="/evento-casal/cadastro-casal"
												style="width: 10%; margin: 0;" id="novo-casal"
												styleClass="white-button"
												rendered="#{not cadastroEventoCasalBean.seguidorValido}" />
											<p:button icon="fa fa-pencil"
												outcome="/evento-casal/cadastro-casal"
												style="width: 10%; margin: 0;" id="editar-seguidor"
												styleClass="white-button"
												rendered="#{cadastroEventoCasalBean.seguidorValido}">
												<f:param name="casal"
													value="#{cadastroEventoCasalBean.evento.casal.id}" />
											</p:button>
										</div>
									</div>
									<div class="ui-g-12"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:outputLabel value="Email Ele" for="emailEle" />
									</div>

									<div class="ui-g-6 ui-lg-12"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:inputText placeholder="Email" id="emailEle"
											value="#{cadastroEventoCasalBean.evento.casal.emailEle}" />
									</div>
									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:outputLabel value="Telefone 1 Ele" for="telefoneUmEle" />
									</div>
									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:outputLabel value="Telefone 2 Ele" for="telefoneDoisEle" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:inputMask id="telefoneUmEle" placeholder="Telefone 1"
											value="#{cadastroEventoCasalBean.evento.casal.telefoneEleUm}"
											mask="(99)999999999">
										</p:inputMask>
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:inputMask id="telefoneDoisEle" placeholder="Telefone 2"
											value="#{cadastroEventoCasalBean.evento.casal.telefoneEleDois}"
											mask="(99)999999999">
										</p:inputMask>
									</div>

									<div class="ui-g-12"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:outputLabel value="Email Ela" for="emailEla" />
									</div>

									<div class="ui-g-6 ui-lg-12"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:inputText placeholder="Email" id="emailEla"
											value="#{cadastroEventoCasalBean.evento.casal.emailEla}" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:outputLabel value="Telefone 1 Ela" for="telefoneUmEla" />
									</div>
									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:outputLabel value="Telefone 2 Ela" for="telefoneDoisEla" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:inputMask id="telefoneUmEla" placeholder="Telefone 1"
											required="true"
											value="#{cadastroEventoCasalBean.evento.casal.telefoneElaUm}"
											mask="(99)999999999">
										</p:inputMask>
									</div>
									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:inputMask id="telefoneDoisEla" placeholder="Telefone 2"
											value="#{cadastroEventoCasalBean.evento.casal.telefoneElaDois}"
											mask="(99)999999999">
										</p:inputMask>
									</div>
								</p:fieldset>
							</div>
							<div class="ui-g-12"
								jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
								<!-- Endereco -->
								<p:fieldset legend="Endereço">
									<div class="ui-g-12"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:outputLabel value="Endereço" for="endereco" />
									</div>
									<div class="ui-g-12 ui-lg-12"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:inputText id="endereco" required="true"
											value="#{cadastroEventoCasalBean.evento.casal.endereco.logradouro}" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:outputLabel value="Número" for="numero" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:outputLabel value="Bairro" for="bairro" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:inputText id="numero" required="true"
											value="#{cadastroEventoCasalBean.evento.casal.endereco.numero}" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:inputText id="bairro" required="true"
											value="#{cadastroEventoCasalBean.evento.casal.endereco.bairro}" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:outputLabel value="Cidade" for="cidade" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:outputLabel value="UF" for="uf" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:inputText id="cidade" required="true"
											value="#{cadastroEventoCasalBean.evento.casal.endereco.cidade}" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoCasalBean.seguidorValido}">
										<p:selectOneMenu id="uf" label="UF" required="true"
											value="#{cadastroEventoCasalBean.evento.casal.endereco.estado}">
											<f:selectItem itemLabel="Selecione" />
											<f:selectItems value="#{cadastroFichaBean.estados}"
												var="estado" itemValue="#{estado.sigla}"
												itemLabel="#{estado.sigla}" />
										</p:selectOneMenu>
									</div>
								</p:fieldset>
							</div>
							<div class="save ui-g-12">
								<p:commandButton id="salvar" value="Salvar" style="width: auto;"
									action="#{cadastroEventoCasalBean.salvar()}" update="@form"
									process="@form" icon="fa fa-save" styleClass="green-btn"
									title="Somente a Gráfica tem acesso." />

								<p:commandButton icon="fa fa-trash" value="Excluir"
									style="width: auto; margin-left: 15px;"
									oncomplete="PF('confirmacaoExclusao').show();" process="@this"
									styleClass="red-btn"
									update=":form-cadastro:confirmacaoExclusaoDialog"
									rendered="#{cadastroEventoCasalBean.editando}" />

								<p:button value="Cancelar"
									style="width: auto; margin-left: 15px;"
									outcome="pesquisa-casal" icon="fa fa-remove" />
								<p:defaultCommand target="salvar" />
							</div>
						</div>
					</div>
				</div>
			</div>
			<p:dialog header="#{cadastroEventoCasalBean.evento.casal.nomeEle}"
				id="fotoDialogEle" widgetVar="fotoDialogWidgetVarEle">
				<p:graphicImage
					value="#{cadastroEventoCasalBean.evento.casal.carregarImagemEle()}"
					style="max-width: 300px"
					rendered="#{cadastroEventoCasalBean.evento.casal.exibirImagemEle}"
					id="imagemEle" />
			</p:dialog>

			<p:dialog header="#{cadastroEventoCasalBean.evento.casal.nomeEla}"
				id="fotoDialogEla" widgetVar="fotoDialogWidgetVarEla">
				<p:graphicImage
					value="#{cadastroEventoCasalBean.evento.casal.carregarImagemEla()}"
					style="max-width: 300px"
					rendered="#{cadastroEventoCasalBean.evento.casal.exibirImagemEla}"
					id="imagemEla" />
			</p:dialog>

			<p:confirmDialog header="Exclusão do Casal do Evento"
				message="Tem certeza que deseja excluir o Casal #{cadastroEventoCasalBean.evento.casal.apelidoEle} e #{cadastroEventoCasalBean.evento.casal.apelidoEla}"
				widgetVar="confirmacaoExclusao" id="confirmacaoExclusaoDialog">
				<p:button value="Não"
					onclick="PF('confirmacaoExclusao').hide(); return false;" />
				<p:commandButton value="Sim"
					action="#{cadastroEventoCasalBean.excluir()}"
					oncomplete="PF('confirmacaoExclusao').hide();" process="@this"
					update="@form" />
			</p:confirmDialog>
		</h:form>
	</ui:define>

</ui:composition>
