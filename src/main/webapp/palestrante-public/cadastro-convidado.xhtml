<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui" template="/WEB-INF/template/template-public.xhtml">

	<ui:define name="title">Cadastro Palestrante Convidado</ui:define>

	<f:metadata>
		<o:viewParam name="convidado" value="#{cadastroConvidadoPalestraBean.palestranteConvidado}" />
		<f:viewAction action="#{cadastroConvidadoPalestraBean.inicializar()}" />
	</f:metadata>
	<ui:define name="cancelar">
		<p:commandButton value="Cancelar" style="width: auto; margin-left: 15px;"
			action="#{cadastroConvidadoPalestraBean.limparTela()}" process="@this" update="@form" icon="fa fa-remove" />
	</ui:define>
	<ui:define name="content">
		<h:form id="form-cadastro" enctype="multipart/form-data">
			<ui:include
				src="/WEB-INF/facelets/palestranteConvidado-public/palestranteConvidado-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>#{cadastroConvidadoPalestraBean.editando ? 'Edição Palestrante Convidado' :
							'Novo Palestrante Convidado'}</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
						<p:growl />
						<div class="ui-g">
							<p:focus for="nome" />
							<ui:include
								src="/WEB-INF/facelets/palestranteConvidado/cadastro-convidado-mob.xhtml" />
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
