<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="title">Cadastro Círculo</ui:define>

	<ui:define name="toolbar">
		<p:button outcome="/circulo/pesquisa-circulo" value="Pesquisar"
			icon="fa fa-search" />
	</ui:define>

	<f:metadata>
		<o:viewParam name="circulo" value="#{cadastroCirculoBean.circulo}" />
		<f:viewAction action="#{cadastroCirculoBean.inicializar()}" />
	</f:metadata>

	<ui:define name="content">
		<h:form id="form-cadastro">
			<ui:include src="/WEB-INF/facelets/circulo/circulo-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>#{cadastroCirculoBean.editando ? 'Edição Círculo' : 'Novo
							Círculo'}</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
						<p:focus for="cor" />
						<div class="ui-g">
							<div class="ui-g-12">
								<!-- Seguidor -->
								<p:fieldset legend="Circulo">
									<div class="ui-g-6">
										<p:outputLabel value="Paróquia" for="paroquia" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Segue-me" for="segueMe" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="paroquia" required="true"
											value="#{cadastroCirculoBean.paroquia}">
											<f:selectItem itemLabel="Paroquia" />
											<f:selectItems value="#{cadastroCirculoBean.listaParaquia}"
												var="paroquia" itemValue="#{paroquia}"
												itemLabel="#{paroquia.descricao}" />
											<p:ajax listener="#{cadastroCirculoBean.onSegueMeChange()}"
												update="segueMe" />
										</p:selectOneMenu>
									</div>


									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="segueMe" label="Segue-Me" required="true"
											value="#{cadastroCirculoBean.circulo.segueMe}">
											<f:selectItem itemLabel="Segue-me" noSelectionOption="true" />
											<f:selectItems value="#{cadastroCirculoBean.listaSegueMe}"
												var="segueMe" itemValue="#{segueMe}"
												itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
										</p:selectOneMenu>
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Cor" for="cor" />
									</div>
									<div class="ui-g-6">
										<p:outputLabel value="Nome" for="nome" />
									</div>
									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="cor" label="Cor" required="true"
											value="#{cadastroCirculoBean.circulo.corCirculo}">
											<f:selectItem itemLabel="Cor" noSelectionOption="true" />
											<f:selectItems value="#{cadastroCirculoBean.corCirculo}"
												var="cor" itemValue="#{cor}" itemLabel="#{cor.descricao}" />
										</p:selectOneMenu>
									</div>
									<div class="ui-g-6 ui-lg-6">
										<p:inputText id="nome"
											value="#{cadastroCirculoBean.circulo.nome}" />
									</div>

									<div class="ui-g-12">
										<p:outputLabel value="Ativo" for="ativo" />
									</div>

									<div class="ui-g-12 ui-lg-6">
										<p:selectBooleanButton id="ativo"
											value="#{cadastroCirculoBean.circulo.ativo}" onLabel="Sim"
											offLabel="Não" onIcon="ui-icon-check" offIcon="ui-icon-close"
											style="width:60px" />
									</div>

									<div class="ui-g-12">
										<p:outputLabel value="Imagem" />
									</div>
									<div class="ui-g-12 ui-lg-6">
										<h:panelGrid id="fotoPanelGroupUpload">
											<p:fileUpload
												fileUploadListener="#{cadastroCirculoBean.upload}"
												allowTypes="/(\.|\/)(jpe?g)$/"
												invalidFileMessage="São permitidas somente imagens (jpg)"
												auto="true" label="Foto"
												update="fotoPanelGroup fotoPanelGroupUpload"
												rendered="#{cadastroCirculoBean.imagem == null}" />
										</h:panelGrid>
									</div>

									<div class="ui-g-12">
										<h:panelGrid id="fotoPanelGroup">
											<p:graphicImage value="#{cadastroCirculoBean.imagem}"
												rendered="#{cadastroCirculoBean.imagem ne null}"
												width="200px" id="foto" />
											<p:commandButton value="Remover Foto"
												style="width: auto; margin-left: 15px;"
												actionListener="#{cadastroCirculoBean.removerFoto}"
												rendered="#{cadastroCirculoBean.imagem ne null}"
												process="@this"
												update="fotoPanelGroup, fotoPanelGroupUpload" />
										</h:panelGrid>
									</div>
								</p:fieldset>
							</div>
							<div class="ui-g-12"
								jsf:rendered="#{cadastroCirculoBean.editando}">
								<!-- Seguidor -->
								<p:fieldset legend="Seguimista">
									<div class="ui-g-12">
										<p:graphicImage
											value="#{cadastroEventoSeguidorBean.evento.seguidor.carregarImagem()}"
											rendered="#{cadastroEventoSeguidorBean.evento.seguidor.exibirImagem}"
											width="150px" height="150px" id="fotoEvento"
											onclick="PF('fotoDialogWidgetVar').show()" />
									</div>

									<div class="ui-g-12">
										<p:outputLabel value="Nome Seguidor" for="seguidor" />
									</div>

									<div class="ui-g-12 ui-md-12 ui-lg-12">
										<div class="ui-inputgroup">
											<p:autoComplete id="seguidor" styleClass="Fleft"
												autocomplete="off" value="#{cadastroCirculoBean.evento}"
												completeMethod="#{cadastroCirculoBean.buscaPessoas}"
												var="seguidor" itemLabel="#{seguidor.seguidor.nome}"
												itemValue="#{seguidor}" minQueryLength="3" maxResults="10"
												forceSelection="true" emptyMessage="Nome não encontrado!">
												<p:ajax event="itemSelect"
													listener="#{cadastroCirculoBean.addSeguidor()}"
													update="@form" />
												<p:column>
													<p:outputLabel value="#{seguidor.seguidor.nome}" />
												</p:column>

												<p:column>
													<p:outputLabel value="#{seguidor.seguidor.apelido}" />
												</p:column>

											</p:autoComplete>
										</div>
									</div>
								</p:fieldset>
							</div>
							<div class="ui-g-12"
								jsf:rendered="#{cadastroCirculoBean.editando}">
								<p:messages id="messagesSeguidor" closable="true" />
								<!-- Seguidor -->
								<p:fieldset legend="Lista Seguimista">
									<div class="ui-g-12">
										<p:dataTable var="seguidor" id="datatable-seguidor"
											value="#{cadastroCirculoBean.circulo.eventos}" reflow="true"
											selectionMode="single"
											selection="#{cadastroCirculoBean.evento}"
											rowKey="#{seguidor}"
											emptyMessage="Seguimista não encontrado!" paginator="true"
											sortBy="#{seguidor.funcao.descricao}, #{seguidor.seguidor.nome}"
											paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
											currentPageReportTemplate=" Exibindo de {startRecord} a {endRecord} no total de {totalRecords} - Página: {currentPage}/{totalPages} "
											rows="20" rowsPerPageTemplate="15, 30, 60">

											<p:column headerText="Nome"
												sortBy="#{seguidor.seguidor.nome}" width="200">
												<div jsf:rendered="#{seguidor.seguidor != null}">
													<h:outputText value="#{seguidor.seguidor.nome} - #{seguidor.seguidor.apelido}" />
													<span class="borda"><h:outputText styleClass="idade"
														value="#{seguidor.idade}" /></span>
												<i
													class="#{seguidor.seguidor.iconeParaSexo} Fright MarRight10" />
												</div>
												<div jsf:rendered="#{seguidor.casal != null}">
													<h:outputText
														value="#{seguidor.casal.apelidoEle} e #{seguidor.casal.apelidoEla}" />
												</div>
												<div jsf:rendered="#{seguidor.funcao != null}">
													<span class="situacao ">Padrinhos</span>
												</div>
											</p:column>

											<p:column headerText="Data Nascimento"
												sortBy="#{seguidor.seguidor.dataNascimento}" width="100">
												<h:outputText value="#{seguidor.seguidor.dataNascimento}">
													<f:convertDateTime pattern="dd/MM/yyyy" />
												</h:outputText>
											</p:column>

											<p:column headerText="Telefone"
												sortBy="#{seguidor.seguidor.telefoneUm}" width="100">
												<h:outputText value="#{seguidor.seguidor.telefoneUm}" />
												<div jsf:rendered="#{seguidor.casal != null}">
													<h:outputText
														value="#{seguidor.casal.telefoneEleUm} / #{seguidor.casal.telefoneElaUm}" />
												</div>
											</p:column>
											<p:column width="10">
												<p:commandLink
													action="#{cadastroCirculoBean.removeSeguidor()}"
													process="@this" update="datatable-seguidor">
													<i class="fa fa-trash"
														title="Deseja remover seguimista do circulo?" />
													<f:setPropertyActionListener value="#{seguidor}"
														target="#{cadastroCirculoBean.evento}" />
												</p:commandLink>
											</p:column>

										</p:dataTable>
										<p:dialog
											header="#{pesquisaEventoSeguidorBean.evento.seguidor.nome}"
											id="fotoDialog" widgetVar="fotoDialogWidgetVar">
											<p:graphicImage
												value="#{pesquisaEventoSeguidorBean.evento.seguidor.carregarImagem()}"
												style="max-width: 300px" id="produtoFoto" />
										</p:dialog>
									</div>
								</p:fieldset>
							</div>
							<div class="save ui-g-12">
								<p:commandButton id="salvar" value="Salvar" style="width: auto;"
									action="#{cadastroCirculoBean.salvar()}" update="@form"
									process="@form" icon="fa fa-save" styleClass="green-btn" />


								<p:commandButton icon="fa fa-trash" value="Excluir"
									style="width: auto; margin-left: 15px;"
									oncomplete="PF('confirmacaoExclusao').show();" process="@this"
									styleClass="red-btn"
									update=":form-cadastro:confirmacaoExclusaoDialog"
									rendered="#{cadastroCirculoBean.editando}" />

								<p:button value="Cancelar"
									style="width: auto; margin-left: 15px;"
									outcome="pesquisa-circulo" icon="fa fa-remove" />
								<p:defaultCommand target="salvar" />
							</div>
						</div>
					</div>
				</div>
			</div>
			<p:confirmDialog header="Exclusão do Circulo"
				message="Tem certeza que deseja excluir o Circulo #{cadastroCirculoBean.circulo.nome} Cor #{cadastroCirculoBean.circulo.corCirculo.descricao}"
				widgetVar="confirmacaoExclusao" id="confirmacaoExclusaoDialog">
				<p:button value="Não"
					onclick="PF('confirmacaoExclusao').hide(); return false;" />
				<p:commandButton value="Sim"
					action="#{cadastroCirculoBean.excluir()}"
					oncomplete="PF('confirmacaoExclusao').hide();" process="@this"
					update="@form" />
			</p:confirmDialog>
		</h:form>
	</ui:define>

</ui:composition>
