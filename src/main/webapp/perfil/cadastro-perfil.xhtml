<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="title">Cadastro Perfil</ui:define>

	<f:metadata>
		<f:viewParam name="id" value="#{cadastroPerfilBean.perfil}" />
		<f:viewAction action="#{cadastroPerfilBean.inicializar()}" />
	</f:metadata>

	<ui:define name="content">
		<h:form id="form-cadastro">
			<ui:include src="/WEB-INF/facelets/perfil/toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>#{cadastroPerfilBean.editando ? 'Edição de perfil' :
							'Novo perfil'}</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
						<p:focus for="nome" />

						<div class="ui-g">
							<div class="ui-g-12">
								<p:outputLabel value="Nome" for="nome" />
							</div>

							<div class="ui-g-12 ui-md-12 ui-lg-6">
								<p:inputText placeholder="Nome" id="nome" required="true"
									value="#{cadastroPerfilBean.perfil.nome}" />
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Descrição" for="descricao" />
							</div>

							<div class="ui-g-12 ui-md-12 ui-lg-6">
								<p:inputText placeholder="Descrição do Perfil" id="descricao"
									value="#{cadastroPerfilBean.perfil.descricao}">
								</p:inputText>
							</div>
							<div class="ui-g-12">
								<p:outputLabel value="Modulos" for="modulo"/>
							</div>
							<div class="ui-g-12 ui-md-12 ui-lg-6">
								<p:pickList id="modulo" value="#{cadastroPerfilBean.listaModulos}"
									var="grupo" itemValue="#{grupo}" responsive="true"
									itemLabel=" #{grupo.descricao}" showSourceFilter="true"
									showTargetFilter="true" showCheckbox="true" required="true"
									filterMatchMode="contains" converter="aplicacaoModuloConverter">
									<f:facet name="sourceCaption">Grupos disponíveis</f:facet>
									<f:facet name="targetCaption">Grupos do perfil</f:facet>
								</p:pickList>
							</div>

							<div class="save ui-g-12">
								<p:commandButton value="Salvar" style="width: auto;"
									action="#{cadastroPerfilBean.salvar()}" update="@form"
									process="@form" icon="fa fa-save" styleClass="green-btn" />

								<p:commandButton icon="fa fa-trash" value="Excluir"
									style="width: auto; margin-left: 15px;"
									oncomplete="PF('confirmacaoExclusao').show();" process="@this"
									styleClass="red-btn"
									update=":form-cadastro:confirmacaoExclusaoDialog"
									rendered="#{cadastroPerfilBean.editando}" />

								<p:button value="Cancelar" icon="fa fa-remove"
									outcome="/perfil/pesquisa-perfil?faces-redirect=true"
									style="width: auto; margin-left: 15px;" />
							</div>
						</div>
					</div>
				</div>
			</div>

			<p:confirmDialog header="Exclusão de Perfil"
				message="Tem certeza que deseja excluir o perfil #{cadastroPerfilBean.perfil.nome}"
				widgetVar="confirmacaoExclusao" id="confirmacaoExclusaoDialog">
				<p:button value="Não"
					onclick="PF('confirmacaoExclusao').hide(); return false;" />
				<p:commandButton value="Sim"
					action="#{cadastroPerfilBean.excluir()}"
					oncomplete="PF('confirmacaoExclusao').hide();" process="@this"
					update="@form" />
			</p:confirmDialog>
		</h:form>
	</ui:define>

</ui:composition>
