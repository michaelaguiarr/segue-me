<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="title">Cadastro Ficha de Inscrição</ui:define>

	<ui:define name="toolbar">
		<p:button outcome="/inscricao/pesquisa-inscricao" value="Pesquisar"
			icon="fa fa-search" />
		<p:commandButton value="Ficha"
			action="#{relatorioInscritosFichasSingle.emitir()}" process="seguidorPanelGroup"
			icon="fa fa-file-text" ajax="false"
			rendered="#{cadastroFichaBean.insrito}" />
	</ui:define>

	<f:metadata>
		<o:viewParam name="inscricao" value="#{cadastroFichaBean.evento}" />
		<o:viewParam name="inscricao"
			value="#{relatorioInscritosFichasSingle.evento}" />
		<f:viewAction action="#{cadastroFichaBean.inicializar()}" />
	</f:metadata>

	<ui:define name="content">
		<h:form id="form-cadastro" enctype="multipart/form-data">
			<ui:include src="/WEB-INF/facelets/inscritos/inscritos-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>#{cadastroFichaBean.editando ? 'Edição Ficha' : 'Novo
							Ficha'}</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
						<p:focus for="proposta" />
						<div class="ui-g">
							<div class="ui-g-12">
								<!-- SEGUE-ME -->
								<p:fieldset legend="Segue-me">
									<div class="ui-g-6">
										<p:outputLabel value="Paroquia" for="paroquia" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Segue-Me" for="segueMe" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="paroquia"
											value="#{cadastroFichaBean.paroquia}" required="true"
											disabled="#{not seguranca.administradorGeral}">
											<f:selectItem itemLabel="Selecione a Paroquia" />
											<f:selectItems value="#{cadastroFichaBean.listaParoquia}"
												var="paroquia" itemValue="#{paroquia}"
												itemLabel="#{paroquia.descricao}" />
											<p:ajax listener="#{cadastroFichaBean.onSegueMeChange()}"
												update="segueMe" />
										</p:selectOneMenu>
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="segueMe" label="Segue-me" required="true"
											value="#{cadastroFichaBean.evento.segueMe}">
											<f:selectItem itemLabel="Selecione o Segue-Me" />
											<f:selectItems value="#{cadastroFichaBean.listaSegueMe}"
												var="segueMe" itemValue="#{segueMe}"
												itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
										</p:selectOneMenu>
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Proposta" for="proposta" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Situação" for="status" />
									</div>


									<div class="ui-g-6 ui-md-6 ui-lg-6">
										<p:inputText placeholder="Digite o Código" id="proposta"
											required="true" disabled="#{cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.inscricao.id}">
											<p:ajax listener="#{cadastroFichaBean.carregarFicha()}"
												event="change" update="@form" />
										</p:inputText>
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="status" label="Status" required="true"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.inscricao.statusInscricao}">
											<f:selectItem itemLabel="Selecione o Status" />
											<f:selectItems value="#{cadastroFichaBean.statusInscricao}"
												var="status" itemValue="#{status}"
												itemLabel="#{status.nome}" />
										</p:selectOneMenu>
									</div>
									<div class="ui-g-6">
										<p:outputLabel value="Data de Recebimento" for="dtRecebimento" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Data da Ficha " for="dtFicha" />
									</div>

									<div class="ui-g-6  ui-lg-6">
										<p:calendar id="dtRecebimento" navigator="true"
											required="true" disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.inscricao.dataInsccricao}"
											mask="true" pattern="dd/MM/yyyy" mode="popup" />
									</div>
									<div class="ui-g-6  ui-lg-6">
										<p:calendar id="dtFicha" navigator="true"
											value="#{cadastroFichaBean.evento.inscricao.dataGerarDoc.time}"
											mask="true" pattern="dd/MM/yyyy HH:mm" mode="popup"
											disabled="true" />
									</div>
								</p:fieldset>
							</div>
							<div class="ui-g-12">
								<!-- Seguidor -->
								<p:fieldset legend="Dados Pessoais">
									<div class="ui-g-8">
										<p:outputLabel value="Nome" for="nome" />
									</div>

									<div class="ui-g-4">
										<p:outputLabel value="Apelido" for="apelido" />
									</div>
									<div class="ui-g-8 ui-lg-8">
										<p:inputText id="nome" required="true"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.nome}" />
									</div>

									<div class="ui-g-4 ui-lg-4">
										<p:inputText id="apelido"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.apelido}" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Data de Nascimento" for="nascimento" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Sexo" for="sexo" />
									</div>

									<div class="ui-g-6  ui-lg-6">
										<p:calendar id="nascimento" navigator="true" required="true"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.dataNascimento}"
											mask="true" pattern="dd/MM/yyyy" mode="popup" />
									</div>

									<div class="ui-g-6  ui-lg-6">
										<p:selectOneMenu id="sexo" label="Sexo" required="true"
											disabled="#{not cadastroFichaBean.editando}"
											converter="omnifaces.SelectItemsConverter"
											value="#{cadastroFichaBean.evento.seguidor.sexo}">
											<f:selectItem itemLabel="Sexo" noSelectionOption="true" />
											<f:selectItems value="#{cadastroFichaBean.listaSexo}"
												var="sexo" itemValue="#{sexo}" itemLabel="#{sexo.nome}" />
										</p:selectOneMenu>
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Telefone" for="celular" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Email" for="email" />
									</div>

									<div class="ui-g-6  ui-lg-6">
										<p:inputMask id="celular" placeholder="Telefone"
											required="true"
											requiredMessage="Telefone é campo obrigatório"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.telefoneUm}"
											mask="(99)999999999" />
									</div>

									<div class="ui-g-6 ui-md-6 ui-lg-6">
										<p:inputText placeholder="Email" id="email"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.email}" />
									</div>
									<div class="ui-g-6">
										<p:outputLabel value="Naturalidade" for="naturalidade" />
									</div>
									<div class="ui-g-6">
										<p:outputLabel value="Nacionalidade" for="nacionalidade" />
									</div>
									<div class="ui-g-6">
										<p:inputText placeholder="Boa Vista - RR, Manaus - AM...."
											id="naturalidade"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.naturalidade}" />
									</div>

									<div class="ui-g-6">
										<p:inputText placeholder="Brasil, Venezuela...."
											id="nacionalidade"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.nacionalidade}" />
									</div>
									<div class="ui-g-8">
										<p:outputLabel value="Filiação Pai" for="pai" />
									</div>
									<div class="ui-g-4">
										<p:outputLabel value="Telefone Pai" for="celularPai" />
									</div>
									<div class="ui-g-8 ui-lg-8">
										<p:inputText id="pai"
											disabled="#{not cadastroFichaBean.editando}"
											placeholder="Nome Completo Pai"
											value="#{cadastroFichaBean.evento.seguidor.filiacaoPai}" />
									</div>


									<div class="ui-g-4  ui-lg-4">
										<p:inputMask id="celularPai" placeholder="Telefone pai"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.telefonePai}"
											mask="(99)999999999" />
									</div>

									<div class="ui-g-8">
										<p:outputLabel value="Filiação Mãe" for="mae" />
									</div>

									<div class="ui-g-4">
										<p:outputLabel value="Telefone Mãe" for="celularMae" />
									</div>

									<div class="ui-g-8 ui-lg-8">
										<p:inputText id="mae"
											disabled="#{not cadastroFichaBean.editando}"
											placeholder="Nome Completo Mãe"
											value="#{cadastroFichaBean.evento.seguidor.filiacaoMae}" />
									</div>

									<div class="ui-g-4  ui-lg-4">
										<p:inputMask id="celularMae" placeholder="Telefone mãe"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.telefoneMae}"
											mask="(99)999999999" />
									</div>

									<div class="ui-g-12">
										<p:outputLabel value="Morar com os Pais" for="morar" />
									</div>
									<div class="ui-g-12 ">
										<p:selectBooleanButton id="morar"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.inscricao.moraComPais}"
											onLabel="Sim" offLabel="Não" onIcon="ui-icon-check"
											offIcon="ui-icon-close" style="width:60px" />
									</div>

								</p:fieldset>
							</div>
							<div class="ui-g-12">
								<!-- SEGUE-ME -->
								<p:fieldset legend="Endereço">
									<div class="ui-g-12">
										<p:outputLabel value="Endereço" for="endereco" />
									</div>
									<div class="ui-g-12 ui-lg-12">
										<p:inputText id="endereco" required="true"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.endereco.logradouro}" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Número" for="numero" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Bairro" for="bairro" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:inputText id="numero" required="true"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.endereco.numero}" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:inputText id="bairro" required="true"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.endereco.bairro}" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Cidade" for="cidade" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="UF" for="uf" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:inputText id="cidade" required="true"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.endereco.cidade}" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="uf" label="UF" required="true"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.endereco.estado}">
											<f:selectItem itemLabel="Selecione" />
											<f:selectItems value="#{cadastroFichaBean.estados}"
												var="estado" itemValue="#{estado.sigla}"
												itemLabel="#{estado.sigla}" />
										</p:selectOneMenu>
									</div>
								</p:fieldset>
							</div>
							<div class="ui-g-12">
								<!-- SEGUE-ME -->
								<p:fieldset legend="Escolaridade">

									<div class="ui-g-6">
										<p:outputLabel value="Escolaridade" for="escolaridade" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Situação" for="situacaoEscola" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:inputText id="escolaridade"
											placeholder="Superior, Ensino Medio..."
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.inscricao.escolaridade}" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:inputText id="situacaoEscola"
											placeholder="Completo, Incompleto, cursando..."
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.situacaoEscolaridade}" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Curso" for="curso" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Instituição" for="instituicao" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:inputText id="curso" placeholder="Qual seu curso?"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.inscricao.curso}" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:inputText id="instituicao"
											placeholder="Nome Escola, faculdade..."
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.instituicao}" />
									</div>

								</p:fieldset>
							</div>
							<div class="ui-g-12">
								<!-- SEGUE-ME -->
								<p:fieldset legend="Participação">
									<div class="ui-g-6">
										<p:outputLabel value="Religião" for="religiao" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Igreja que frequenta" for="igreja" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:inputText id="religiao"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.inscricao.religiao}" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:inputText id="igreja"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.inscricao.igreja}" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Sagramentos" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel
											value="Participa(ou) de algum movimento na igreja? Qual(is)" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectBooleanCheckbox
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.inscricao.sagramentoBatismo}" />
										<p:outputLabel value=" Batismos " />
										<p:selectBooleanCheckbox
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.inscricao.sagramentoEucaristia}" />
										<p:outputLabel value=" Eucaristia " />
										<p:selectBooleanCheckbox
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.inscricao.sagramentoCrisma}" />
										<p:outputLabel value=" Crisma " />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:inputText id="movimentos"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.inscricao.movimentos}" />
									</div>
								</p:fieldset>
							</div>
							<div class="ui-g-12">
								<!-- SEGUE-ME -->
								<p:fieldset
									legend="Quem Convidou você para participar do encontro?">

									<div class="ui-g-6">
										<p:outputLabel value="Nome" for="nomeConvidou" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Telefone" for="telefoneConvidou" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:inputText id="nomeConvidou"
											disabled="#{not cadastroFichaBean.editando}"
											placeholder="Nome completo de quem convidou"
											value="#{cadastroFichaBean.evento.inscricao.nomeConvidou}" />
									</div>

									<div class="ui-g-6  ui-lg-6">
										<p:inputMask id="telefoneConvidou" placeholder="Telefone"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.inscricao.telefoneConvidou}"
											mask="(99)999999999" />
									</div>
								</p:fieldset>

							</div>
							<div class="ui-g-12">
								<!-- SEGUE-ME -->
								<p:fieldset legend="Rede Sociais">

									<div class="ui-g-6">
										<p:outputLabel value="Facebook" for="facebook" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Instagram" for="instagram" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:inputText id="facebook" placeholder="Facebook"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.redeSocialFacebook}" />
									</div>

									<div class="ui-g-6  ui-lg-6">
										<p:inputText id="instagram" placeholder="Instagram"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.redeSocialInstagram}" />
									</div>

									<div class="ui-g-12">
										<p:outputLabel value="Twitter" for="twitter" />
									</div>

									<div class="ui-g-12 ui-lg-6">
										<p:inputText id="twitter" placeholder="Twitter"
											disabled="#{not cadastroFichaBean.editando}"
											value="#{cadastroFichaBean.evento.seguidor.redeSocialTwitter}" />
									</div>
								</p:fieldset>
							</div>
							<div class="ui-g-12">
								<p:outputLabel value="Oberservação que jugar conviniente"
									for="obs" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:inputTextarea rows="6" cols="33" id="obs"
									disabled="#{not cadastroFichaBean.editando}"
									value="#{cadastroFichaBean.evento.inscricao.informacaoExtras}" />
							</div>

							<div class="save ui-g-12">
								<p:commandButton id="salvar" value="Salvar" style="width: auto;"
									action="#{cadastroFichaBean.salvar()}" update="@form"
									process="@form" icon="fa fa-save" styleClass="green-btn" />

								<p:button value="Cancelar"
									style="width: auto; margin-left: 15px;"
									outcome="pesquisa-inscricao" icon="fa fa-remove" />
							</div>
						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>

</ui:composition>
