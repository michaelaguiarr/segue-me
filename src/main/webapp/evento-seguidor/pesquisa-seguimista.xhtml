<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	template="/WEB-INF/template.xhtml">

	<ui:define name="title">Pesquisa Seguimista</ui:define>

	<f:metadata>
		<f:viewAction action="#{pesquisaEventoSeguimistaBean.inicializar()}" />
	</f:metadata>

	<ui:define name="search">
		<div class="ui-fluid">
			<div class="ui-g-12">
				<div class="card card-w-title">
					<h1>Pesquisa Seguimista</h1>
					<div class="ui-g">
						<div class="ui-g-12 ui-lg-6">
							<p:selectOneMenu id="Paroquia"
								value="#{pesquisaEventoSeguimistaBean.filter.paroquia}"
								disabled="#{not seguranca.administradorGeral}">
								<f:selectItem itemLabel="Todos as Paroquias" />
								<f:selectItems
									value="#{pesquisaEventoSeguimistaBean.listaParoquia}"
									var="paroquia" itemValue="#{paroquia}"
									itemLabel="#{paroquia.descricao}" />
								<p:ajax
									listener="#{pesquisaEventoSeguimistaBean.onSegueMeChange()}"
									update="segueMe" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:selectOneMenu id="segueMe" label="Segue-Me"
								value="#{pesquisaEventoSeguimistaBean.filter.segueMe}"
								disabled="#{not seguranca.administrador}">
								<f:selectItem itemLabel="Todos os Segue-Me"
									noSelectionOption="true" />
								<f:selectItems
									value="#{pesquisaEventoSeguimistaBean.listaSegueMe}"
									var="segueMe" itemValue="#{segueMe}"
									itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
								<p:ajax
									listener="#{pesquisaEventoSeguimistaBean.onCirculoChange()}"
									update="circulo" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:selectOneMenu id="circulo"
								value="#{pesquisaEventoSeguimistaBean.filter.circulo}">
								<f:selectItem itemLabel="Todos as Circulo" />
								<f:selectItems
									value="#{pesquisaEventoSeguimistaBean.listaCirculo}"
									var="circulo" itemValue="#{circulo}"
									itemLabel="#{circulo.corCirculo}" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:outputLabel/>
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:inputText id="nome" placeholder="Nome do Seguidor"
								autocomplete="off"
								value="#{pesquisaEventoSeguimistaBean.filter.nome}" />
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:inputText id="apelido" placeholder="Apelido"
								autocomplete="off"
								value="#{pesquisaEventoSeguimistaBean.filter.apelido}" />
						</div>
						<div class="ui-g-12">
							<p:commandButton id="pesquisar" value="Pesquisar"
								style="width: auto;"
								action="#{pesquisaEventoSeguimistaBean.pesquisar()}"
								update="@form" process="@form" icon="fa fa-search"
								styleClass="green-btn" />
							<p:defaultCommand target="pesquisar" />
						</div>
					</div>
				</div>
			</div>
		</div>
	</ui:define>

	<ui:define name="content">

		<h:form id="form">
			<ui:include src="/WEB-INF/facelets/seguidor/seguimista-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>Lista de Seguimistas</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />

						<div class="ui-g">

							<p:dataTable var="seguidor" id="datatable-seguidor"
								value="#{pesquisaEventoSeguimistaBean.listaEventoSeguidor}"
								reflow="true" selectionMode="single"
								selection="#{pesquisaEventoSeguimistaBean.evento}"
								rowKey="#{seguidor}" emptyMessage="Seguimista não encontrado!"
								paginator="true"
								sortBy="#{seguidor.seguidor.circulo.corCirculo}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
								currentPageReportTemplate=" Exibindo de {startRecord} a {endRecord} no total de {totalRecords} - Página: {currentPage}/{totalPages} "
								rows="15" rowsPerPageTemplate="15, 30, 60">

								<p:ajax event="rowSelect"
									listener="#{pesquisaEventoSeguimistaBean.selecionar()}" />

								<p:column headerText="Nome" sortBy="#{seguidor.seguidor.nome}"
									width="200">
									<h:outputText value="#{seguidor.seguidor.nome}" />
									<span class="borda"><h:outputText styleClass="idade"
											value="#{seguidor.idade}" /></span>
									<i class="#{seguidor.seguidor.iconeParaSexo} Fright MarRight10" />
								</p:column>
								
								<p:column headerText="Data Nascimento"
									sortBy="#{seguidor.seguidor.dataNascimento}" width="100">
									<h:outputText value="#{seguidor.seguidor.dataNascimento}" >
									<f:convertDateTime pattern="dd/MM/yyyy"/>
									</h:outputText>
								</p:column>

								<p:column headerText="Telefone"
									sortBy="#{seguidor.seguidor.telefoneUm}" width="100">
									<h:outputText value="#{seguidor.seguidor.telefoneUm}" />
								</p:column>

								<p:column headerText="Círculo"
									sortBy="#{seguidor.seguidor.circulo.corCirculo.descricao}"
									width="30">
									<span
										class="situacao #{seguidor.seguidor.circulo.corCirculo.coresParaStyle}">#{seguidor.seguidor.circulo.corCirculo.descricao}</span>
								</p:column>

								<p:column headerText="Paroquia"
									sortBy="#{seguidor.segueMe.paroquia.descricao}"
									rendered="#{seguranca.administradorGeral}" width="200">
									<h:outputText value="#{seguidor.segueMe.paroquia.descricao}" />
								</p:column>

								<p:column headerText="Segue-me"
									sortBy="#{seguidor.segueMe.numeroRomano.numeroRomano}"
									rendered="#{seguranca.administrador}" width="50">
									<h:outputText
										value="#{seguidor.segueMe.numeroRomano.numeroRomano}" />
								</p:column>

								<p:column headerText="Crachá Impresso?"
									sortBy="#{seguidor.cracha}" width="50">
									<h:outputText value="#{seguidor.cracha ? 'Não' : 'Sim'}" />
								</p:column>
							</p:dataTable>
							<p:dialog
								header="#{pesquisaEventoSeguidorBean.evento.seguidor.nome}"
								id="fotoDialog" widgetVar="fotoDialogWidgetVar">
								<p:graphicImage
									value="#{pesquisaEventoSeguidorBean.evento.seguidor.carregarImagem()}"
									style="max-width: 300px" id="produtoFoto" />
							</p:dialog>
						</div>
					</div>
				</div>
			</div>
		</h:form>

	</ui:define>

</ui:composition>
