<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="title">Crachá Seguidor -  Segue-me</ui:define>

	<f:metadata>
		<f:viewAction action="#{relatorioCrachaSeguidor.inicializar()}" />
	</f:metadata>

	<ui:define name="content">
		<h:form id="form-cadastro">
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>Crachá Seguidor - Segue-me</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
						<div class="ui-g">
							<div class="ui-g-12">
								<p:outputLabel value="Paroquia" for="paroquia" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:selectOneMenu id="paroquia"
									value="#{relatorioCrachaSeguidor.paroquia}" required="true"
									disabled="#{not seguranca.administradorGeral}">
									<f:selectItem itemLabel="Selecione a Paroquia" />
									<f:selectItems value="#{relatorioCrachaSeguidor.listaParoquia}"
										var="paroquia" itemValue="#{paroquia}"
										itemLabel="#{paroquia.descricao}" />
									<p:ajax listener="#{relatorioCrachaSeguidor.onSegueMeChange()}"
										update="segueMe" />
								</p:selectOneMenu>
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Segue-Me" for="segueMe" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:selectOneMenu id="segueMe" label="Segue-me" required="true"
									value="#{relatorioCrachaSeguidor.segueMe}">
									<f:selectItem itemLabel="Selecione o Segue-Me" />
									<f:selectItems value="#{relatorioCrachaSeguidor.listaSegueMe}"
										var="segueMe" itemValue="#{segueMe}"
										itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
								</p:selectOneMenu>
							</div>

							<div class="save ui-g-12">
								<p:commandButton value="Gerar PDF" style="width: auto;"
									action="#{relatorioCrachaSeguidor.emitir()}" update="@form"
									process="@form" icon="fa fa-file-pdf-o"
									styleClass="green-btn topo" ajax="false" />
								<p:commandButton value="Marcar como impressos" type="button"
									style="width: auto;" icon="fa fa-check" styleClass="topo"
									onclick="PF('confMarcarImpressos').show();" />
							</div>

							<p:confirmDialog widgetVar="confMarcarImpressos"
								header="Marcar crachás como impressos"
								message="Confirma que a impressão saiu corretamente? Os crachás pendentes deste Segue-Me serão marcados como impressos.">
								<p:commandButton value="Sim" icon="fa fa-check"
									action="#{relatorioCrachaSeguidor.marcarComoImpressos()}"
									process="@form" update="@form"
									oncomplete="PF('confMarcarImpressos').hide();" />
								<p:commandButton value="Não" type="button" icon="fa fa-close"
									onclick="PF('confMarcarImpressos').hide();" />
							</p:confirmDialog>

						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>

</ui:composition>
