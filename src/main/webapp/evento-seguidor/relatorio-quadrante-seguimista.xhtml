<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="title">Quadrante Seguimista por Circulo -  Segue-me</ui:define>

	<f:metadata>
		<f:viewAction action="#{relatorioQuadranteSeguimista.inicializar()}" />
	</f:metadata>

	<ui:define name="content">
		<h:form id="form-cadastro">
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>Quadrante Seguimista por Circulo - Segue-me</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
						<div class="ui-g">
							<div class="ui-g-12">
								<p:outputLabel value="Paroquia" for="paroquia" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:selectOneMenu id="paroquia"
									value="#{relatorioQuadranteSeguimista.paroquia}"
									required="true" disabled="#{not seguranca.administradorGeral}">
									<f:selectItem itemLabel="Selecione a Paroquia" />
									<f:selectItems
										value="#{relatorioQuadranteSeguimista.listaParoquia}"
										var="paroquia" itemValue="#{paroquia}"
										itemLabel="#{paroquia.descricao}" />
									<p:ajax
										listener="#{relatorioQuadranteSeguimista.onSegueMeChange()}"
										update="segueMe" />
								</p:selectOneMenu>
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Segue-Me" for="segueMe" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:selectOneMenu id="segueMe" label="Segue-me" required="true"
									value="#{relatorioQuadranteSeguimista.segueMe}">
									<f:selectItem itemLabel="Selecione o Segue-Me" />
									<f:selectItems
										value="#{relatorioQuadranteSeguimista.listaSegueMe}"
										var="segueMe" itemValue="#{segueMe}"
										itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
									<p:ajax
										listener="#{relatorioQuadranteSeguimista.onCirculoChange()}"
										update="circulo" />
								</p:selectOneMenu>
							</div>


							<div class="ui-g-12">
								<p:outputLabel value="Circulo" for="circulo" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:selectOneMenu id="circulo"
									value="#{relatorioQuadranteSeguimista.circulo}">
									<f:selectItem itemLabel="Circulo" />
									<f:selectItems
										value="#{relatorioQuadranteSeguimista.listaCirculo}"
										var="circulo" itemValue="#{circulo}"
										itemLabel="#{circulo.corCirculo}" />
								</p:selectOneMenu>
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Número Pagina Inicial" for="pagina" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:inputText id="pagina"
									value="#{relatorioQuadranteSeguimista.pagina}"
									placeholder="Número que inicia a paginação" maxlength="2" />
							</div>
							<div class="ui-g-12">
								<p:outputLabel value="Com Layout?" for="layout" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:selectBooleanButton id="layout"
									value="#{relatorioQuadranteSeguimista.layout}" onLabel="Sim"
									offLabel="Não" onIcon="ui-icon-check" offIcon="ui-icon-close"
									style="width:60px" />
							</div>
							<div class="save ui-g-12">
								<p:commandButton value="Gerar" style="width: auto;"
									action="#{relatorioQuadranteSeguimista.emitir()}"
									update="@form" process="@form" icon="fa fa-save"
									styleClass="green-btn topo" ajax="false" />
							</div>

						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>

</ui:composition>
