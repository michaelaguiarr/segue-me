<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	template="/WEB-INF/template.xhtml">

	<ui:define name="title">Pesquisa Palestra Seguidor no Segue-me</ui:define>

	<f:metadata>
		<f:viewAction action="#{pesquisaPalestraSeguidorBean.inicializar()}" />
	</f:metadata>

	<ui:define name="search">
		<div class="ui-fluid">
			<div class="ui-g-12">
				<div class="card card-w-title">
					<h1>Pesquisa Palestra Seguidor no Segue-me</h1>
					<div class="ui-g">
						<div class="ui-g-12 ui-lg-6">
							<p:selectOneMenu id="Paroquia"
								value="#{pesquisaPalestraSeguidorBean.filter.paroquia}"
								disabled="#{not seguranca.administradorGeral}">
								<f:selectItem itemLabel="Todos as Paroquias" />
								<f:selectItems
									value="#{pesquisaPalestraSeguidorBean.listaParoquia}"
									var="paroquia" itemValue="#{paroquia}"
									itemLabel="#{paroquia.descricao}" />
								<p:ajax
									listener="#{pesquisaPalestraSeguidorBean.onSegueMeChange()}"
									update="segueMe" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:selectOneMenu id="segueMe" label="Segue-Me"
								value="#{pesquisaPalestraSeguidorBean.filter.segueMe}"
								disabled="#{not seguranca.administrador}">
								<f:selectItem itemLabel="Todos os Segue-Me"
									noSelectionOption="true" />
								<f:selectItems
									value="#{pesquisaPalestraSeguidorBean.listaSegueMe}"
									var="segueMe" itemValue="#{segueMe}"
									itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12">
							<p:selectOneMenu id="palestra"
								value="#{pesquisaPalestraSeguidorBean.filter.palestra}"
								disabled="#{not seguranca.graficaAndComandante}">
								<f:selectItem itemLabel="Todos as Palestras" />
								<f:selectItems
									value="#{pesquisaPalestraSeguidorBean.listaPalestras}"
									var="palestra" itemValue="#{palestra}"
									itemLabel="#{palestra.nome}" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:inputText id="nome" placeholder="Nome do Seguidor"
								autocomplete="off"
								value="#{pesquisaPalestraSeguidorBean.filter.nome}" />
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:inputText id="apelido" placeholder="Apelido"
								autocomplete="off"
								value="#{pesquisaPalestraSeguidorBean.filter.apelido}" />
						</div>
						<div class="ui-g-12">
							<p:commandButton id="pesquisar" value="Pesquisar"
								style="width: auto;"
								action="#{pesquisaPalestraSeguidorBean.pesquisar()}"
								update="@form" process="@form" icon="fa fa-search"
								styleClass="green-btn" />
							<p:defaultCommand target="pesquisar" />
						</div>
					</div>
				</div>
			</div>
		</div>
	</ui:define>

	<ui:define name="content">

		<h:form id="form">
			<ui:include
				src="/WEB-INF/facelets/evento-seguidor/palestra-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>Lista de Seguidor no Segue-me</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />

						<div class="ui-g">


							<p:dataTable var="seguidor" id="datatable-seguidor"
								value="#{pesquisaPalestraSeguidorBean.listaEventoSeguidor}"
								reflow="true" selectionMode="single"
								selection="#{pesquisaPalestraSeguidorBean.evento}"
								rowKey="#{seguidor}" emptyMessage="Seguidor não encontrado!"
								paginator="true" sortBy="#{seguidor.equipe.ordem}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
								currentPageReportTemplate=" Exibindo de {startRecord} a {endRecord} no total de {totalRecords} - Página: {currentPage}/{totalPages} "
								rows="25" rowsPerPageTemplate="25,50,100,150,200">

								<p:ajax event="rowSelect"
									listener="#{pesquisaPalestraSeguidorBean.selecionar()}" />

								<p:headerRow>
									<p:column colspan="2">
										<h:outputText value="#{seguidor.equipe.titulo}" />
									</p:column>
								</p:headerRow>

								<p:column headerText="Nome" sortBy="#{seguidor.seguidor.nome}"
									width="200">
									<h:outputText value="#{seguidor.seguidor.nome}" />
									<span class="borda"><h:outputText styleClass="idade"
											value="#{seguidor.idade}" /></span>
									<i class="#{seguidor.seguidor.iconeParaSexo} Fright MarRight10" />
								</p:column>

								<p:column headerText="Telefone"
									sortBy="#{seguidor.seguidor.telefoneUm}" width="100">
									<h:outputText value="#{seguidor.seguidor.telefoneUm}" />
								</p:column>

								<p:column headerText="Palestra" sortBy="#{seguidor.palestra.ordem}"
									width="100">
									<h:outputText value="#{seguidor.palestra.nome}" />
								</p:column>

								<p:column headerText="Situação" width="50"
									sortBy="#{seguidor.statusConvite.nome}">
									<span class="situacao #{seguidor.statusConvite.coresParaStyle}">#{seguidor.statusConvite.nome}</span>
								</p:column>

								<p:column headerText="Paroquia"
									sortBy="#{seguidor.segueMe.paroquia.descricao}"
									rendered="#{seguranca.administradorGeral}" width="200">
									<h:outputText value="#{seguidor.segueMe.paroquia.descricao}" />
								</p:column>

								<p:column headerText="Segue-me"
									sortBy="#{seguidor.segueMe.numeroRomano.numeroRomano}"
									rendered="#{seguranca.administrador}" width="50">
									<h:outputText
										value="#{seguidor.segueMe.numeroRomano.numeroRomano}" />
								</p:column>

								<p:column headerText="Crachá Impresso?"
									sortBy="#{seguidor.cracha}" width="50">
									<h:outputText value="#{seguidor.cracha ? 'Não' : 'Sim'}" />
								</p:column>
							</p:dataTable>
							<p:dialog
								header="#{pesquisaPalestraSeguidorBean.evento.seguidor.nome}"
								id="fotoDialog" widgetVar="fotoDialogWidgetVar">
								<p:graphicImage
									value="#{pesquisaPalestraSeguidorBean.evento.seguidor.carregarImagem()}"
									style="max-width: 300px" id="produtoFoto" />
							</p:dialog>
						</div>
					</div>
				</div>
			</div>
		</h:form>

	</ui:define>

</ui:composition>
