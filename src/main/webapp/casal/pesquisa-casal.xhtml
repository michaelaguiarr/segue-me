<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	template="/WEB-INF/template.xhtml">

	<ui:define name="title">Pesquisa Casal</ui:define>

	<f:metadata>
		<f:viewAction action="#{pesquisaCasalBean.inicializar()}" />
	</f:metadata>

	<ui:define name="search">
		<div class="ui-fluid">
			<div class="ui-g-12">
				<div class="card card-w-title">
					<h1>Pesquisa Casal</h1>
					<div class="ui-g">
						<div class="ui-g-12 ui-lg-12">
							<p:selectOneMenu id="Paroquia"
								value="#{pesquisaCasalBean.filter.paroquia}">
								<f:selectItem itemLabel="Todos as Paroquias" />
								<f:selectItems value="#{pesquisaCasalBean.listaParoquia}"
									var="paroquia" itemValue="#{paroquia}"
									itemLabel="#{paroquia.descricao}" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:inputText id="nomeEle" placeholder="Nome Ele"
								autocomplete="off" value="#{pesquisaCasalBean.filter.nomeEle}" />
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:inputText id="apelidoEle" placeholder="Apelido Ele"
								autocomplete="off"
								value="#{pesquisaCasalBean.filter.apelidoEle}" />
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:inputText id="nomeEla" placeholder="Nome Ela"
								autocomplete="off" value="#{pesquisaCasalBean.filter.nomeEla}" />
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:inputText id="apelidoElq" placeholder="Apelido Ela"
								autocomplete="off"
								value="#{pesquisaCasalBean.filter.apelidoEla}" />
						</div>
						<div class="ui-g-12">
							<p:commandButton id="pesquisar" value="Pesquisar"
								style="width: auto;" action="#{pesquisaCasalBean.pesquisar()}"
								update="@form" process="@form" icon="fa fa-search"
								styleClass="green-btn" />
							<p:commandButton id="atulizar" value="Atulizar"
								style="width: auto;"
								action="#{pesquisaCasalBean.atulizarNome()}" update="@form"
								process="@form"   rendered="#{seguranca.developer}" />
							<p:defaultCommand target="pesquisar" />
						</div>
					</div>
				</div>
			</div>
		</div>
	</ui:define>

	<ui:define name="content">

		<h:form id="form">
			<ui:include src="/WEB-INF/facelets/casal/casal-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>Lista de Casais</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />

						<div class="ui-g">

							<p:dataTable var="casal" id="datatable-casal"
								value="#{pesquisaCasalBean.lista}" reflow="true"
								selectionMode="single" selection="#{pesquisaCasalBean.casal}"
								rowKey="#{casal}" emptyMessage="Casal não encontrado!"
								paginator="true"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
								currentPageReportTemplate=" Exibindo de {startRecord} a {endRecord} no total de {totalRecords} - Página: {currentPage}/{totalPages} "
								rows="25">

								<p:ajax event="rowSelect"
									listener="#{pesquisaCasalBean.selecionar()}" />

								<p:column width="50">
									<p:commandButton update=":form:fotoDialogEle"
										style="width: auto;" process="@this"
										action="#{pesquisaCasalBean.carregarFoto(casal.id)}"
										oncomplete="PF('fotoDialogWidgetVarEle').show()"
										icon="fa fa-picture-o" />
								</p:column>
								<p:column headerText="Data Cadastro"
									sortBy="#{casal.timestamp.time}" width="100">
									<h:outputText value="#{casal.timestamp.time}">
										<f:convertDateTime pattern="dd/MM/yyyy" />
									</h:outputText>
								</p:column>
								<p:column headerText="Nome Ele" sortBy="#{casal.nomeEle}"
									width="200">
									<h:outputText value="#{casal.nomeEle} - (#{casal.apelidoEle})" />
								</p:column>

								<p:column headerText="Nome Ela" sortBy="#{casal.nomeEla}"
									width="200">
									<h:outputText value="#{casal.nomeEla} - (#{casal.apelidoEla})" />
								</p:column>

								<p:column headerText="Telefone Ele"
									sortBy="#{casal.telefoneEleUm}" width="100">
									<h:outputText value="#{casal.telefoneEleUm}" />
								</p:column>
								<p:column headerText="Telefone Ela"
									sortBy="#{casal.telefoneElaUm}" width="100">
									<h:outputText value="#{casal.telefoneElaUm}" />
								</p:column>

								<p:column headerText="Paroquia"
									sortBy="#{casal.paroquia.descricao}" width="150">
									<h:outputText value="#{casal.paroquia.descricao}" />
								</p:column>
							</p:dataTable>
							<p:dialog header="#{pesquisaCasalBean.casal.nomeEle}"
								id="fotoDialogEle" widgetVar="fotoDialogWidgetVarEle">
								<p:graphicImage
									value="#{pesquisaCasalBean.casal.carregarImagemEle()}"
									style="max-width: 300px" id="fotoEle" />
							</p:dialog>
							<p:dialog header="#{pesquisaCasalBean.casal.nomeEla}"
								id="fotoDialogEla" widgetVar="fotoDialogWidgetVarEla">
								<p:graphicImage
									value="#{pesquisaCasalBean.casal.carregarImagemEla()}"
									style="max-width: 300px" id="fotoEla" />
							</p:dialog>
						</div>
					</div>
				</div>
			</div>
		</h:form>

	</ui:define>

</ui:composition>
