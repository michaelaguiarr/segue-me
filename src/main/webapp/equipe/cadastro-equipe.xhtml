<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="title">Cadastro Equipe</ui:define>

	<ui:define name="search">
		<p:button outcome="/equipe/pesquisa-equipe" value="Pesquisar"
			icon="fa fa-search" />
	</ui:define>

	<f:metadata>
		<o:viewParam name="equipe" value="#{cadastroEquipeBean.equipe}" />
		<f:viewAction action="#{cadastroEquipeBean.inicializar()}" />
	</f:metadata>

	<ui:define name="content">
		<h:form id="form-cadastro">
			<ui:include src="/WEB-INF/facelets/equipe/equipe-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>#{cadastroEquipeBean.editando ? 'Edição Equipe' : 'Nova
							Equipe'}</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
						<p:focus for="titulo" />

						<div class="ui-g">
							<div class="ui-g-12">
								<p:outputLabel value="Título" for="titulo" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:inputText id="titulo"
									value="#{cadastroEquipeBean.equipe.titulo}" />
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Ordem" for="ordem" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:spinner id="ordem" value="#{cadastroEquipeBean.equipe.ordem}"
									min="1" max="20" />
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Número de Pessoas" for="pessoas" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:inputText id="pessoas"
									value="#{cadastroEquipeBean.equipe.pessoas}" maxlength="4" size="8" />
							</div>
							
							
							<div class="ui-g-12">
								<p:outputLabel value="Situação" for="situacao" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:selectBooleanButton id="situacao"
									value="#{cadastroEquipeBean.equipe.ativo}" onLabel="Ativo"
									offLabel="Inativo" onIcon="ui-icon-check" offIcon="ui-icon-close"
									style="width:60px" />
							</div>


							<div class="ui-g-12">
								<p:outputLabel value="Observação" for="obs" />
							</div>
							<div class="ui-g-12 ui-lg-6">
								<p:inputTextarea id="obs" value="#{cadastroEquipeBean.equipe.obs}" rows="6" cols="33" />
							</div>
							
							<div class="ui-g-12">
								<p:outputLabel value="Imagem" />
							</div>
							<div class="ui-g-12 ui-lg-6">
								<h:panelGrid id="fotoPanelGroupUpload">
									<p:fileUpload
										fileUploadListener="#{cadastroEquipeBean.upload}"
										allowTypes="/(\.|\/)(jpe?g)$/"
										invalidFileMessage="São permitidas somente imagens (jpg)"
										auto="true" label="Foto"
										update="fotoPanelGroup fotoPanelGroupUpload"
										rendered="#{cadastroEquipeBean.imagem == null}" />
								</h:panelGrid>
							</div>

							<div class="ui-g-12">
								<h:panelGrid id="fotoPanelGroup">
									<p:graphicImage value="#{cadastroEquipeBean.imagem}"
										rendered="#{cadastroEquipeBean.imagem ne null}" width="200px"
										id="foto" />
									<p:commandButton value="Remover Foto"
										style="width: auto; margin-left: 15px;"
										actionListener="#{cadastroEquipeBean.removerFoto}"
										rendered="#{cadastroEquipeBean.imagem ne null}"
										process="@this" update="fotoPanelGroup, fotoPanelGroupUpload" />
								</h:panelGrid>
							</div>

							<div class="save ui-g-12">
								<p:commandButton value="Salvar" style="width: auto;"
									action="#{cadastroEquipeBean.salvar()}" update="@form"
									process="@form" icon="fa fa-save" styleClass="green-btn" />


<!-- 								<p:commandButton icon="fa fa-trash" value="Excluir" -->
<!-- 									style="width: auto; margin-left: 15px;" -->
<!-- 									oncomplete="PF('confirmacaoExclusao').show();" process="@this" -->
<!-- 									styleClass="red-btn" -->
<!-- 									update=":form-cadastro:confirmacaoExclusaoDialog" -->
<!-- 									rendered="#{cadastroEquipeBean.editando}" /> -->

								<p:button value="Cancelar"
									style="width: auto; margin-left: 15px;"
									outcome="pesquisa-equipe" icon="fa fa-remove" />
							</div>

						</div>
					</div>
				</div>
			</div>
			<p:confirmDialog header="Exclusão da Equipe"
				message="Tem certeza que deseja excluir a Equipe #{cadastroEquipeBean.equipe.titulo}"
				widgetVar="confirmacaoExclusao" id="confirmacaoExclusaoDialog">
				<p:button value="Não"
					onclick="PF('confirmacaoExclusao').hide(); return false;" />
				<p:commandButton value="Sim"
					action="#{cadastroEquipeBean.excluir()}"
					oncomplete="PF('confirmacaoExclusao').hide();" process="@this"
					update="@form" />
			</p:confirmDialog>
		</h:form>
	</ui:define>

</ui:composition>
