<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui">

	<h:panelGroup id="eccPanelGroup">
		<div class="ui-fluid">
			<div class="ui-g-12">
				<p:messages id="eccMessages" autoUpdate="false" />
				<div class="ui-g-12">
					<p:outputLabel value="TítuloECC" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:outputLabel value="#{cadastroCasalBean.ecc.titulo}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Edição" for="edicaoECC" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:selectOneMenu id="edicaoECC"
						value="#{cadastroCasalBean.ecc.numeroRomano}" required="true">
						<f:selectItem itemLabel="Selecione o Número da Edição" />
						<f:selectItems value="#{cadastroCasalBean.numeroRomanosFiltro}"
							var="numero" itemValue="#{numero}"
							itemLabel="#{numero.numero} - #{numero.numeroRomano}" />
					</p:selectOneMenu>
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Paróquia" for="paroquiaEcc" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:selectOneMenu id="paroquiaEcc"
						value="#{cadastroCasalBean.ecc.paroquia}" required="true">
						<f:selectItem itemLabel="Selecione a Paróquia" />
						<f:selectItems value="#{cadastroCasalBean.listaParoquiaEcc}"
							var="paroquias" itemValue="#{paroquias}"
							itemLabel="#{paroquias.descricao}" />
					</p:selectOneMenu>
				</div>
				<div class="save ui-g-12">

					<p:commandButton value="Salvar" style="width: auto;"
						styleClass="green-btn topo" icon="fa fa-save"
						action="#{cadastroCasalBean.salvarEcc()}"
						ignoreAutoUpdate="true" process="eccPanelGroup"
						update="eccPanelGroup ecc eccMessages"
						oncomplete="if (!args.validationFailed) PF('novoEcc').hide()" />

					<p:button value="Cancelar" style="width: auto; margin-left: 15px;"
						onclick="PF('novoEcc').hide(); return false;"
						icon="fa fa-remove" />
				</div>

			</div>
		</div>
	</h:panelGroup>
</ui:composition>
