<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui">
	<h:panelGroup id="seguidorPanelGroup">
		<div class="ui-g-12">
			<!-- Casal -->
			<p:fieldset legend="Casal">
				<div class="ui-g-12">
					<p:outputLabel value="Foto Casal" />
				</div>
				<div class="ui-g-6 ui-lg-6">
					<h:panelGrid id="fotoPanelGroupEle">
						<p:graphicImage
							value="#{detalhesCasalBean.casal.carregarImagemEle()}"
							width="100px" height="200px" id="fotoEle"
							onclick="PF('fotoDialogWidgetVarEle').show()" cache="false" />
					</h:panelGrid>
				</div>
				<div class="ui-g-8">
					<p:outputLabel value="Nome Ele" for="nomeEle" />
				</div>
				<div class="ui-g-4">
					<p:outputLabel value="Apelido Ele" for="apelidoEle" />
				</div>

				<div class="ui-g-8 ui-lg-8">
					<p:outputLabel value="#{detalhesCasalBean.casal.nomeEle}"
						id="nomeEle" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-4 ui-lg-4">
					<p:outputLabel value="#{detalhesCasalBean.casal.apelidoEle}"
						id="apelidoEle" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Data de Nascimento Ele" for="nascimentoEle" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:outputLabel value="#{detalhesCasalBean.casal.dataNascimentoEle}"
						id="nascimentoEle" style="color: black;  font-weight: bold;">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</p:outputLabel>
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Email Ele" for="emailEle" />
				</div>

				<div class="ui-g-6 ui-lg-12">
					<p:outputLabel value="#{detalhesCasalBean.casal.emailEle}"
						id="emailEle" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="Telefone 1" for="telefoneUmEle" />
				</div>
				<div class="ui-g-6">
					<p:outputLabel value="Telefone 2" for="telefoneDoisEle" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel value="#{detalhesCasalBean.casal.telefoneEleUm}"
						id="telefoneUmEle" style="color: black;  font-weight: bold;" />
				</div>
				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel value="#{detalhesCasalBean.casal.telefoneEleDois}"
						id="telefoneDoisEle" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="Naturalidade Ele" for="naturalidadeEle" />
				</div>
				<div class="ui-g-6">
					<p:outputLabel value="Nacionalidade Ele" for="nacionalidadeEle" />
				</div>
				<div class="ui-g-6">
					<p:outputLabel value="#{detalhesCasalBean.casal.naturalidadeEle}"
						id="naturalidadeEle" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="#{detalhesCasalBean.casal.nacionalidadeEle}"
						id="nacionalidadeEle" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-8">
					<p:outputLabel value="Nome Ela" for="nomeEla" />
				</div>
				<div class="ui-g-4">
					<p:outputLabel value="Apelido Ela" for="apelidoEla" />
				</div>

				<div class="ui-g-8 ui-lg-8">
					<p:outputLabel value="#{detalhesCasalBean.casal.nomeEla}"
						id="nomeEla" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-4 ui-lg-4">
					<p:outputLabel value="#{detalhesCasalBean.casal.apelidoEla}"
						id="apelidoEla" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Data de Nascimento Ela" for="nascimentoEla" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:outputLabel value="#{detalhesCasalBean.casal.dataNascimentoEla}"
						id="nascimentoEla" style="color: black;  font-weight: bold;">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</p:outputLabel>
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Email Ela" for="emailEla" />
				</div>

				<div class="ui-g-6 ui-lg-12">
					<p:outputLabel value="#{detalhesCasalBean.casal.emailEla}"
						id="emailEla" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="Telefone 1" for="telefoneUmEla" />
				</div>
				<div class="ui-g-6">
					<p:outputLabel value="Telefone 2" for="telefoneDoisEla" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel value="#{detalhesCasalBean.casal.telefoneElaUm}"
						id="telefoneUmEla" style="color: black;  font-weight: bold;" />
				</div>
				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel value="#{detalhesCasalBean.casal.telefoneElaDois}"
						id="telefoneDoisEla" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="Naturalidade Ela" for="naturalidadeEla" />
				</div>
				<div class="ui-g-6">
					<p:outputLabel value="Nacionalidade Ela" for="nacionalidadeEla" />
				</div>
				<div class="ui-g-6">
					<p:outputLabel value="#{detalhesCasalBean.casal.naturalidadeEla}"
						id="naturalidadeEla" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="#{detalhesCasalBean.casal.nacionalidadeEla}"
						id="nacionalidadeEla" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Data de Casamento" for="casamento" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:outputLabel value="#{detalhesCasalBean.casal.dataCasamento}"
						id="casamento" style="color: black;  font-weight: bold;">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</p:outputLabel>
				</div>
			</p:fieldset>
		</div>
		<div class="ui-g-12">
			<!-- Endereco -->
			<p:fieldset legend="Endereço">
				<div class="ui-g-12">
					<p:outputLabel value="Endereço" for="endereco" />
				</div>
				<div class="ui-g-12 ui-lg-12">
					<p:outputLabel
						value="#{detalhesCasalBean.casal.endereco.logradouro}"
						id="endereco" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="Número" for="numero" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="Bairro" for="bairro" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel value="#{detalhesCasalBean.casal.endereco.numero}"
						id="numero" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel value="#{detalhesCasalBean.casal.endereco.bairro}"
						id="bairro" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="Cidade" for="cidade" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="UF" for="uf" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel value="#{detalhesCasalBean.casal.endereco.cidade}"
						id="cidade" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel value="#{detalhesCasalBean.casal.endereco.estado}"
						id="uf" style="color: black;  font-weight: bold;" />
				</div>
			</p:fieldset>
		</div>

		<div class="ui-g-12">
			<!-- SEGUE-ME -->
			<p:fieldset legend="Informação Extra">
				<div class="ui-g-6">
					<p:outputLabel value="Paróquia que frequenta"
						for="paroquiafrequenta" />
				</div>
				<div class="ui-g-6">
					<p:outputLabel value="Igreja que frequenta" for="igreja" />
				</div>
				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel
						value="#{detalhesCasalBean.casal.paroquia.descricao}"
						id="paroquiafrequenta" style="color: black;  font-weight: bold;" />
				</div>
				<div class="ui-g-6 ui-lg-">
					<p:outputLabel value="#{detalhesCasalBean.casal.igrejaFrequenta}"
						id="igreja" style="color: black;  font-weight: bold;" />
				</div>
			</p:fieldset>
		</div>

		<div class="ui-g-12">
			<!-- SEGUE-ME -->
			<p:fieldset legend="ECC">
				<div class="ui-g-12">
					<p:outputLabel value="Paróquia " for="paroquiaSeguidorNovo" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:outputLabel
						value="#{detalhesCasalBean.casal.ecc.paroquia.descricao}"
						id="paroquiaSeguidorNovo"
						style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Ecc" for="ecc" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:outputLabel
						value="#{detalhesCasalBean.casal.ecc.titulo} #{detalhesCasalBean.casal.ecc.numeroRomano.numeroRomano}"
						id="ecc"
						style="color: black;  font-weight: bold;" />
				</div>
			</p:fieldset>
		</div>
	</h:panelGroup>

	<p:dialog header="Foto Casal" id="fotoDialogEle"
		widgetVar="fotoDialogWidgetVarEle">
		<p:graphicImage value="#{detalhesCasalBean.casal.carregarImagemEle()}"
			style="max-width: 300px" id="imagemEle" />
	</p:dialog>
</ui:composition>
