<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui">
	<h:panelGroup id="casalPanelGroup">
		<p:focus for="nomeEle" />
		<div class="ui-g-12 ">
			<!-- Casal -->
			<p:fieldset legend="Casal">
				<div class="ui-g-12">
					<p:outputLabel value="Nome Ele" for="nomeEle" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText placeholder="Nome Completo Ele" id="nomeEle"
						required="true" value="#{cadastroCasalBean.casal.nomeEle}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Apelido Ele" for="apelidoEle" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText placeholder="Nome no Crachá Ele(JOAO DA MARIA)" id="apelidoEle"
						required="true" value="#{cadastroCasalBean.casal.apelidoEle}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Data de Nascimento Ele" for="nascimentoEle" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:calendar id="nascimentoEle" required="true"
						value="#{cadastroCasalBean.casal.dataNascimentoEle}" mask="true"
						pattern="dd/MM/yyyy" mode="popup" showButtonPanel="true"
						showOn="button" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Email Ele" for="emailEle" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText placeholder="Email" id="emailEle"
						value="#{cadastroCasalBean.casal.emailEle}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Telefone 1" for="telefoneUmEle" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputMask id="telefoneUmEle" placeholder="Telefone 1"
						required="true" value="#{cadastroCasalBean.casal.telefoneEleUm}"
						mask="(99)999999999">
					</p:inputMask>
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Telefone 2" for="telefoneDoisEle" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:inputMask id="telefoneDoisEle" placeholder="Telefone 2"
						value="#{cadastroCasalBean.casal.telefoneEleDois}"
						mask="(99)999999999">
					</p:inputMask>
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Naturalidade Ele" for="naturalidadeEle" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:inputText placeholder="Boa Vista - RR, Manaus - AM...."
						id="naturalidadeEle"
						value="#{cadastroCasalBean.casal.naturalidadeEle}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Nacionalidade Ele" for="nacionalidadeEle" />
				</div>
				<div class="ui-g-12 ui-lg-6" >
					<p:inputText placeholder="Brasil, Venezuela...."
						id="nacionalidadeEle"
						value="#{cadastroCasalBean.casal.nacionalidadeEle}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Nome Ela" for="nomeEla" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText placeholder="Nome Completo Ela" id="nomeEla"
						required="true" value="#{cadastroCasalBean.casal.nomeEla}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Apelido Ela" for="apelidoEla" />
				</div>

				<div class="ui-g-12 ui-lg-4">
					<p:inputText placeholder="Nome no Crachá Ela(MARIA DO JOAO)" id="apelidoEla"
						required="true" value="#{cadastroCasalBean.casal.apelidoEla}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Data de Nascimento Ela" for="nascimentoEla" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:calendar id="nascimentoEla" required="true"
						value="#{cadastroCasalBean.casal.dataNascimentoEla}" mask="true"
						pattern="dd/MM/yyyy" mode="popup" showButtonPanel="true"
						showOn="button" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Email Ela" for="emailEla" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText placeholder="Email" id="emailEla"
						value="#{cadastroCasalBean.casal.emailEla}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Telefone 1" for="telefoneUmEla" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:inputMask id="telefoneUmEla" placeholder="Telefone 1"
						required="true" value="#{cadastroCasalBean.casal.telefoneElaUm}"
						mask="(99)999999999">
					</p:inputMask>
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Telefone 2" for="telefoneDoisEla" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:inputMask id="telefoneDoisEla" placeholder="Telefone 2"
						value="#{cadastroCasalBean.casal.telefoneElaDois}"
						mask="(99)999999999">
					</p:inputMask>
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Naturalidade Ela" for="naturalidadeEla" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:inputText placeholder="Boa Vista - RR, Manaus - AM...."
						id="naturalidadeEla"
						value="#{cadastroCasalBean.casal.naturalidadeEla}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Nacionalidade Ela" for="nacionalidadeEla" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText placeholder="Brasil, Venezuela...."
						id="nacionalidadeEla"
						value="#{cadastroCasalBean.casal.nacionalidadeEla}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Data de Casamento" for="casamento" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:calendar id="casamento" required="true"
						value="#{cadastroCasalBean.casal.dataCasamento}" mask="true"
						pattern="dd/MM/yyyy" mode="popup" showButtonPanel="true"
						showOn="button" />
				</div>
			</p:fieldset>
		</div>
		<div class="ui-g-12">
			<!-- Endereco -->
			<p:fieldset legend="Endereço">
				<div class="ui-g-12">
					<p:outputLabel value="Endereço" for="endereco" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:inputText id="endereco" required="true"
						value="#{cadastroCasalBean.casal.endereco.logradouro}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Número" for="numero" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText id="numero" required="true"
						value="#{cadastroCasalBean.casal.endereco.numero}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Bairro" for="bairro" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText id="bairro" required="true"
						value="#{cadastroCasalBean.casal.endereco.bairro}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Cidade" for="cidade" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText id="cidade" required="true"
						value="#{cadastroCasalBean.casal.endereco.cidade}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="UF" for="uf" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:selectOneMenu id="uf" label="UF" required="true"
						value="#{cadastroCasalBean.casal.endereco.estado}">
						<f:selectItem itemLabel="Selecione" />
						<f:selectItems value="#{cadastroFichaBean.estados}" var="estado"
							itemValue="#{estado.sigla}" itemLabel="#{estado.sigla}" />
					</p:selectOneMenu>
				</div>
			</p:fieldset>
		</div>

		<div class="ui-g-12">
			<!-- SEGUE-ME -->
			<p:fieldset legend="Informação Extra">
				<div class="ui-g-12">
					<p:outputLabel value="Paróquia que frequenta"
						for="paroquiafrequenta" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:selectOneMenu id="paroquiafrequenta"
						value="#{cadastroCasalBean.casal.paroquia}">
						<f:selectItem itemLabel="Selecione a Paroquia" />
						<f:selectItems value="#{cadastroCasalBean.listaParoquia}"
							var="paroquia" itemValue="#{paroquia}"
							itemLabel="#{paroquia.descricao}" />
					</p:selectOneMenu>
				</div>
				<div class="ui-g-12">
					<p:outputLabel value="Igreja que frequenta" for="igreja" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText placeholder="Igreja que frequenta" id="igreja"
						value="#{cadastroCasalBean.casal.igrejaFrequenta}" />
				</div>
			</p:fieldset>
		</div>

		<div class="ui-g-12">
			<!-- SEGUE-ME -->
			<p:fieldset legend="ECC">
				<div class="ui-g-12">
					<p:outputLabel value="Paróquia " for="paroquiaSeguidorNovo" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:selectOneMenu id="paroquiaSeguidorNovo"
						value="#{cadastroCasalBean.paroquia}">
						<f:selectItem itemLabel="Selecione a Paroquia" />
						<f:selectItems value="#{cadastroCasalBean.listaParoquia}"
							var="paroquia" itemValue="#{paroquia}"
							itemLabel="#{paroquia.descricao}" />
						<p:ajax listener="#{cadastroCasalBean.onEccChange()}" update="ecc" />
					</p:selectOneMenu>
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Ecc" for="ecc" />
				</div>
				<div class="ui-g-12 ui-md-6 ui-lg-6">
					<div class="ui-inputgroup">
						<p:selectOneMenu id="ecc" label="ECC"
							value="#{cadastroCasalBean.casal.ecc}" style="width: 90%;">
							<f:selectItem itemLabel="Selecione o ECC" />
							<f:selectItems value="#{cadastroCasalBean.listaEcc}" var="ecc"
								itemValue="#{ecc}"
								itemLabel="#{ecc.titulo} - #{ecc.numeroRomano.numeroRomano}" />
						</p:selectOneMenu>
					</div>
				</div>
			</p:fieldset>
		</div>
		<div class="save ui-g-12">
			<p:commandButton value="Salvar"
				style="width: auto; margin-left: 20px;"
				action="#{cadastroCasalBean.salvar()}" update="@form"
				process="casalPanelGroup" icon="fa fa-save" styleClass="green-btn" />

			<ui:insert name="cancelar" />
		</div>
	</h:panelGroup>

	<p:dialog header="fotoEle" id="fotoDialogEle"
		widgetVar="fotoDialogWidgetVarEle">
		<p:graphicImage value="#{cadastroCasalBean.casal.carregarImagemEle()}"
			style="max-width: 300px"
			rendered="#{cadastroCasalBean.casal.exibirImagemEle}" id="imagemEle" />
	</p:dialog>

	<p:dialog header="Novo ECC" id="novoEccDialog" showEffect="clip"
		hideEffect="clip" widgetVar="novoEcc" modal="true" width="300">
		<ui:include src="/WEB-INF/facelets/casal/cadastro-ecc.xhtml" />
	</p:dialog>
</ui:composition>
