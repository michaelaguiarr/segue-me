<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui">
	<h:panelGroup id="seguidorPanelGroup">
		<p:focus for="nome" />
		<div class="ui-g-12">
			<!-- Seguidor -->
			<p:fieldset legend="Seguidor">
				<div class="ui-g-12">
					<p:outputLabel value="Foto" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<h:panelGrid id="fotoPanelGroupUpload">
						<p:fileUpload fileUploadListener="#{cadastroSeguidorBean.upload}"
							allowTypes="/(\.|\/)(gif|png|jpe?g)$/"
							invalidFileMessage="São permitidas somente imagens (jpg)"
							auto="true" label="Foto"
							update="fotoPanelGroup fotoPanelGroupUpload"
							rendered="#{cadastroSeguidorBean.imagemDoUsuario == null}" />
					</h:panelGrid>
				</div>

				<div class="ui-g-12">
					<h:panelGrid id="fotoPanelGroup">
						<p:graphicImage value="#{cadastroSeguidorBean.imagemDoUsuario}"
							rendered="#{cadastroSeguidorBean.imagemDoUsuario ne null}"
							width="100px" height="200px" id="foto"
							onclick="PF('fotoDialogWidgetVar').show()" cache="false" />

						<p:commandButton value="Remover Foto"
							style="width: auto; margin-left: 15px;"
							actionListener="#{cadastroSeguidorBean.removerFoto}"
							rendered="#{cadastroSeguidorBean.imagemDoUsuario ne null}"
							process="@this" update="fotoPanelGroup, fotoPanelGroupUpload" />
					</h:panelGrid>
				</div>
				<div class="ui-g-12">
					<p:outputLabel value="Nome" for="nome" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:inputText placeholder="Nome Completo" id="nome" required="true"
						value="#{cadastroSeguidorBean.seguidor.nome}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Apelido" for="apelido" />
				</div>

				<div class="ui-g-12 ui-lg-4">
					<p:inputText placeholder="Nome no Crachá" id="apelido"
						required="true" value="#{cadastroSeguidorBean.seguidor.apelido}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Data de Nascimento" for="nascimento" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:calendar id="nascimento" required="true"
						value="#{cadastroSeguidorBean.seguidor.dataNascimento}"
						mask="true" pattern="dd/MM/yyyy" mode="popup"
						showButtonPanel="true" showOn="button" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Sexo" for="sexo" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:selectOneMenu id="sexo" label="Sexo" required="true"
						converter="omnifaces.SelectItemsConverter"
						value="#{cadastroSeguidorBean.seguidor.sexo}">
						<f:selectItem itemLabel="Sexo" noSelectionOption="true" />
						<f:selectItems value="#{cadastroSeguidorBean.listaSexo}"
							var="sexo" itemValue="#{sexo}" itemLabel="#{sexo.nome}" />
					</p:selectOneMenu>
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Email" for="email" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText placeholder="Email" id="email"
						value="#{cadastroSeguidorBean.seguidor.email}" />
				</div>


				<div class="ui-g-12">
					<p:outputLabel value="Telefone 1" for="telefoneUm" />
				</div>


				<div class="ui-g-12 ui-lg-6">
					<p:inputMask id="telefoneUm" placeholder="Telefone 1"
						required="true"
						value="#{cadastroSeguidorBean.seguidor.telefoneUm}"
						mask="(99)999999999">
					</p:inputMask>
				</div>
				<div class="ui-g-12">
					<p:outputLabel value="Telefone 2" for="telefoneDois" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:inputMask id="telefoneDois" placeholder="Telefone 2"
						value="#{cadastroSeguidorBean.seguidor.telefoneDois}"
						mask="(99)999999999">
					</p:inputMask>
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Telefone 3" for="telefone3" />
				</div>


				<div class="ui-g-12 ui-lg-6">
					<p:inputMask id="telefone3" placeholder="Telefone 3"
						value="#{cadastroSeguidorBean.seguidor.telefoneTres}"
						mask="(99)999999999">
					</p:inputMask>
				</div>
				<div class="ui-g-12">
					<p:outputLabel value="Telefone 4" for="telefone4" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:inputMask id="telefone4" placeholder="Telefone 4"
						value="#{cadastroSeguidorBean.seguidor.telefoneQuatro}"
						mask="(99)999999999">
					</p:inputMask>
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Naturalidade" for="naturalidade" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText placeholder="Boa Vista - RR, Manaus - AM...."
						id="naturalidade"
						value="#{cadastroSeguidorBean.seguidor.naturalidade}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Nacionalidade" for="nacionalidade" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:inputText placeholder="Brasil, Venezuela...." id="nacionalidade"
						value="#{cadastroSeguidorBean.seguidor.nacionalidade}" />
				</div>
				<div class="ui-g-12">
					<p:outputLabel value="Sagramentos" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:selectBooleanCheckbox
						value="#{cadastroSeguidorBean.seguidor.sagramentoBatismo}" />
					<p:outputLabel value=" Batismo " />
					<p:selectBooleanCheckbox
						value="#{cadastroSeguidorBean.seguidor.sagramentoEucaristia}" />
					<p:outputLabel value=" Eucaristia " />
					<p:selectBooleanCheckbox
						value="#{cadastroSeguidorBean.seguidor.sagramentoCrisma}" />
					<p:outputLabel value=" Crisma " />
				</div>

				<div class="ui-g-12">
					<p:outputLabel
						value="Participa(ou) de algum movimento na igreja? Qual(is)" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:inputText id="movimentos"
						value="#{cadastroSeguidorBean.seguidor.movimentos}" />
				</div>
				<div class="ui-g-12">
					<p:outputLabel value="Toca algum instrumento musical? Qual(is)?"
						for="instrumento" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText placeholder="Violão, Baixo..." id="instrumento"
						value="#{cadastroSeguidorBean.seguidor.tocarInstrumento}" />
				</div>
				<div class="ui-g-12">
					<p:outputLabel value="Paróquia que frequenta"
						for="paroquiafrequenta" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:selectOneMenu id="paroquiafrequenta" required="true"
						value="#{cadastroSeguidorBean.seguidor.paroquia}">
						<f:selectItem itemLabel="Selecione a Paroquia" />
						<f:selectItems
							value="#{cadastroSeguidorBean.listaParoquiaSeguidor}"
							var="paroquia" itemValue="#{paroquia}"
							itemLabel="#{paroquia.descricao}" />
					</p:selectOneMenu>
				</div>
				<div class="ui-g-12">
					<p:outputLabel value="Igreja que frequenta" for="igreja" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:inputText placeholder="Igreja que frequenta" id="igreja"
						value="#{cadastroSeguidorBean.seguidor.igrejaFrequenta}" />
				</div>
				<div class="ui-g-12">
					<p:outputLabel value="Filiação Pai" for="pai" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText id="pai" placeholder="Nome Completo Pai"
						value="#{cadastroSeguidorBean.seguidor.filiacaoPai}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Telefone Pai" for="celularPai" />
				</div>
				<div class="ui-g-12  ui-lg-4">
					<p:inputMask id="celularPai" placeholder="Telefone pai"
						value="#{cadastroSeguidorBean.seguidor.telefonePai}"
						mask="(99)999999999" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Filiação Mãe" for="mae" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText id="mae" placeholder="Nome Completo Mãe"
						value="#{cadastroSeguidorBean.seguidor.filiacaoMae}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Telefone Mãe" for="celularMae" />
				</div>

				<div class="ui-g-12  ui-lg-4">
					<p:inputMask id="celularMae" placeholder="Telefone mãe"
						value="#{cadastroSeguidorBean.seguidor.telefoneMae}"
						mask="(99)999999999" />
				</div>
			</p:fieldset>
		</div>
		<div class="ui-g-12">
			<!-- Endereco -->
			<p:fieldset legend="Endereço">
				<div class="ui-g-12">
					<p:outputLabel value="Endereço" for="endereco" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:inputText id="endereco" required="true"
						value="#{cadastroSeguidorBean.seguidor.endereco.logradouro}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Número" for="numero" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText id="numero" required="true"
						value="#{cadastroSeguidorBean.seguidor.endereco.numero}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Bairro" for="bairro" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText id="bairro" required="true"
						value="#{cadastroSeguidorBean.seguidor.endereco.bairro}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Cidade" for="cidade" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText id="cidade" required="true"
						value="#{cadastroSeguidorBean.seguidor.endereco.cidade}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="UF" for="uf" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:selectOneMenu id="uf" label="UF" required="true"
						value="#{cadastroSeguidorBean.seguidor.endereco.estado}">
						<f:selectItem itemLabel="Selecione" />
						<f:selectItems value="#{cadastroFichaBean.estados}" var="estado"
							itemValue="#{estado.sigla}" itemLabel="#{estado.sigla}" />
					</p:selectOneMenu>
				</div>
			</p:fieldset>
		</div>
		<div class="ui-g-12">
			<!-- Escolaridade -->
			<p:fieldset legend="Escolaridade">
				<div class="ui-g-12">
					<p:outputLabel value="Escolaridade" for="escolaridade" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText id="escolaridade"
						placeholder="Superior, Ensino Medio..."
						value="#{cadastroSeguidorBean.seguidor.escolaridade}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Situação" for="situacaoEscola" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:inputText id="situacaoEscola"
						placeholder="Completo, Incompleto, cursando..."
						value="#{cadastroSeguidorBean.seguidor.situacaoEscolaridade}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Curso" for="curso" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText id="curso" placeholder="Qual seu curso?"
						value="#{cadastroSeguidorBean.seguidor.curso}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Instituição" for="instituicao" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:inputText id="instituicao"
						placeholder="Nome Escola, faculdade..."
						value="#{cadastroSeguidorBean.seguidor.instituicao}" />
				</div>
			</p:fieldset>
		</div>
		<div class="ui-g-12">
			<!-- SEGUE-ME -->
			<p:fieldset legend="Rede Socias">
				<div class="ui-g-12">
					<p:outputLabel value="Facebook" for="facebook" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText id="facebook" placeholder="Facebook"
						value="#{cadastroSeguidorBean.seguidor.redeSocialFacebook}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Instagram" for="instagram" />
				</div>

				<div class="ui-g-12  ui-lg-6">
					<p:inputText id="instagram" placeholder="Instagram"
						value="#{cadastroSeguidorBean.seguidor.redeSocialInstagram}" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Twitter" for="twitter" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:inputText id="twitter" placeholder="Twitter"
						value="#{cadastroSeguidorBean.seguidor.redeSocialTwitter}" />
				</div>
			</p:fieldset>
		</div>

		<div class="ui-g-12">
			<!-- SEGUE-ME -->
			<p:fieldset legend="Segue-me Origem">
				<div class="ui-g-12">
					<p:outputLabel value="Paroquia " for="paroquiaSeguidorNovo" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:selectOneMenu id="paroquiaSeguidorNovo"
						value="#{cadastroSeguidorBean.paroquia}" required="true">
						<f:selectItem itemLabel="Selecione a Paroquia" />
						<f:selectItems
							value="#{cadastroSeguidorBean.listaParoquiaSeguidor}"
							var="paroquia" itemValue="#{paroquia}"
							itemLabel="#{paroquia.descricao}" />
						<p:ajax
							listener="#{cadastroSeguidorBean.onSegueMeSeguidorChange()}"
							update="segueMeSeguidor" />
						<p:ajax
							listener="#{cadastroSeguidorBean.onCirculoChange()}"
							update="circulo" />
					</p:selectOneMenu>
				</div>
				<div class="ui-g-12">
					<p:outputLabel value="Segue-me " for="segueMeSeguidor" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:selectOneMenu id="segueMeSeguidor" label="Segue-me"
						required="true" value="#{cadastroSeguidorBean.seguidor.segueMe}">
						<f:selectItem itemLabel="Selecione o Segue-Me" />
						<f:selectItems
							value="#{cadastroSeguidorBean.listaSegueMeSeguidor}"
							var="segueMe" itemValue="#{segueMe}"
							itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
					</p:selectOneMenu>
				</div>
				<div class="ui-g-12">
					<p:outputLabel value="Círculo" for="circulo" />
				</div>
				<div class="ui-g-12 ui-md-6 ui-lg-6">
					<div class="ui-inputgroup">
						<p:selectOneMenu id="circulo" label="Círculo" required="true"
							value="#{cadastroSeguidorBean.seguidor.circulo}"
							converter="omnifaces.SelectItemsConverter">
							<f:selectItem itemLabel="Selecione o Círculo" />
							<f:selectItems value="#{cadastroSeguidorBean.listaCirculos}"
								var="circulo" itemValue="#{circulo}"
								itemLabel="#{circulo.corCirculo} - #{circulo.nome} (SEGUE-ME #{circulo.segueMe.numeroRomano.numeroRomano})" />
						</p:selectOneMenu>
					</div>
				</div>
			</p:fieldset>
			<div class="save ui-g-12">
				<p:commandButton value="Salvar"
					style="width: auto; margin-left: 20px;"
					action="#{cadastroSeguidorBean.salvar()}" update="@form"
					process="seguidorPanelGroup" icon="fa fa-save"
					styleClass="green-btn" />

				<ui:insert name="cancelar" />
			</div>
		</div>
	</h:panelGroup>

	<p:dialog header="foto" id="fotoDialog" widgetVar="fotoDialogWidgetVar">
		<p:graphicImage
			value="#{cadastroSeguidorBean.seguidor.carregarImagem()}"
			style="max-width: 300px"
			rendered="#{cadastroSeguidorBean.seguidor.exibirImagem}"
			id="produtoFoto" />
	</p:dialog>
	<p:dialog header="Novo Circulo" id="novoCirculoDialog"
		showEffect="clip" hideEffect="clip" widgetVar="novoCirculo"
		modal="true" width="350">
		<ui:include src="/WEB-INF/facelets/seguidor/cadastro-circulo.xhtml" />
	</p:dialog>
</ui:composition>
