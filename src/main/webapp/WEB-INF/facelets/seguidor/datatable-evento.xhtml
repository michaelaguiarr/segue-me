<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui">
	<h:panelGroup id="eventoPanelGroup">
		<p:focus for="nome" />
		<div class="ui-g-12">
			<!-- Seguidor -->
			<p:fieldset legend="Historico">
				<p:dataTable var="seguidor" id="datatable-seguidor"
					value="#{detalhesSeguidorBean.listaEvento}" reflow="true"
					emptyMessage="Nenhuma partipação  encontrada!"  sortBy="#{seguidor.segueMe.dtInicio}">

					<p:column headerText="Data do Encontro" width="100">
						<h:outputText value="#{seguidor.segueMe.dtInicio}">
							<f:convertDateTime pattern="dd/MM/yyyy" />
						</h:outputText>
						á 
						<h:outputText value="#{seguidor.segueMe.dtFim}">
							<f:convertDateTime pattern="dd/MM/yyyy" />
						</h:outputText>
					</p:column>

					<p:column headerText="Equipe/Circulo"
						sortBy="#{seguidor.equipe.titulo}" width="100">
						<h:outputText value="#{seguidor.equipe.titulo}" />
						<div jsf:rendered="#{seguidor.inscricao != null}">
							<span
								class="situacao #{seguidor.circulo.corCirculo.coresParaStyle}">#{seguidor.circulo.corCirculo}</span>
						</div>
					</p:column>
					<p:column headerText="Função" sortBy="#{seguidor.funcao.descricao}"
						width="100">
						<h:outputText value="#{seguidor.funcao.descricao}"
							rendered="#{seguidor.inscricao == null}" />
						<h:outputText value="Seguimista"
							rendered="#{seguidor.inscricao != null}" />
					</p:column>
					<p:column headerText="Paroquia"
						sortBy="#{seguidor.segueMe.paroquia.descricao}" width="200">
						<h:outputText value="#{seguidor.segueMe.paroquia.descricao}" />
					</p:column>

					<p:column headerText="Segue-me"
						sortBy="#{seguidor.segueMe.numeroRomano.numeroRomano}" width="200">
						<h:outputText
							value="#{seguidor.segueMe.titulo} - #{seguidor.segueMe.numeroRomano.numeroRomano}" />
					</p:column>

					<p:column headerText="Situação" width="80"
						sortBy="#{seguidor.statusConvite.nome}">
						<div jsf:rendered="#{seguidor.inscricao == null}">
							<span class="situacao #{seguidor.statusConvite.coresParaStyle}">#{seguidor.statusConvite.nome}</span>
						</div>
						<div jsf:rendered="#{seguidor.inscricao != null}">
							<span
								class="situacao #{seguidor.inscricao.statusInscricao.coresParaStyle}">#{seguidor.inscricao.statusInscricao.nome}</span>
						</div>

					</p:column>
				</p:dataTable>
			</p:fieldset>
			<div class="save ui-g-12">
				<ui:insert name="cancelar" />
			</div>
		</div>
	</h:panelGroup>
</ui:composition>
