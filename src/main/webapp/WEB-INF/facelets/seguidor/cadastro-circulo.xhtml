<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui">

	<h:panelGroup id="circuloPanelGroup">
		<div class="ui-fluid">
			<div class="ui-g-12">
				<p:messages id="circuloMessages" autoUpdate="false" />
				<div class="ui-g-12">
					<p:outputLabel value="Paroquia" for="paroquiaCirculo" />
				</div>

				<div class="ui-g-12">
					<p:selectOneMenu id="paroquiaCirculo" required="true"
						value="#{cadastroSeguidorBean.paroquiaCirculo}" >
						<f:selectItem itemLabel="Paroquia" />
						<f:selectItems
							value="#{cadastroSeguidorBean.listaParoquiaCirculo}"
							var="paroquia" itemValue="#{paroquia}"
							itemLabel="#{paroquia.descricao}" />
						<p:ajax
							listener="#{cadastroSeguidorBean.onSegueMeCirculoChange()}"
							update="segueMeCirculo" />
					</p:selectOneMenu>
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Segue-me" for="segueMeCirculo" />
				</div>
				<div class="ui-g-12 ">
					<p:selectOneMenu id="segueMeCirculo" label="Segue-Me"
						required="true" value="#{cadastroSeguidorBean.circulo.segueMe}">
						<f:selectItem itemLabel="Segue-me" noSelectionOption="true" />
						<f:selectItems value="#{cadastroSeguidorBean.listaSegueMeCirculo}"
							var="segueMe" itemValue="#{segueMe}"
							itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
					</p:selectOneMenu>
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Cor" for="cor" />
				</div>
				<div class="ui-g-12 ui-lg-6">
					<p:selectOneMenu id="cor" label="Cor" required="true"
						value="#{cadastroSeguidorBean.circulo.corCirculo}">
						<f:selectItem itemLabel="Cor" noSelectionOption="true" />
						<f:selectItems value="#{cadastroSeguidorBean.corCirculo}"
							var="cor" itemValue="#{cor}" itemLabel="#{cor.descricao}" />
					</p:selectOneMenu>
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Nome" for="nomeCirculo" />
				</div>
				<div class="ui-g-12">
					<p:inputText id="nomeCirculo"
						value="#{cadastroSeguidorBean.circulo.nome}" />
				</div>
				<div class="save ui-g-12">

					<p:commandButton value="Salvar" style="width: auto;"
						styleClass="green-btn topo" icon="fa fa-save"
						action="#{cadastroSeguidorBean.salvarCirculo()}" ignoreAutoUpdate="true"
						process="circuloPanelGroup"
						update="circuloPanelGroup circulo circuloMessages"
						oncomplete="if (!args.validationFailed) PF('novoCirculo').hide()" />

					<p:button value="Cancelar" style="width: auto; margin-left: 15px;"
						onclick="PF('novoCirculo').hide(); return false;"
						icon="fa fa-remove" />
				</div>

			</div>
		</div>
	</h:panelGroup>
</ui:composition>
