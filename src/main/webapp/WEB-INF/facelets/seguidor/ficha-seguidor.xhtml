<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui">
	<h:panelGroup id="seguidorPanelGroup">
		<p:focus for="nome" />
		<div class="ui-g-12">
			<!-- Seguidor -->
			<p:fieldset legend="Seguidor">
				<div class="ui-g-12">
					<p:outputLabel value="Foto" />
				</div>
				<div class="ui-g-12">
					<h:panelGrid id="fotoPanelGroup">
						<p:graphicImage
							value="#{detalhesSeguidorBean.seguidor.carregarImagem()}"
							rendered="#{detalhesSeguidorBean.seguidor.imagem ne null}"
							width="100px" height="200px" id="foto"
							onclick="PF('fotoDialogWidgetVar').show()" cache="false" />
					</h:panelGrid>
				</div>
				<div class="ui-g-8">
					<p:outputLabel value="Nome" for="nome" />
				</div>
				<div class="ui-g-4">
					<p:outputLabel value="Apelido" for="apelido" />
				</div>

				<div class="ui-g-8 ui-lg-8">
					<p:outputLabel value="#{detalhesSeguidorBean.seguidor.nome}"
						id="nome" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-4 ui-lg-4">
					<p:outputLabel value="#{detalhesSeguidorBean.seguidor.apelido}"
						id="apelido" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="Data de Nascimento" for="nascimento" />
				</div>
				<div class="ui-g-6">
					<p:outputLabel value="Sexo" for="sexo" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.dataNascimento}"
						id="nascimento" style="color: black;  font-weight: bold;">
						<f:convertDateTime pattern="dd/MM/yyyy" />
					</p:outputLabel>
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel value="#{detalhesSeguidorBean.seguidor.sexo.nome}"
						id="sexo" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Email" for="email" />
				</div>

				<div class="ui-g-6 ui-lg-12">
					<p:outputLabel value="#{detalhesSeguidorBean.seguidor.email}"
						id="email" style="color: black;  font-weight: bold;" />
				</div>


				<div class="ui-g-6">
					<p:outputLabel value="Telefone 1" for="telefoneUm" />
				</div>
				<div class="ui-g-6">
					<p:outputLabel value="Telefone 2" for="telefoneDois" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel value="#{detalhesSeguidorBean.seguidor.telefoneUm}"
						id="telefoneUm" style="color: black;  font-weight: bold;" />
				</div>
				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.telefoneDois}"
						id="telefoneDois" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="Telefone 3" for="telefone3" />
				</div>
				<div class="ui-g-6">
					<p:outputLabel value="Telefone 4" for="telefone4" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.telefoneTres}"
						id="telefone3" style="color: black;  font-weight: bold;" />
				</div>
				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.telefoneQuatro}"
						id="telefone4" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="Naturalidade" for="naturalidade" />
				</div>
				<div class="ui-g-6">
					<p:outputLabel value="Nacionalidade" for="nacionalidade" />
				</div>
				<div class="ui-g-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.naturalidade}"
						id="naturalidade" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.nacionalidade}"
						id="nacionalidade" style="color: black;  font-weight: bold;" />
				</div>
				<div class="ui-g-6">
					<p:outputLabel value="Sagramentos" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel
						value="Participa(ou) de algum movimento na igreja? Qual(is)" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:selectBooleanCheckbox disabled="true"
						value="#{detalhesSeguidorBean.seguidor.sagramentoBatismo}" />
					<p:outputLabel value=" Batismo " />
					<p:selectBooleanCheckbox disabled="true"
						value="#{detalhesSeguidorBean.seguidor.sagramentoEucaristia}" />
					<p:outputLabel value=" Eucaristia " />
					<p:selectBooleanCheckbox disabled="true"
						value="#{detalhesSeguidorBean.seguidor.sagramentoCrisma}" />
					<p:outputLabel value=" Crisma " />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel value="#{detalhesSeguidorBean.seguidor.movimentos}"
						id="movimentos" style="color: black;  font-weight: bold;" />
				</div>
				<div class="ui-g-12">
					<p:outputLabel value="Toca algum instrumento musical? Qual(is)?"
						for="instrumento" />

				</div>

				<div class="ui-g-6 ui-lg-12">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.tocarInstrumento}"
						id="instrumento" style="color: black;  font-weight: bold;" />
				</div>
				<div class="ui-g-6">
					<p:outputLabel value="Paróquia que frequenta"
						for="paroquiafrequenta" />
				</div>
				<div class="ui-g-6">
					<p:outputLabel value="Igreja que frequenta" for="igreja" />
				</div>
				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.paroquia.descricao}"
						id="paroquiafrequenta" style="color: black;  font-weight: bold;" />
				</div>
				<div class="ui-g-6 ui-lg-">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.igrejaFrequenta}"
						id="igreja" style="color: black;  font-weight: bold;" />
				</div>
				<div class="ui-g-8">
					<p:outputLabel value="Filiação Pai" for="pai" />
				</div>
				<div class="ui-g-4">
					<p:outputLabel value="Telefone Pai" for="celularPai" />
				</div>
				<div class="ui-g-8 ui-lg-8">
					<p:outputLabel value="#{detalhesSeguidorBean.seguidor.filiacaoPai}"
						id="pai" style="color: black;  font-weight: bold;" />
				</div>


				<div class="ui-g-4  ui-lg-4">
					<p:outputLabel value="#{detalhesSeguidorBean.seguidor.telefonePai}"
						id="celularPai" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-8">
					<p:outputLabel value="Filiação Mãe" for="mae" />
				</div>

				<div class="ui-g-4">
					<p:outputLabel value="Telefone Mãe" for="celularMae" />
				</div>

				<div class="ui-g-8 ui-lg-8">
					<p:outputLabel value="#{detalhesSeguidorBean.seguidor.filiacaoMae}"
						id="mae" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-4  ui-lg-4">
					<p:outputLabel value="#{detalhesSeguidorBean.seguidor.telefoneMae}"
						id="celularMae" style="color: black;  font-weight: bold;" />
				</div>
			</p:fieldset>
		</div>
		<div class="ui-g-12">
			<!-- Endereco -->
			<p:fieldset legend="Endereço">
				<div class="ui-g-12">
					<p:outputLabel value="Endereço" for="endereco" />
				</div>
				<div class="ui-g-12 ui-lg-12">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.endereco.logradouro}"
						id="endereco" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="Número" for="numero" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="Bairro" for="bairro" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.endereco.numero}"
						id="numero" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.endereco.bairro}"
						id="bairro" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="Cidade" for="cidade" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="UF" for="uf" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.endereco.cidade}"
						id="cidade" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.endereco.estado}" id="uf"
						style="color: black;  font-weight: bold;" />
				</div>
			</p:fieldset>
		</div>
		<div class="ui-g-12">
			<!-- Escolaridade -->
			<p:fieldset legend="Escolaridade">
				<div class="ui-g-6">
					<p:outputLabel value="Escolaridade" for="escolaridade" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="Situação" for="situacaoEscola" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.escolaridade}"
						id="escolaridade" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.situacaoEscolaridade}"
						id="situacaoEscola" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="Curso" for="curso" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="Instituição" for="instituicao" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel value="#{detalhesSeguidorBean.seguidor.curso}"
						id="curso" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel value="#{detalhesSeguidorBean.seguidor.instituicao}"
						id="instituicao" style="color: black;  font-weight: bold;" />
				</div>
			</p:fieldset>
		</div>
		<div class="ui-g-12">
			<!-- SEGUE-ME -->
			<p:fieldset legend="Rede Socias">
				<div class="ui-g-6">
					<p:outputLabel value="Facebook" for="facebook" />
				</div>

				<div class="ui-g-6">
					<p:outputLabel value="Instagram" for="instagram" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.redeSocialFacebook}"
						id="facebook" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6  ui-lg-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.redeSocialInstagram}"
						id="instagram" style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-12">
					<p:outputLabel value="Twitter" for="twitter" />
				</div>

				<div class="ui-g-12 ui-lg-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.redeSocialTwitter}"
						id="twitter" style="color: black;  font-weight: bold;" />
				</div>
			</p:fieldset>
		</div>

		<div class="ui-g-12">
			<!-- SEGUE-ME -->
			<p:fieldset legend="Segue-me Origem">
				<div class="ui-g-6">
					<p:outputLabel value="Paroquia " for="paroquiaSeguidorNovo" />
				</div>
				<div class="ui-g-6">
					<p:outputLabel value="Segue-me " for="segueMeSeguidor" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.segueMe.paroquia.descricao}"
						id="paroquiaSeguidorNovo"
						style="color: black;  font-weight: bold;" />
				</div>

				<div class="ui-g-6 ui-lg-6">
					<p:outputLabel
						value="#{detalhesSeguidorBean.seguidor.segueMe.titulo} -  #{detalhesSeguidorBean.seguidor.segueMe.numeroRomano.numeroRomano}"
						id="segueMeSeguidor" style="color: black;  font-weight: bold;" />
				</div>
				<div class="ui-g-12">
					<p:outputLabel value="Círculo" for="circulo" />
				</div>
				<div class="ui-g-12 ui-md-12 ui-lg-12">

					<span
						class="situacao #{detalhesSeguidorBean.seguidor.circulo.corCirculo.coresParaStyle}"><p:outputLabel
							value="#{detalhesSeguidorBean.seguidor.circulo.nome}"
							id="circulo" style="color: black;  font-weight: bold;" /></span>
				</div>
			</p:fieldset>
		</div>
	</h:panelGroup>

	<p:dialog header="foto" id="fotoDialog" widgetVar="fotoDialogWidgetVar">
		<p:graphicImage
			value="#{detalhesSeguidorBean.seguidor.carregarImagem()}"
			style="max-width: 300px"
			rendered="#{detalhesSeguidorBean.seguidor.exibirImagem}"
			id="produtoFoto" />
	</p:dialog>
</ui:composition>
