<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui">
	<h:panelGroup id="eventoPanelGroup">
		<p:focus for="nome" />
		<div class="ui-g-12">
			<!-- Seguidor -->
			<p:fieldset legend="Historico">
				<p:dataTable var="seguidor" id="datatable-seguidor"
					value="#{detalhesSeguidorBean.listaEvento}" reflow="true"
					emptyMessage="Nenhuma partipação  encontrada!">

					<p:column headerText="Equipe" sortBy="#{seguidor.equipe.titulo}"
						width="100">
						<h:outputText value="#{seguidor.equipe.titulo}" />
					</p:column>
					<p:column headerText="Função" sortBy="#{seguidor.funcao.descricao}"
						width="100">
						<h:outputText value="#{seguidor.funcao.descricao}" />
					</p:column>
					<p:column headerText="Paroquia"
						sortBy="#{seguidor.segueMe.paroquia.descricao}" width="200">
						<h:outputText value="#{seguidor.segueMe.paroquia.descricao}" />
					</p:column>

					<p:column headerText="Segue-me"
						sortBy="#{seguidor.segueMe.numeroRomano.numeroRomano}" width="200">
						<h:outputText
							value="#{seguidor.segueMe.titulo} - #{seguidor.segueMe.numeroRomano.numeroRomano}" />
					</p:column>

					<p:column headerText="Situação" width="50"
						sortBy="#{seguidor.statusConvite.nome}">
						<span class="situacao #{seguidor.statusConvite.coresParaStyle}">#{seguidor.statusConvite.nome}</span>
					</p:column>

					<p:column headerText="Obs" sortBy="#{seguidor.motivoRecusa}"
						width="200">
						<h:outputText value="#{seguidor.motivoRecusa}" />
					</p:column>
				</p:dataTable>
			</p:fieldset>
			<div class="save ui-g-12">
				<ui:insert name="cancelar" />
			</div>
		</div>
	</h:panelGroup>
</ui:composition>
