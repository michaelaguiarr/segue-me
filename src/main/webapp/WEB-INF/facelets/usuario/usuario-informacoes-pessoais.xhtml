<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui">

	<h:form id="form-usuario">

		<div class="ui-g ui-fluid">
			<div class="ui-g-12">
				<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
				<div class="card card-w-title">

					<div class="ui-g-12">
						<p:outputLabel value="Foto" />
					</div>
					<div class="ui-g-12 ui-lg-6">
						<h:panelGrid id="fotoPanelGroupUpload">
							<p:fileUpload fileUploadListener="#{detalhesUsuarioBean.upload}"
								allowTypes="/(\.|\/)(jpg)$/"
								invalidFileMessage="São permitidas somente imagens (jpg)"
								auto="true" label="Foto"
								update="fotoPanelGroup fotoPanelGroupUpload"
								rendered="#{detalhesUsuarioBean.imagemDoUsuario == null}" />
						</h:panelGrid>
					</div>

					<div class="ui-g-12">
						<h:panelGrid id="fotoPanelGroup">
							<p:graphicImage value="#{detalhesUsuarioBean.imagemDoUsuario}"
								rendered="#{detalhesUsuarioBean.imagemDoUsuario ne null}"
								width="200px" id="foto" />

							<p:commandButton value="Remover Foto"
								style="width: auto; margin-left: 15px;"
								actionListener="#{detalhesUsuarioBean.removerFoto}"
								rendered="#{detalhesUsuarioBean.imagemDoUsuario ne null}"
								process="@this" update="fotoPanelGroup, fotoPanelGroupUpload" />
						</h:panelGrid>
					</div>

					<div class="ui-g-12">
						<p:outputLabel value="Nome Completa" for="nome" />
					</div>

					<div class="ui-g-12 ui-lg-6">
						<p:inputText placeholder="Nome Completo" id="nome"
							value="#{detalhesUsuarioBean.usuario.nome}" />
					</div>

					<div class="ui-g-12">
						<p:outputLabel value="Email" for="email" />
					</div>

					<div class="ui-g-12 ui-lg-6">
						<p:inputText id="email"
							value="#{detalhesUsuarioBean.usuario.email}" required="true" />
					</div>

					<div class="ui-g-12">
						<p:outputLabel value="Data de Nascimento" for="nascimento" />
					</div>

					<div class="ui-g-12 ui-lg-6">
						<p:calendar id="nascimento" navigator="true"
							value="#{detalhesUsuarioBean.usuario.dataNascimento}" mask="true"
							pattern="dd/MM/yyyy" mode="popup" />
					</div>

					<div class="ui-g-12">
						<p:outputLabel value="Sexo" for="sexo" />
					</div>

					<div class="ui-g-12 ui-lg-6">
						<p:selectOneMenu id="sexo" label="Sexo"
							value="#{detalhesUsuarioBean.usuario.sexo}">
							<f:selectItem itemLabel="Sexo" noSelectionOption="true" />
							<f:selectItems value="#{detalhesUsuarioBean.listaSexo}"
								var="sexo" itemValue="#{sexo}" itemLabel="#{sexo.nome}" />
						</p:selectOneMenu>
					</div>

					<div class="ui-g-12">
						<p:outputLabel value="Telefone" for="numero" />
					</div>

					<div class="ui-g-12 ui-lg-6">
						<p:inputText placeholder="Número" id="numero"
							value="#{detalhesUsuarioBean.usuario.telefoneNumero}" />
					</div>

					<div class="ui-g-12">
						<p:outputLabel value="Perfil" />
					</div>

					<div class="ui-g-12 ui-lg-6">
						<p:selectOneMenu id="perfil"
							value="#{detalhesUsuarioBean.usuario.perfil}">
							<f:selectItem itemLabel="Perfil de Acesso"
								noSelectionOption="true" />
							<f:selectItems value="#{detalhesUsuarioBean.listaPerfil}"
								var="perfil" itemValue="#{perfil}" itemLabel="#{perfil.nome}" />
						</p:selectOneMenu>
					</div>

					<div class="ui-g-12">
						<p:outputLabel value="Paroquia" for="paroquia" />
					</div>

					<div class="ui-g-12 ui-lg-6">
						<p:selectOneMenu id="paroquia"
							value="#{detalhesUsuarioBean.paroquia}" required="true"
							disabled="#{not seguranca.administradorGeral}">
							<f:selectItem itemLabel="Selecione a Paroquia" />
							<f:selectItems value="#{detalhesUsuarioBean.listaParoquia}"
								var="paroquia" itemValue="#{paroquia}"
								itemLabel="#{paroquia.descricao}" />
							<p:ajax listener="#{detalhesUsuarioBean.onSegueMeChange()}"
								update="segueMe" />
						</p:selectOneMenu>
					</div>

					<div class="ui-g-12">
						<p:outputLabel value="Segue-Me (Que vai Servi)" for="segueMe" />
					</div>
					<div class="ui-g-12 ui-lg-6">
						<p:selectOneMenu id="segueMe" label="Segue-me" required="true"
							value="#{detalhesUsuarioBean.usuario.segueMe}"
							disabled="#{not seguranca.administrador}">
							<f:selectItem itemLabel="Selecione o Segue-Me" />
							<f:selectItems value="#{detalhesUsuarioBean.listaSegueMe}"
								var="segueMe" itemValue="#{segueMe}"
								itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
						</p:selectOneMenu>
					</div>

					<div class="ui-g-12">
						<p:outputLabel value="Equipe" for="equipe" />
					</div>

					<div class="ui-g-12 ui-lg-6">
						<p:selectOneMenu id="equipe"
							value="#{detalhesUsuarioBean.usuario.equipe}" required="true"
							disabled="#{not seguranca.graficaAndComandante}">
							<f:selectItem itemLabel="Selecione a Equipe" />
							<f:selectItems value="#{detalhesUsuarioBean.listaEquipe}"
								var="equipe" itemValue="#{equipe}" itemLabel="#{equipe.titulo}" />
							<p:ajax listener="#{detalhesUsuarioBean.onFuncaoChange()}"
								update="funcao" />
						</p:selectOneMenu>
					</div>

					<div class="ui-g-12">
						<p:outputLabel value="Função" for="funcao" />
					</div>
					<div class="ui-g-12 ui-lg-6">
						<p:selectOneMenu id="funcao" label="Função" required="true"
							value="#{detalhesUsuarioBean.usuario.funcao}">
							<f:selectItem itemLabel="Selecione a função" />
							<f:selectItems value="#{detalhesUsuarioBean.listaFuncao}"
								var="funcao" itemValue="#{funcao}"
								itemLabel="#{funcao.descricao}" />
						</p:selectOneMenu>
					</div>

					<div class="ui-g-12">
						<p:outputLabel value="Situação" />
					</div>

					<div class="ui-g-12 ui-lg-6">
						<p:selectOneMenu id="situacao"
							value="#{detalhesUsuarioBean.usuario.status}">
							<f:selectItems value="#{detalhesUsuarioBean.statuss}"
								var="status" itemValue="#{status}" itemLabel="#{status.nome}" />
						</p:selectOneMenu>
					</div>

				</div>

				<div class="save ui-g-12">
					<p:commandButton value="Salvar"
						style="width: auto; margin-left: 15px;"
						action="#{detalhesUsuarioBean.updateUsuario}" process="@form"
						update="@form" icon="fa fa-save" styleClass="green-btn" />

					<p:button value="Cancelar" style="width: auto; margin-left: 15px;"
						outcome="pesquisa-usuario" icon="fa fa-remove" />
				</div>
			</div>
		</div>
	</h:form>

</ui:composition>
