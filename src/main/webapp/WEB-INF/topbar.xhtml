<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui"
	xmlns:pa="http://primefaces.org/paradise">

	<style>
		/* brasão do Segue-Me em disco branco, destacando-o da barra laranja */
		.topbar .topbar-logo { display: inline-flex; align-items: center; justify-content: center;
			width: 50px; height: 50px; padding: 3px; box-sizing: border-box; background: #fff; border-radius: 50%;
			box-shadow: 0 2px 6px rgba(120,72,0,.30); vertical-align: middle;
			transition: transform .15s ease, box-shadow .15s ease; }
		.topbar .topbar-logo:hover { transform: translateY(-1px); box-shadow: 0 5px 13px rgba(120,72,0,.38); }
		.topbar .topbar-logo img { height: 44px !important; width: 44px; border-radius: 50%; object-fit: contain; display: block; }
	</style>

	<div class="topbar">
		<h:link outcome="/dashboard" styleClass="topbar-logo" title="Segue-Me">
			<!-- 			<p:graphicImage name="images/#{guestPreferences.layout == 'default' ? 'logo-black.png' : 'logo-white.png'}" style="border: 0px;" library="paradise-layout" />  -->
			<p:graphicImage name="segue-me-288.png" style="border: 0px;"
				library="images" alt="Segue-Me" />
		</h:link>

		<a href="#" id="menu-button"> <i class="fa fa-bars"></i>
		</a> <a href="#" id="user-display"> <p:panelGrid style="float: left;"
				columns="1" styleClass="ui-panelgrid-blank">
				<span class="username">#{seguranca.nomeUsuario}</span>
				<br />
				<h:panelGroup>
					<span class="username">#{seguranca.usuarioLogado().equipe.titulo}</span>
					<span class="username">#{seguranca.usuarioLogado().funcao.descricao}</span>
				</h:panelGroup>
			</p:panelGrid> <p:graphicImage name="#{seguranca.imagemPerfil}" library="temp"
				style="border: 0px;" height="50px" /> <i class="fa fa-angle-down"></i>
		</a>

		<ul id="topbar-menu" class="fadeInDown animated">
			<li><h:link outcome="/meu-perfil/meu-perfil">
					<i class="topbar-icon fa fa-fw fa-user"></i>
					<span class="topbar-item-name">Meu Perfil</span>
					<f:param name="id" value="#{seguranca.usuarioLogado.usuario.id}" />
				</h:link></li>
			<li><p:commandLink url="logout">
					<i class="topbar-icon fa fa-fw fa-sign-out"></i>
					<span class="topbar-item-name">Sair</span>
				</p:commandLink></li>
		</ul>
	</div>
</ui:composition>
