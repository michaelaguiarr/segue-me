<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" lang="en">

<h:head>
	<f:facet name="first">
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
		<meta name="apple-mobile-web-app-capable" content="yes" />

		<meta http-equiv="cache-control" content="max-age=0" />
		<meta http-equiv="cache-control" content="no-cache" />
		<meta http-equiv="expires" content="0" />
		<meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
		<meta http-equiv="pragma" content="no-cache" />

	</f:facet>
	<title>Encontro de Jovem com Cristo "SEGUE-ME" - <ui:insert
			name="title" /></title>
	<h:outputScript name="js/nanoscroller.js" library="paradise-layout" />
	<h:outputScript name="js/layout.js" library="paradise-layout" />
	<h:outputScript name="locale.js" library="js" />
	<h:outputScript library="js" name="jquery.maskMoney.js" />
	<link rel="shortcut icon" type="image/png"
		href="#{facesContext.externalContext.request.contextPath}/resources/images/favicon.png" />
	<h:outputScript name="button.js" library="js" />
	<h:outputScript name="pula-campo-enter.js" library="js" />
	<ui:insert name="head" />

</h:head>

<h:body>
	<div
		class="layout-wrapper #{guestPreferences.slimMenu ? 'layout-menu-slim' : (guestPreferences.overlayMenu ? 'layout-menu-overlay' : 'layout-menu-static')}">
		<ui:include src="./topbar.xhtml" />

		<div class="layout-main">
			<ui:include src="./menu.xhtml" />

			<div class="layout-content">

				<ui:insert name="content">

				</ui:insert>
			</div>

			<!-- 			<ui:include src="./footer.xhtml" /> -->
		</div>
	</div>

	<p:ajaxStatus
		style="width:32px;height:32px;position:fixed;right:7px;bottom:7px">
		<f:facet name="start">
			<i class="fa fa-circle-o-notch fa-spin ajax-loader"
				aria-hidden="true"></i>
		</f:facet>

		<f:facet name="complete">
			<h:outputText value="" />
		</f:facet>
	</p:ajaxStatus>

	<h:outputStylesheet name="estilo.css" library="css" />
	<h:outputStylesheet name="css/nanoscroller.css"
		library="paradise-layout" />
	<h:outputStylesheet name="css/animate.css" library="paradise-layout" />
	<h:outputStylesheet name="css/layout-#{guestPreferences.layout}.css"
		library="paradise-layout" />

	<script>
			function configurarMoeda() {
				$(".moeda").maskMoney({ decimal: ",", thousands: ".", allowZero: true });
			}
			
			$(document).ready(function() {
				configurarMoeda();
			});

			function tratarInclusao(args) {
					if (!args.validationFailed) {
						inclusaoEnderecoDialog.hide();
					}
				}
	</script>
</h:body>
</html>
