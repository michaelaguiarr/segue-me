<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="title">Situação Mini-Mercado -  Segue-me</ui:define>

	<f:metadata>
		<f:viewAction action="#{relatorioVendaSituacao.inicializar()}" />
	</f:metadata>

	<ui:define name="content">
		<h:form id="form-cadastro">
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>Resumo Vendas por Situação- Segue-me</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
						<div class="ui-g">
							<div class="ui-g-12">
								<p:outputLabel value="Paroquia" for="paroquia" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:selectOneMenu id="paroquia"
									value="#{relatorioVendaSituacao.paroquia}" required="true"
									disabled="#{not seguranca.administradorGeral}">
									<f:selectItem itemLabel="Selecione a Paroquia" />
									<f:selectItems value="#{relatorioVendaSituacao.listaParoquia}"
										var="paroquia" itemValue="#{paroquia}"
										itemLabel="#{paroquia.descricao}" />
									<p:ajax listener="#{relatorioVendaSituacao.onSegueMeChange()}"
										update="segueMe" />
								</p:selectOneMenu>
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Segue-Me" for="segueMe" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:selectOneMenu id="segueMe" label="Segue-me" required="true"
									value="#{relatorioVendaSituacao.segueMe}">
									<f:selectItem itemLabel="Selecione o Segue-Me" />
									<f:selectItems value="#{relatorioVendaSituacao.listaSegueMe}"
										var="segueMe" itemValue="#{segueMe}"
										itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
								</p:selectOneMenu>
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Rusumo" for="paraQuem" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:selectOneRadio id="paraQuem"
									value="#{relatorioVendaSituacao.paraQuemVenda}"
									layout="responsive" columns="4" required="true">

									<f:selectItems value="#{relatorioVendaSituacao.paraQuemVendas}"
										var="praquem" itemValue="#{praquem}"
										itemLabel="#{praquem.descricao}" />
								</p:selectOneRadio>
							</div>

							<div class="ui-g-12">
								<p:outputLabel value="Situação" for="situacao" />
							</div>

							<div class="ui-g-12 ui-lg-6">
								<p:selectOneMenu id="situacao"
									value="#{relatorioVendaSituacao.statusVenda}" required="true">
									<f:selectItem itemLabel="Situação da Venda" />
									<f:selectItems value="#{relatorioVendaSituacao.statusVendas}"
										var="statusVendas" itemValue="#{statusVendas}"
										itemLabel="#{statusVendas.descricao}" />
								</p:selectOneMenu>
							</div>
							<div class="save ui-g-12">
								<p:commandButton value="Gerar" style="width: auto;"
									action="#{relatorioVendaSituacao.emitir()}" update="@form"
									process="@form" icon="fa fa-save" styleClass="green-btn topo"
									ajax="false" />
							</div>

						</div>
					</div>
				</div>
			</div>
		</h:form>
	</ui:define>

</ui:composition>
