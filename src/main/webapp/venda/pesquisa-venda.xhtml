<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	template="/WEB-INF/template.xhtml">

	<ui:define name="title">Pesquisa Vendas</ui:define>


	<ui:define name="toolbar">
		<p:commandButton value="Pagar" icon="fa fa-check-square-o"
			oncomplete="PF('confirmacaoExclusao').show()" process="@this"
			title="Pagar venda" />
	</ui:define>

	<f:metadata>
		<f:viewAction action="#{pesquisaVendaBean.inicializar()}" />
	</f:metadata>
	<ui:define name="search">
		<div class="ui-fluid">
			<div class="ui-g-12">
				<div class="card card-w-title">
					<h1>Pesquisa Venda no Segue-me</h1>
					<div class="ui-g">
						<div class="ui-g-12">
							<p:selectOneRadio id="paraQuem"
								value="#{pesquisaVendaBean.filter.paraQuemVenda}"
								layout="responsive" columns="4" required="true">

								<f:selectItems value="#{pesquisaVendaBean.paraQuemVenda}"
									var="praquem" itemValue="#{praquem}"
									itemLabel="#{praquem.descricao}" />
								<p:ajax event="change" update="pnlCliente, pnlClienteLabel"
									process="paraQuem"
									listener="#{pesquisaVendaBean.onCarregarNome()}" />
							</p:selectOneRadio>
						</div>

						<div class="ui-g-12">
							<p:outputPanel id="pnlClienteLabel">
								<p:outputLabel id="Lbseguimista" value="Seguimista"
									for="seguimista"
									rendered="#{pesquisaVendaBean.filter.paraQuemVenda.descricao =='Seguimista'}" />

								<p:outputLabel id="LbCasal" value="Casal" for="casal"
									rendered="#{pesquisaVendaBean.filter.paraQuemVenda.descricao =='Casal'}" />

								<p:outputLabel id="LbSeguidor" value="Seguidor" for="seguidor"
									rendered="#{pesquisaVendaBean.filter.paraQuemVenda.descricao =='Seguidor'}" />

								<p:outputLabel id="Lbpadre" value="Padre / Bispo" for="padre"
									rendered="#{pesquisaVendaBean.filter.paraQuemVenda.descricao =='Padre/Bispo'}" />
							</p:outputPanel>
						</div>

						<div class="ui-g-12">
							<p:outputPanel id="pnlCliente">

								<p:autoComplete id="seguimista"
									rendered="#{pesquisaVendaBean.filter.paraQuemVenda.descricao == 'Seguimista'}"
									styleClass="Fleft" autocomplete="off"
									value="#{pesquisaVendaBean.filter.evento}"
									completeMethod="#{pesquisaVendaBean.buscaPessoasSeguimista}"
									var="seguidor"
									itemLabel="#{seguidor.seguidor.apelido} #{seguidor.circulo.corCirculo}"
									itemValue="#{seguidor}" minQueryLength="3" maxResults="10"
									forceSelection="true" emptyMessage="Nome não encontrado!">
									<p:ajax event="itemSelect" update="@form" />
									<p:column>
										<p:outputLabel value="#{seguidor.seguidor.apelido}" />
									</p:column>

									<p:column>
										<p:outputLabel value="#{seguidor.circulo.corCirculo}" />
									</p:column>

								</p:autoComplete>

								<p:autoComplete id="casal"
									rendered="#{pesquisaVendaBean.filter.paraQuemVenda.descricao == 'Casal'}"
									styleClass="Fleft" autocomplete="off"
									value="#{pesquisaVendaBean.filter.evento}"
									completeMethod="#{pesquisaVendaBean.buscaPessoasCasal}"
									var="casal"
									itemLabel="#{casal.casal.apelidoEle} #{casal.equipe.titulo}"
									itemValue="#{casal}" minQueryLength="3" maxResults="10"
									forceSelection="true" emptyMessage="Casal não encontrado!">
									<p:ajax event="itemSelect" update="@form" />
									<p:column>
										<p:outputLabel value="#{casal.casal.apelidoEle}" />
									</p:column>

									<p:column>
										<p:outputLabel value="#{casal.equipe.titulo}" />
									</p:column>

								</p:autoComplete>

								<p:autoComplete id="seguidor"
									rendered="#{pesquisaVendaBean.filter.paraQuemVenda.descricao == 'Seguidor'}"
									styleClass="Fleft" autocomplete="off"
									value="#{pesquisaVendaBean.filter.evento}"
									completeMethod="#{pesquisaVendaBean.buscaPessoas}"
									var="seguidor"
									itemLabel="#{seguidor.seguidor.apelido} #{seguidor.equipe.titulo}"
									itemValue="#{seguidor}" minQueryLength="3" maxResults="10"
									forceSelection="true" emptyMessage="Nome não encontrado!">
									<p:ajax event="itemSelect" update="@form" />
									<p:column>
										<p:outputLabel value="#{seguidor.seguidor.apelido}" />
									</p:column>

									<p:column>
										<p:outputLabel value="#{seguidor.equipe.titulo}" />
									</p:column>

								</p:autoComplete>



								<p:autoComplete id="padre"
									rendered="#{pesquisaVendaBean.filter.paraQuemVenda.descricao == 'Padre/Bispo'}"
									styleClass="Fleft" autocomplete="off"
									value="#{pesquisaVendaBean.filter.evento}"
									completeMethod="#{pesquisaVendaBean.buscaPessoasPadre}"
									var="padre"
									itemLabel="#{padre.padre.apelido} #{padre.equipe.titulo}"
									itemValue="#{padre}" minQueryLength="3" maxResults="10"
									forceSelection="true"
									emptyMessage="Padre/Bispo não encontrado!">
									<p:ajax event="itemSelect" update="@form" />
									<p:column>
										<p:outputLabel value="#{padre.padre.apelido}" />
									</p:column>
									<p:column>
										<p:outputLabel value="#{padre.equipe.titulo}" />
									</p:column>

								</p:autoComplete>
							</p:outputPanel>
						</div>
						<div class="ui-g-12">
							<p:selectOneMenu id="situacao"
								value="#{pesquisaVendaBean.filter.status}">
								<f:selectItem itemLabel="Situação da Venda" />
								<f:selectItems value="#{pesquisaVendaBean.statusVendas}"
									var="statusVendas" itemValue="#{statusVendas}"
									itemLabel="#{statusVendas.descricao}" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12">
							<p:calendar id="data" placeholder="Data da Venda"
								value="#{pesquisaVendaBean.filter.dtInicio}" mask="true"
								pattern="dd/MM/yyyy" mode="popup" showButtonPanel="true"
								showOn="button" />
						</div>
						<div class="ui-g-12">
							<p:commandButton id="pesquisar" value="Pesquisar"
								style="width: auto;" action="#{pesquisaVendaBean.pesquisar()}"
								update="@form" process="@form" icon="fa fa-search"
								styleClass="green-btn" />
							<p:defaultCommand target="pesquisar" />
						</div>
					</div>
				</div>
			</div>
		</div>
	</ui:define>

	<ui:define name="content">

		<h:form id="form">
			<ui:include src="/WEB-INF/facelets/venda/venda-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>Pesquisa Venda</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />

						<div class="ui-g">

							<p:dataTable var="venda" id="datatable-venda"
								value="#{pesquisaVendaBean.listaVenda}" reflow="true"
								selectionMode="single" sortBy="#{venda.statusVenda}"
								selection="#{pesquisaVendaBean.vendaSelecionado}"
								rowKey="#{venda}" emptyMessage="Venda não encontrada!">

								<p:ajax event="rowSelect"
									listener="#{pesquisaVendaBean.selecionar()}" />

								<p:column headerText="Selecionar" width="50">
									<p:selectBooleanCheckbox
										value="#{pesquisaVendaBean.vendaAdicionadaParaPagar}"
										styleClass="Fleft" disabled="#{venda.statusVenda != 'ABERTO'}">
										<p:ajax listener="#{pesquisaVendaBean.adicionaVenda(venda)}" />
									</p:selectBooleanCheckbox>
								</p:column>

								<p:column headerText="Data da Venda" width="150">
									<h:outputLabel value="#{venda.dataVenda}">
										<f:convertDateTime pattern="dd/MM/yyyy" />
									</h:outputLabel>
								</p:column>

								<p:column headerText="Comprador" width="350">
									<h:outputText
										value="#{venda.evento.seguidor.apelido} - #{venda.evento.equipe.titulo}"
										rendered="#{venda.evento.seguidor != null and venda.evento.inscricao == null}" />

									<h:outputText
										value="#{venda.evento.seguidor.apelido} - #{venda.evento.seguidor.circulo.corCirculo}"
										rendered="#{venda.evento.seguidor != null and venda.evento.inscricao != null}" />

									<h:outputText
										value="#{venda.evento.casal.apelidoEle} e #{venda.evento.casal.apelidoEla}"
										rendered="#{venda.evento.casal != null}" />

									<h:outputText value="#{venda.evento.padre.apelido}"
										rendered="#{venda.evento.padre != null}" />
								</p:column>
								<p:column headerText="Situação"
									sortBy="#{venda.statusVenda.descricao}">
									<span class="situacao #{venda.statusVenda.coresParaStyle}">#{venda.statusVenda.descricao}</span>
								</p:column>

								<p:column headerText="valor R$" sortBy="#{venda.valorTotal}">
									<h:outputText value="#{venda.valorTotal}">
										<f:convertNumber type="currency" />
									</h:outputText>
								</p:column>

								<f:facet name="footer">
       Valor Total R$ #{pesquisaVendaBean.totalPesquisa}
    </f:facet>
							</p:dataTable>
						</div>
					</div>
				</div>
			</div>
			<p:confirmDialog header="Pagar as Vendas"
				message="Tem certeza que deseja PAGAR a Venda?"
				widgetVar="confirmacaoExclusao" id="confirmacaoExclusaoDialog">
				<p:button value="Não"
					onclick="PF('confirmacaoExclusao').hide(); return false;" />
				<p:commandButton value="Sim" action="#{pesquisaVendaBean.salvar()}"
					oncomplete="PF('confirmacaoExclusao').hide();" process="@this"
					update="@form" />
			</p:confirmDialog>
		</h:form>

	</ui:define>

</ui:composition>
