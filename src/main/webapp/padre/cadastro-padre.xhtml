<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="title">Cadastro Padre/Bispo</ui:define>

	<f:metadata>
		<o:viewParam name="padre" value="#{cadastroPadreBean.padre}" />
		<f:viewAction action="#{cadastroPadreBean.inicializar()}" />
	</f:metadata>
	<ui:define name="toolbar">
		<p:button outcome="/padre/pesquisa-padre" value="Pesquisar"
			icon="fa fa-search" />
	</ui:define>
	<ui:define name="cancelar">
		<p:commandButton icon="fa fa-trash" value="Excluir"
			style="width: auto; margin-left: 15px;"
			oncomplete="PF('confirmacaoExclusao').show();" process="@this"
			styleClass="red-btn"
			update=":form-cadastro:confirmacaoExclusaoDialog"
			rendered="#{cadastroPadreBean.editando}" />
		<p:button value="Cancelar" style="width: auto; margin-left: 15px;"
			outcome="pesquisa-padre" icon="fa fa-remove" />
	</ui:define>
	<ui:define name="content">
		<h:form id="form-cadastro" enctype="multipart/form-data">
			<ui:include src="/WEB-INF/facelets/padre/padre-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>#{cadastroPadreBean.editando ? 'Edição Padre/Bispo' :
							'Novo Padre/Bispo'}</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
						<p:growl />
						<div class="ui-g">
							<p:focus for="nome" />
							<ui:include
								src="/WEB-INF/facelets/padre/cadastro-padre.xhtml" />
						</div>
					</div>
				</div>
			</div>
			<p:confirmDialog header="Exclusão do Padre/Bispo"
				message="Tem certeza que deseja excluir o Padre/Bispo #{cadastroPadreBean.padre.apelido}"
				widgetVar="confirmacaoExclusao" id="confirmacaoExclusaoDialog">
				<p:button value="Não"
					onclick="PF('confirmacaoExclusao').hide(); return false;" />
				<p:commandButton value="Sim"
					action="#{cadastroPadreBean.excluir()}"
					oncomplete="PF('confirmacaoExclusao').hide();" process="@this"
					update="@form" />
			</p:confirmDialog>
		</h:form>
	</ui:define>
</ui:composition>
