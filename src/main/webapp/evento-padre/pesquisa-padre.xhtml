<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	template="/WEB-INF/template.xhtml">

	<ui:define name="title">Pesquisa Padre/Bispo no Segue-me</ui:define>

	<f:metadata>
		<f:viewAction action="#{pesquisaEventoPadreBean.inicializar()}" />
	</f:metadata>

	<ui:define name="search">
		<div class="ui-fluid">
			<div class="ui-g-12">
				<div class="card card-w-title">
					<h1>Pesquisa Padre/Bispo no Segue-me</h1>
					<div class="ui-g">
						<div class="ui-g-12 ui-lg-6">
							<p:selectOneMenu id="Paroquia"
								value="#{pesquisaEventoPadreBean.filter.paroquia}"
								disabled="#{not seguranca.administradorGeral}">
								<f:selectItem itemLabel="Todos as Paroquias" />
								<f:selectItems value="#{pesquisaEventoPadreBean.listaParoquia}"
									var="paroquia" itemValue="#{paroquia}"
									itemLabel="#{paroquia.descricao}" />
								<p:ajax listener="#{pesquisaEventoPadreBean.onSegueMeChange()}"
									update="segueMe" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:selectOneMenu id="segueMe" label="Segue-Me"
								value="#{pesquisaEventoPadreBean.filter.segueMe}"
								disabled="#{not seguranca.administrador}">
								<f:selectItem itemLabel="Todos os Segue-Me"
									noSelectionOption="true" />
								<f:selectItems value="#{pesquisaEventoPadreBean.listaSegueMe}"
									var="segueMe" itemValue="#{segueMe}"
									itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:selectOneMenu id="equipe"
								value="#{pesquisaEventoPadreBean.filter.equipe}"
								disabled="#{not seguranca.graficaAndComandante}">
								<f:selectItem itemLabel="Todos as Equipes" />
								<f:selectItems value="#{pesquisaEventoPadreBean.listaEquipes}"
									var="equipe" itemValue="#{equipe}" itemLabel="#{equipe.titulo}" />
								<p:ajax listener="#{pesquisaEventoPadreBean.onEquipeChange()}"
									update="funcao" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:selectOneMenu id="funcao" label="Função"
								value="#{pesquisaEventoPadreBean.filter.funcao}">
								<f:selectItem itemLabel="Todas as Funções"
									noSelectionOption="true" />
								<f:selectItems value="#{pesquisaEventoPadreBean.listaFuncaos}"
									var="funcao" itemValue="#{funcao}"
									itemLabel="#{funcao.descricao}" />
							</p:selectOneMenu>
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:inputText id="nome" placeholder="Nome do Seguidor"
								autocomplete="off"
								value="#{pesquisaEventoPadreBean.filter.nome}" />
						</div>
						<div class="ui-g-12 ui-lg-6">
							<p:inputText id="apelido" placeholder="Apelido"
								autocomplete="off"
								value="#{pesquisaEventoPadreBean.filter.apelido}" />
						</div>
						<div class="ui-g-12">
							<p:commandButton id="pesquisar" value="Pesquisar"
								style="width: auto;"
								action="#{pesquisaEventoPadreBean.pesquisar()}" update="@form"
								process="@form" icon="fa fa-search" styleClass="green-btn" />
							<p:defaultCommand target="pesquisar" />
						</div>
					</div>
				</div>
			</div>
		</div>
	</ui:define>

	<ui:define name="content">

		<h:form id="form">
			<ui:include src="/WEB-INF/facelets/evento-padre/padre-toolbar.xhtml"/>
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>Lista de Padre/Bispo no Segue-me</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />

						<div class="ui-g">

							<div class="ui-g-12">
								<h:outputText style="color:#777;"
									value="Marque os participantes na lista e escolha: imprimir os crachás (gera o PDF), ou atualizar a situação (impresso / não impresso)." />
							</div>

							<div class="ui-g-12">
								<p:commandButton value="Imprimir selecionados"
									style="width: auto; margin-right: 25px;" icon="fa fa-print"
									styleClass="green-btn"
									title="Gera o PDF dos crachás dos participantes marcados, para imprimir."
									action="#{pesquisaEventoPadreBean.imprimirSelecionados()}"
									process="@form" ajax="false" />
								<h:outputText style="color:#777; margin-right: 6px;"
									value="Situação:" />
								<p:commandButton value="Marcar como impresso" type="button"
									style="width: auto;" icon="fa fa-check"
									title="Muda a situação para impresso nos participantes marcados."
									onclick="PF('confMarcarImpressos').show();" />
								<p:commandButton value="Marcar como não impresso" type="button"
									style="width: auto;" icon="fa fa-undo"
									title="Muda a situação para não impresso (para reimprimir depois)."
									onclick="PF('confMarcarImprimir').show();" />
							</div>


							<p:dataTable var="padre" id="datatable-padre"
								value="#{pesquisaEventoPadreBean.listaEventoSeguidor}"
								reflow="true" selectionMode="single"
								selection="#{pesquisaEventoPadreBean.evento}" rowKey="#{padre}"
								emptyMessage="Padre/Bispo não encontrado!" paginator="true"
								sortBy="#{padre.equipe.ordem}"
								paginatorTemplate="{CurrentPageReport} {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
								currentPageReportTemplate=" Exibindo de {startRecord} a {endRecord} no total de {totalRecords} - Página: {currentPage}/{totalPages} "
								rows="25" rowsPerPageTemplate="25,50,100,150,200">

								<p:ajax event="rowSelect"
									listener="#{pesquisaEventoPadreBean.selecionar()}" />

								<p:column headerText="Sel." width="30">
									<h:selectBooleanCheckbox value="#{padre.selecionado}"
										onclick="event.stopPropagation();" />
								</p:column>

								<p:column headerText="Nome" sortBy="#{padre.padre.nome}"
									width="200">
									<h:outputText value="#{padre.padre.nome} (#{padre.padre.apelido})" />
								</p:column>

								<p:column headerText="Telefone"
									sortBy="#{padre.padre.telefoneUm}" width="100">
									<h:outputText value="#{padre.padre.telefoneUm}" />
								</p:column>

								<p:column headerText="Equipe" sortBy="#{padre.equipe.titulo}"
									width="100">
									<h:outputText value="#{padre.equipe.titulo}" />
								</p:column>

								<p:column headerText="Função" sortBy="#{padre.funcao.descricao}"
									width="100">
									<h:outputText value="#{padre.funcao.descricao}" />
								</p:column>
								<p:column headerText="Situação" width="50"
									sortBy="#{padre.statusConvite.nome}">
									<span class="situacao #{padre.statusConvite.coresParaStyle}">#{padre.statusConvite.nome}</span>
								</p:column>

								<p:column headerText="Paroquia"
									sortBy="#{padre.segueMe.paroquia.descricao}"
									rendered="#{seguranca.administradorGeral}" width="200">
									<h:outputText value="#{padre.segueMe.paroquia.descricao}" />
								</p:column>

								<p:column headerText="Segue-me"
									sortBy="#{padre.segueMe.numeroRomano.numeroRomano}"
									rendered="#{seguranca.administrador}" width="50">
									<h:outputText
										value="#{padre.segueMe.numeroRomano.numeroRomano}" />
								</p:column>

								<p:column headerText="Crachá Impresso?" sortBy="#{padre.cracha}"
									width="50">
									<h:outputText value="#{padre.cracha ? 'Não impresso' : 'Impresso'}" style="padding:2px 8px; border-radius:10px; color:#fff; font-size:0.85em; white-space:nowrap; background-color:#{padre.cracha ? '#9e9e9e' : '#66bb6a'};" />
								</p:column>
							</p:dataTable>

							<p:confirmDialog widgetVar="confMarcarImprimir"
								header="Marcar como não impresso"
								message="Marcar os participantes selecionados como NÃO impressos? Eles voltam para a fila de impressão.">
								<p:commandButton value="Sim" icon="fa fa-check"
									action="#{pesquisaEventoPadreBean.marcarSelecionadosParaImprimir()}"
									process="@form" update="@form"
									oncomplete="PF('confMarcarImprimir').hide();" />
								<p:commandButton value="Não" type="button" icon="fa fa-close"
									onclick="PF('confMarcarImprimir').hide();" />
							</p:confirmDialog>

							<p:confirmDialog widgetVar="confMarcarImpressos"
								header="Marcar como impresso"
								message="Marcar os participantes selecionados como impressos?">
								<p:commandButton value="Sim" icon="fa fa-check"
									action="#{pesquisaEventoPadreBean.marcarSelecionadosComoImpressos()}"
									process="@form" update="@form"
									oncomplete="PF('confMarcarImpressos').hide();" />
								<p:commandButton value="Não" type="button" icon="fa fa-close"
									onclick="PF('confMarcarImpressos').hide();" />
							</p:confirmDialog>

							<p:dialog header="#{pesquisaEventoPadreBean.evento.padre.nome}"
								id="fotoDialog" widgetVar="fotoDialogWidgetVar">
								<p:graphicImage
									value="#{pesquisaEventoPadreBean.evento.padre.carregarImagem()}"
									style="max-width: 300px" id="produtoFoto" />
							</p:dialog>
						</div>
					</div>
				</div>
			</div>
		</h:form>

	</ui:define>

</ui:composition>
