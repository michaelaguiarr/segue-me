<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:jsf="http://xmlns.jcp.org/jsf" xmlns:p="http://primefaces.org/ui"
	xmlns:o="http://omnifaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="title">Cadastro Padre/Bispo no Segue-me</ui:define>

	<ui:define name="toolbar">
		<p:button outcome="/evento-padre/pesquisa-padre" value="Pesquisar"
			icon="fa fa-search" />
	</ui:define>

	<f:metadata>
		<o:viewParam name="padre" value="#{cadastroEventoPadreBean.evento}" />
		<f:viewAction action="#{cadastroEventoPadreBean.inicializar()}" />
	</f:metadata>

	<ui:define name="content">
		<h:form id="form-cadastro" enctype="multipart/form-data">
			<ui:include src="/WEB-INF/facelets/evento-padre/padre-toolbar.xhtml" />
			<div class="ui-fluid">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>#{cadastroEventoPadreBean.editando ? 'Edição Seguidor' :
							'Novo Seguidor'}</h1>
						<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
						<p:growl />
						<p:focus for="equipe" />
						<div class="ui-g">
							<div class="ui-g-12">
								<!-- Seguidor -->
								<p:fieldset legend="Segue-Me">
									<div class="ui-g-6">
										<p:outputLabel value="Paroquia" for="paroquia" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Segue-Me" for="segueMe" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="paroquia"
											value="#{cadastroEventoPadreBean.paroquia}" required="true"
											disabled="#{not seguranca.administradorGeral}">
											<f:selectItem itemLabel="Selecione a Paroquia" />
											<f:selectItems
												value="#{cadastroEventoPadreBean.listaParoquia}"
												var="paroquia" itemValue="#{paroquia}"
												itemLabel="#{paroquia.descricao}" />
											<p:ajax
												listener="#{cadastroEventoPadreBean.onSegueMeChange()}"
												update="segueMe" />
										</p:selectOneMenu>
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="segueMe" label="Segue-me" required="true"
											value="#{cadastroEventoPadreBean.evento.segueMe}"
											disabled="#{not seguranca.administrador}">
											<f:selectItem itemLabel="Selecione o Segue-Me" />
											<f:selectItems
												value="#{cadastroEventoPadreBean.listaSegueMe}"
												var="segueMe" itemValue="#{segueMe}"
												itemLabel="#{segueMe.titulo} - #{segueMe.numeroRomano.numeroRomano}" />
										</p:selectOneMenu>
									</div>
									<div class="ui-g-6">
										<p:outputLabel value="Equipe" for="equipe" />
									</div>

									<div class="ui-g-6">
										<p:outputLabel value="Função" for="funcao" />
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="equipe"
											value="#{cadastroEventoPadreBean.evento.equipe}"
											required="true"
											disabled="#{not seguranca.graficaAndComandante}">
											<f:selectItem itemLabel="Selecione a Equipe" />
											<f:selectItems
												value="#{cadastroEventoPadreBean.listaEquipes}" var="equipe"
												itemValue="#{equipe}" itemLabel="#{equipe.titulo}" />
											<p:ajax
												listener="#{cadastroEventoPadreBean.onEquipeChange()}"
												update="funcao" />
										</p:selectOneMenu>
									</div>

									<div class="ui-g-6 ui-lg-6">
										<p:selectOneMenu id="funcao" label="Função" required="true"
											value="#{cadastroEventoPadreBean.evento.funcao}">
											<f:selectItem itemLabel="Selecione a Função" />
											<f:selectItems
												value="#{cadastroEventoPadreBean.listaFuncaos}" var="funcao"
												itemValue="#{funcao}" itemLabel="#{funcao.descricao}" />
										</p:selectOneMenu>
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:outputLabel value="Situação" for="situacao" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:outputLabel value="Observação" for="obs" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:selectOneMenu id="situacao"
											value="#{cadastroEventoPadreBean.evento.statusConvite}"
											required="false">
											<f:selectItem itemLabel="Selecione a Situação" />
											<f:selectItems
												value="#{cadastroEventoPadreBean.statusConvites}"
												var="status" itemValue="#{status}"
												itemLabel="#{status.nome}" />
										</p:selectOneMenu>
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:inputTextarea rows="6" cols="33" id="obs"
											value="#{cadastroFichaBean.evento.motivoRecusa}" />
									</div>
									<div class="ui-g-12"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:outputLabel value="Imprimir Crachá?" for="cracha" />
									</div>

									<div class="ui-g-12 ui-lg-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:selectBooleanButton id="cracha"
											value="#{cadastroEventoPadreBean.evento.cracha}"
											onLabel="Sim" offLabel="Não" onIcon="ui-icon-check"
											offIcon="ui-icon-close" style="width:60px" />
									</div>

								</p:fieldset>
							</div>
							<div class="ui-g-12">
								<!-- Seguidor -->
								<p:fieldset legend="Padre/Bispo">
									<div class="ui-g-12">
										<p:graphicImage
											value="#{cadastroEventoPadreBean.evento.padre.carregarImagem()}"
											rendered="#{cadastroEventoPadreBean.evento.padre.exibirImagem}"
											width="150px" height="150px" id="fotoEvento"
											onclick="PF('fotoDialogWidgetVar').show()" cache="FALSE" />
									</div>

									<div class="ui-g-12">
										<p:outputLabel
												value="Padre/Bispo (busque por nome, apelido ou telefone)"
												for="padre" />
									</div>

									<div class="ui-g-12 ui-md-12 ui-lg-12">
										<div class="ui-inputgroup">
											<p:autoComplete id="padre" required="true"
												style="width: 90%;" styleClass="Fleft" autocomplete="off"
												value="#{cadastroEventoPadreBean.evento.padre}"
												completeMethod="#{cadastroEventoPadreBean.buscaPessoas}"
												var="padre" itemLabel="#{padre.nome}" itemValue="#{padre}"
												minQueryLength="3" maxResults="10" forceSelection="true"
												emptyMessage="Nome não encontrado!">
												<p:ajax event="itemSelect" update="@form" />
												<p:column>
													<p:outputLabel value="#{padre.nome}" />
												</p:column>

												<p:column>
													<p:outputLabel value="#{padre.apelido}" />
												</p:column>

												<p:column>
													<p:outputLabel value="#{padre.telefoneUm}" />
												</p:column>

											</p:autoComplete>
											<p:button icon="fa fa-plus"
												outcome="/evento-padre/cadastro-padre"
												style="width: 10%; margin: 0;" id="novo-padre"
												styleClass="white-button"
												rendered="#{not cadastroEventoPadreBean.padreValido}" />
											<p:button icon="fa fa-pencil"
												outcome="/evento-padre/cadastro-padre"
												style="width: 10%; margin: 0;" id="editar-padre"
												styleClass="white-button"
												rendered="#{cadastroEventoPadreBean.padreValido}">
												<f:param name="padre"
													value="#{cadastroEventoPadreBean.evento.padre.id}" />
											</p:button>
										</div>
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:outputLabel value="Apelido" for="apelido" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:outputLabel value="Telefone 1" for="telefoneUm" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:inputText placeholder="Nome no Crachá" id="apelido"
											required="true"
											value="#{cadastroEventoPadreBean.evento.padre.apelido}" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:inputMask id="telefoneUm" placeholder="Telefone 1"
											value="#{cadastroEventoPadreBean.evento.padre.telefoneUm}"
											mask="(99)999999999">
										</p:inputMask>
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:outputLabel value="Email" for="email" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:outputLabel value="Data de Ordenação" for="order" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:inputText placeholder="Email" id="email"
											value="#{cadastroEventoPadreBean.evento.padre.email}" />
									</div>


									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:calendar id="order" required="true"
											value="#{cadastroEventoPadreBean.evento.padre.dataOrdenacao}"
											mask="true" pattern="dd/MM/yyyy" mode="popup"
											showButtonPanel="true" showOn="button" />
									</div>
								</p:fieldset>
							</div>
							<div class="ui-g-12"
								jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
								<!-- Endereco -->
								<p:fieldset legend="Endereço">
									<div class="ui-g-12"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:outputLabel value="Endereço" for="endereco" />
									</div>
									<div class="ui-g-12 ui-lg-12"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:inputText id="endereco" required="true"
											value="#{cadastroEventoPadreBean.evento.padre.endereco.logradouro}" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:outputLabel value="Número" for="numero" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:outputLabel value="Bairro" for="bairro" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:inputText id="numero" required="true"
											value="#{cadastroEventoPadreBean.evento.padre.endereco.numero}" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:inputText id="bairro" required="true"
											value="#{cadastroEventoPadreBean.evento.padre.endereco.bairro}" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:outputLabel value="Cidade" for="cidade" />
									</div>

									<div class="ui-g-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:outputLabel value="UF" for="uf" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:inputText id="cidade" required="true"
											value="#{cadastroEventoPadreBean.evento.padre.endereco.cidade}" />
									</div>

									<div class="ui-g-6 ui-lg-6"
										jsf:rendered="#{cadastroEventoPadreBean.padreValido}">
										<p:selectOneMenu id="uf" label="UF" required="true"
											value="#{cadastroEventoPadreBean.evento.padre.endereco.estado}">
											<f:selectItem itemLabel="Selecione" />
											<f:selectItems value="#{cadastroFichaBean.estados}"
												var="estado" itemValue="#{estado.sigla}"
												itemLabel="#{estado.sigla}" />
										</p:selectOneMenu>
									</div>
								</p:fieldset>
							</div>
							<div class="save ui-g-12">
								<p:commandButton id="salvar" value="Salvar" style="width: auto;"
									action="#{cadastroEventoPadreBean.salvar()}" update="@form"
									process="@form" icon="fa fa-save" styleClass="green-btn"
									title="Somente a Gráfica tem acesso." />

								<p:commandButton icon="fa fa-trash" value="Excluir"
									style="width: auto; margin-left: 15px;"
									oncomplete="PF('confirmacaoExclusao').show();" process="@this"
									styleClass="red-btn"
									update=":form-cadastro:confirmacaoExclusaoDialog"
									rendered="#{cadastroEventoPadreBean.editando}" />

								<p:button value="Cancelar"
									style="width: auto; margin-left: 15px;"
									outcome="pesquisa-padre" icon="fa fa-remove" />
								<p:defaultCommand target="salvar" />
							</div>
						</div>
					</div>
				</div>
			</div>

			<p:dialog header="#{cadastroEventoPadreBean.evento.padre.nome}"
				id="fotoDialog" widgetVar="fotoDialogWidgetVar">
				<p:graphicImage
					value="#{cadastroEventoPadreBean.evento.padre.carregarImagem()}"
					style="max-width: 300px"
					rendered="#{cadastroEventoPadreBean.evento.padre.exibirImagem}"
					id="produtoFoto" />
			</p:dialog>

			<p:confirmDialog header="Exclusão do Padre/Bispo do Evento"
				message="Tem certeza que deseja excluir o Seguidor #{cadastroEventoPadreBean.evento.padre.nome}"
				widgetVar="confirmacaoExclusao" id="confirmacaoExclusaoDialog">
				<p:button value="Não"
					onclick="PF('confirmacaoExclusao').hide(); return false;" />
				<p:commandButton value="Sim"
					action="#{cadastroEventoPadreBean.excluir()}"
					oncomplete="PF('confirmacaoExclusao').hide();" process="@this"
					update="@form" />
			</p:confirmDialog>
		</h:form>
	</ui:define>

</ui:composition>
