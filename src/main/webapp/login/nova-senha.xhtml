<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" xmlns:o="http://omnifaces.org/ui"
	template="/WEB-INF/template/template-login.xhtml">

	<ui:define name="title">Interlab - Nova Senha</ui:define>
	<ui:define name="sub-title">Nova Senha</ui:define>

	<ui:define name="content">
		<f:metadata>
			<o:viewParam name="cod"
				value="#{novaSenhaUsuarioController.codUsuario}" />
			<o:viewParam name="hash" value="#{novaSenhaUsuarioController.hash}" />
			<f:viewAction action="#{novaSenhaUsuarioController.inicializar()}" />
		</f:metadata>

		<h:form id="frm">
			<div class="card card-w-title ui-fluid">
				<ui:include src="/WEB-INF/facelets/mensagem/messages.xhtml" />
				<div class="card card-w-title ui-fluid">
					<p:focus for="senha" />
					<p:panelGrid columns="2" layout="grid"
						styleClass="ui-panelgrid-blank form-group"
						columnClasses="ui-grid-col-3,ui-grid-col-9">

						<p:outputLabel value="Nome" />
						<p:outputLabel
							value="#{novaSenhaUsuarioController.usuario.nomeCompleto}" />

						<p:outputLabel value="Matrícula" />
						<p:outputLabel
							value="#{novaSenhaUsuarioController.usuario.matricula}" />

						<p:outputLabel value="Email" />
						<p:outputLabel value="#{novaSenhaUsuarioController.usuario.email}" />
					</p:panelGrid>

					<p:panelGrid columns="3" layout="grid"
						styleClass="ui-panelgrid-blank form-group"
						columnClasses="ui-grid-col-3,ui-grid-col-4, ui-grid-col-5">

						<p:outputLabel value="Escolha sua senha" for="senha" />

						<p:password id="senha"
							value="#{novaSenhaUsuarioController.usuario.senha}"
							match="senha2" validatorMessage="Senhas precisam ser iguais"
							feedback="true" inline="true" promptLabel="Digite a senha"
							weakLabel="Força da senha : Fraca"
							goodLabel="Força da senha : Média"
							strongLabel="Força da senha : Forte" />

						<p:password placeholder="Novamente a senha" id="senha2"
							match="senha2" />
					</p:panelGrid>

					<p:panelGrid columns="3" layout="grid" style="margin-top: 10px;"
						styleClass="ui-panelgrid-blank form-group"
						columnClasses="ui-grid-col-3,ui-grid-col-5, ui-grid-col-4">

						<p:outputLabel value="" />
						<p:commandButton value="Alterar" styleClass="raised-btn"
							action="#{novaSenhaUsuarioController.salvar()}" icon="fa fa-save"
							process="@form" update="@form" />

						<p:button value="Cancelar" process="@this" outcome="/login"
							styleClass="red-btn raised-btn" icon="fa fa-remove" />
					</p:panelGrid>
				</div>
			</div>
		</h:form>
	</ui:define>
</ui:composition>
