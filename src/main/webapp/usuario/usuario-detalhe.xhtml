<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:p="http://primefaces.org/ui" template="/WEB-INF/template.xhtml">

	<ui:define name="title">Gerenciamento de Usuário</ui:define>

	<f:metadata>
		<f:viewParam name="usuario" value="#{detalhesUsuarioBean.usuario}" />
		<f:viewAction action="#{detalhesUsuarioBean.inicializar()}" />
	</f:metadata>

	<ui:define name="content">
		<ui:include src="/WEB-INF/facelets/usuario/usuario-toolbar.xhtml" />
		<div class="ui-fluid">
			<div class="ui-g">
				<div class="ui-g-12">
					<div class="card card-w-title">
						<h1>Gerenciamento de Usuário -
							#{detalhesUsuarioBean.usuario.nome}</h1>
						<p:tabView id="tabview" scrollable="true">
							<p:tab title="Informações Pessoais">
								<ui:include
									src="/WEB-INF/facelets/usuario/usuario-informacoes-pessoais.xhtml" />
							</p:tab>

							<p:tab title="Senha">
								<ui:include src="/WEB-INF/facelets/usuario/usuario-muda-senha.xhtml" />
							</p:tab>
						</p:tabView>
					</div>
				</div>
			</div>
		</div>

	</ui:define>

</ui:composition>
